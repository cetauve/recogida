  /* COLORES DE BILLY'S, 18 nov 2026. Crema de base (no blanco puro: con focos
   * deslumbra), texto en azul marino y el rojo como UNICO acento, y solo en
   * linea y letra, nunca de relleno: el rojo quiere decir "esto lleva a otra
   * pantalla" (+ brands, back). Sin sombras: lo que esta encima se distingue
   * por ser un blanco algo mas claro y por un borde muy fino.
   * Los colores de las tres familias se quedan en los dibujos porque son los
   * mismos que la app del almacen y las vendedoras ya los reconocen. */
  :root{
    --fondo:#F4F2EE; --caja:#FDFCFA; --crema:#E6E2D9;
    --texto:#1B2A3D; --suave:#5B6675; --tenue:#8C94A0;
    --linea:rgba(27,42,61,.11); --linea2:rgba(27,42,61,.22);
    /* --borde y --cian los usa la pestana de comentarios. */
    --borde:var(--linea2); --cian:var(--rojo);
    --rojo:#EF3B26; --oro:#D99A06; --malo:#C8321F; --ok:#2E9E4F;
    --arriba:#2F6FBF; --abajo:#B0651F; --exterior:#34845A;
    --titulo:'Poppins',-apple-system,BlinkMacSystemFont,sans-serif;
    --texto-f:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    --suave-t:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);
    font-family:var(--texto-f);font-weight:400;letter-spacing:-.01em;
    overscroll-behavior:none;user-select:none;overflow:hidden;-webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column}
  button{font-family:inherit;color:inherit}

  /* ---- cabecera: piezas sueltas sobre el fondo, sin barra ---- */
  header{display:flex;align-items:center;gap:20px;padding:12px 18px 6px;flex:0 0 auto}
  .puesto{display:flex;flex-direction:column;gap:1px;text-decoration:none;color:inherit;
    border:1px solid var(--linea);border-radius:16px;padding:7px 15px;background:var(--caja);flex:0 0 auto;
    transition:transform .12s var(--suave-t)}
  .puesto b{font-family:var(--titulo);font-size:16px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
  .puesto span{font-size:10.5px;letter-spacing:.06em;text-transform:lowercase;color:var(--suave)}
  .puesto:active{transform:scale(.96)}
  .ficha{display:flex;align-items:baseline;gap:10px;min-width:170px}
  .ficha .et{font-size:13px;color:var(--suave);text-transform:lowercase}
  .ficha .n{font-family:var(--titulo);font-size:50px;font-weight:700;line-height:1;letter-spacing:-.03em;
    font-variant-numeric:tabular-nums;display:inline-block}
  /* El numero entra desde abajo cuando cambia: se ve que ha pasado algo sin
   * tener que leerlo. */
  .ficha .n.sube{animation:tic .38s var(--suave-t)}
  @keyframes tic{0%{transform:translateY(45%);opacity:0;color:var(--rojo)}60%{color:var(--rojo)}100%{transform:none;opacity:1}}
  .ultima{flex:1;font-size:14px;font-weight:300;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ultima b{color:var(--texto);font-weight:400}
  .estado{font-size:12.5px;color:var(--suave);background:var(--caja);border:1px solid var(--linea);
    border-radius:999px;padding:6px 13px;white-space:nowrap}
  .punto{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--tenue);margin-right:7px;
    vertical-align:1px;transition:background .3s}
  .punto.on{background:var(--ok)} .punto.off{background:var(--malo)}
  .banda{background:var(--texto);color:var(--crema);padding:6px;font-size:12.5px;text-align:center;flex:0 0 auto;
    letter-spacing:.02em}

  .cuerpo{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:16px;padding:10px 16px 16px;min-height:0}
  .izq{display:flex;flex-direction:column;gap:12px;min-height:0}

  /* ---- prendas, a la izquierda, SIEMPRE en el mismo sitio ---- */
  /* Las tres columnas ocupan SIEMPRE el mismo alto, el que deja la pantalla
   * despues de Premium: cada una reparte ese alto entre sus botones, asi que
   * todas acaban a la misma altura y nada se mete debajo de Premium, sea cual
   * sea la tablet. */
  .prendas{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:minmax(0,1fr);gap:10px;min-height:0}
  .fam{display:flex;flex-direction:column;gap:9px;min-height:0}
  .fam h2,.lado h3{margin:0 0 1px;font-size:12px;font-weight:400;color:var(--suave);text-transform:lowercase;
    letter-spacing:.01em;display:flex;align-items:center;gap:7px}
  .fam h2 i{width:7px;height:7px;border-radius:50%;display:block}
  button.cat{appearance:none;border:1px solid var(--linea);background:var(--caja);
    border-radius:22px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:7px;flex:1 1 0;min-height:0;overflow:hidden;
    transition:transform .1s var(--suave-t),border-color .16s,background-color .16s,box-shadow .16s}
  button.cat svg{width:38px;height:38px;display:block;flex:none;transition:transform .2s var(--suave-t)}
  button.cat b{font-family:var(--titulo);font-size:15.5px;font-weight:600;line-height:1.1;text-align:center;
    letter-spacing:-.015em;text-transform:lowercase}
  button.cat:active{transform:scale(.96)}
  /* Elegida: borde azul marino y el fondo crema. Sin rojo: el rojo es para ir a otra pantalla. */
  button.cat.on{border-color:var(--texto);background:var(--crema);box-shadow:0 0 0 1px var(--texto) inset}
  button.cat.on svg{transform:scale(1.08)}

  /* ---- premium: fila propia debajo de las tres familias ---- */
  .fila-prem{display:flex}
  button.cat.prem{flex:1;flex-direction:row;gap:12px;min-height:62px;border-color:color-mix(in srgb,var(--oro) 45%,transparent)}
  button.cat.prem svg{width:30px;height:30px}
  button.cat.prem.on{border-color:var(--oro);box-shadow:0 0 0 1px var(--oro) inset;background:color-mix(in srgb,var(--oro) 9%,var(--caja))}

  /* ---- marcas, a la derecha ---- */
  .lado{display:flex;flex-direction:column;gap:10px;min-height:0}
  .lado h3{min-height:30px;font-size:13px}
  .lado h3 svg{width:20px;height:20px}
  .lado h3 b{color:var(--rojo);font-weight:400}
  .marcas{display:grid;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,1fr);gap:10px;flex:1;min-height:0}
  button.marca{appearance:none;border:1px solid var(--linea);background:var(--caja);
    border-radius:22px;padding:10px 12px;line-height:1.1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-align:center;
    transition:transform .1s var(--suave-t),background-color .14s,border-color .14s;overflow:hidden}
  /* El logo manda y el nombre queda debajo. Todos los logos estan escalados a
   * la MISMA SUPERFICIE, no a la misma altura. */
  button.marca .lg{flex:0 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
  button.marca .lg img{display:block;max-width:100%;max-height:100%;object-fit:contain}
  button.marca .nb{font-family:var(--titulo);font-size:19px;font-weight:600;letter-spacing:-.015em;flex:none}
  button.marca:active{transform:scale(.965);background:var(--crema)}
  button.marca.cajon{border:1px dashed var(--linea2);background:transparent}
  button.marca.cajon .nb{color:var(--suave);font-weight:600;text-transform:lowercase}
  /* Al tocar una marca se marca en rojo al momento, antes de que conteste el
   * servidor: la vendedora sabe que el toque ha entrado. */
  button.marca.lanzada{border-color:var(--rojo);box-shadow:0 0 0 1px var(--rojo) inset;transform:scale(.97)}

  /* "+ brands": rojo de linea y letra, siempre abajo a la derecha. */
  button.marca.otra{grid-column:2;grid-row:3;border-color:color-mix(in srgb,var(--rojo) 55%,transparent);background:var(--caja)}
  button.marca.otra .nb{color:var(--rojo);font-size:28px;text-transform:lowercase}
  /* Segunda pantalla: sin logo; columnas y filas las pone el codigo segun cuantas haya. */
  .marcas.mas{gap:8px}
  .marcas.mas button.marca{border-radius:18px;padding:4px 8px}
  .marcas.mas button.marca .nb{font-size:19px;line-height:1.15}
  /* Premium: una columna de botones grandes, con el tipo debajo. */
  .marcas.prem{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}
  .marcas.prem button.marca{border-color:color-mix(in srgb,var(--oro) 45%,transparent);gap:4px}
  .marcas.prem button.marca .nb{font-size:30px}
  .marcas.prem button.marca .ti{font-size:13px;color:var(--suave);text-transform:lowercase}
  button.volver{appearance:none;margin-left:auto;border:1px solid color-mix(in srgb,var(--rojo) 55%,transparent);
    background:transparent;color:var(--rojo);border-radius:999px;font-size:13.5px;padding:5px 14px;
    text-transform:lowercase;transition:transform .1s var(--suave-t)}
  button.volver:active{transform:scale(.94)}

  /* ---- TRANSICIONES. Cortas a proposito (menos de un cuarto de segundo) y
   * solo de posicion y transparencia: durante el directo nada puede hacer
   * esperar, y los botones se pueden tocar desde el primer instante. Al elegir
   * prenda las marcas suben una detras de otra; al ir a "+ brands" entran por
   * la derecha y al volver, por la izquierda. ---- */
  .marcas > *{animation:sube .2s var(--suave-t) both;animation-delay:calc(var(--i,0) * 22ms)}
  .marcas[data-mov="ir"] > *{animation-name:derecha}
  .marcas[data-mov="vuelve"] > *{animation-name:izquierda}
  @keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes derecha{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
  @keyframes izquierda{from{opacity:0;transform:translateX(-26px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  .espera{display:flex;align-items:center;justify-content:center;height:100%;
    color:var(--suave);font-size:18px;font-weight:300;text-align:center;line-height:1.6;
    border:1px dashed var(--linea2);border-radius:22px;padding:20px;text-transform:lowercase}

  .aviso{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:var(--texto);color:var(--caja);border-radius:999px;
    padding:13px 28px;font-family:var(--titulo);font-size:19px;font-weight:600;
    opacity:0;pointer-events:none;transition:opacity .16s,transform .22s var(--suave-t);
    max-width:92vw;text-align:center;z-index:9}
  .aviso.ver{opacity:1;transform:translate(-50%,0)}
  .aviso.error{background:var(--caja);color:var(--malo);border:1px solid var(--malo)}
  .tapa{position:fixed;inset:0;background:rgba(244,242,238,.5);opacity:0;pointer-events:none;
    transition:opacity .15s;z-index:8}
  .tapa.ver{opacity:1;pointer-events:auto}
  body.ocupado button.marca{opacity:.35}
  button.marca{transition:transform .1s var(--suave-t),background-color .14s,border-color .14s,opacity .2s}
  .parada{position:fixed;inset:0;z-index:20;background:rgba(27,42,61,.94);color:var(--caja);display:none;
    align-items:center;justify-content:center;text-align:center;font-family:var(--titulo);font-size:25px;font-weight:600;
    line-height:1.4;padding:30px}
  .parada.ver{display:flex}
  .parada small{display:block;font-family:var(--texto-f);font-size:16px;font-weight:300;opacity:.85;margin-top:14px}
  body.ocupado #txtEstado{color:var(--malo)}
  .vacio{padding:30px 6px;color:var(--suave);font-size:17px;font-weight:300;line-height:1.7}

  /* ---- COMENTARIOS DEL DIRECTO, 18 nov 2026 ----
   * Todo lo de abajo es NUEVO y solo se usa con la pestana "Comments". Si los
   * ficheros del chat no cargan, la pestana no aparece y la pantalla queda
   * exactamente como antes. Nada de esto toca los botones de prendas y marcas:
   * al ver los comentarios se ESCONDE .cuerpo, no se repinta ni se borra, asi
   * que al volver todo esta donde estaba, con la prenda elegida incluida. */
  .pestanas{display:flex;gap:4px;background:var(--fondo);border:1px solid var(--borde);border-radius:999px;padding:3px;flex:0 0 auto}
  .pestanas[hidden]{display:none}
  .pestanas button{appearance:none;border:0;background:transparent;color:var(--suave);font-family:var(--titulo);font-size:13.5px;font-weight:600;
    padding:7px 14px;border-radius:999px;display:flex;align-items:center;gap:7px}
  .pestanas button.on{background:var(--caja);color:var(--texto);box-shadow:0 0 0 1px var(--linea) inset}
  .pestanas .cuenta{min-width:20px;height:20px;border-radius:10px;background:var(--cian);color:#fff;font-size:12px;
    display:inline-flex;align-items:center;justify-content:center;padding:0 6px}
  .pestanas .cuenta[hidden]{display:none}
  .chatvista{flex:1;min-height:0;display:none;flex-direction:column;padding:12px 16px 16px}
  .chatvista .chat-estado{font-size:12px;color:var(--suave);margin:0 0 6px 2px}
  .chatvista .chat-estado.malo{color:var(--malo);font-weight:700}
  .chatvista .chat-caja{flex:1;min-height:0}
  body.ver-chat .cuerpo{display:none}
  body.ver-chat .chatvista{display:flex}
/* ===== DISEÑO 19 nov 2026: trucos del sistema de Revolut con los colores y letras de Billy's =====
 * Papeles (Revolut -> Billy's):
 *   canvas #fff      -> --caja   #FDFCFA   superficie principal
 *   recessed #f7f7f7 -> --fondo  #F4F2EE   grupos y paneles hundidos
 *   edge #c9c9cd     -> navy al 16 %       lineas finas, nunca sombras
 *   ink #1f1f1f      -> --texto  #1B2A3D   texto, botones llenos, panel invertido
 *   cobalt (1 uso)   -> --rojo   #EF3B26   SOLO "subasta en marcha"
 * Titulos en Poppins 500 con tracking cerrado; la autoridad la da el tamaño. */
body.rv{--rv-canvas:#FDFCFA;--rv-hundido:#F4F2EE;--rv-linea:rgba(27,42,61,.16);--rv-tinta:#1B2A3D;--rv-pizarra:#5B6675;
  --rv-tinta-80:rgba(27,42,61,.8);--rv-sobre:rgba(253,252,250,.62);background:var(--rv-canvas)}
body.rv header{padding:14px 18px 8px}

body.rv .ficha .et{font-size:12px;letter-spacing:.015em;color:var(--rv-pizarra)}
body.rv .estado{background:var(--rv-hundido);border-color:transparent;color:var(--rv-pizarra);transition:background-color .25s,color .25s}
/* El UNICO color: la subasta en marcha. */
body.rv.ocupado .estado{background:var(--rojo);color:#fff}
body.rv.ocupado #txtEstado{color:#fff}
body.rv.ocupado .estado .punto{background:#fff}

body.rv .pestanas .cuenta{background:var(--rv-tinta)}

body.rv .cuerpo{gap:18px;padding:8px 18px 18px}
body.rv .fam h2,body.rv .lado h3{color:var(--rv-pizarra);font-size:12px;letter-spacing:.015em}
body.rv button.cat{border-radius:22.5px;border:1px solid var(--rv-linea);background:var(--rv-canvas);box-shadow:none}
body.rv button.cat b{font-weight:500;letter-spacing:-.01em;font-size:16px}
/* Estado por grosor de borde, no por color de fondo. */
body.rv button.cat.on{background:var(--rv-canvas);border-color:var(--rv-tinta);box-shadow:0 0 0 1px var(--rv-tinta) inset}
body.rv button.cat.prem{border-color:var(--rv-linea)}
body.rv button.cat.prem.on{background:var(--rv-canvas);border-color:var(--rv-tinta);box-shadow:0 0 0 1px var(--rv-tinta) inset}

body.rv .lado{background:var(--rv-hundido);border-radius:22.5px;padding:14px}
body.rv .lado h3 b{color:var(--rv-tinta);font-weight:500}
body.rv button.marca{border-radius:22.5px;border:1px solid var(--rv-linea);background:var(--rv-canvas)}
body.rv button.marca .nb{font-weight:500;letter-spacing:-.012em}
body.rv button.marca.lanzada{border-color:var(--rv-tinta);box-shadow:0 0 0 2px var(--rv-tinta) inset}
/* "+ brands" es la accion principal de la pantalla: boton lleno de tinta. */
body.rv button.marca.otra{background:var(--rv-tinta);border-color:var(--rv-tinta)}
body.rv button.marca.otra .nb{color:var(--rv-canvas);font-size:24px}
body.rv button.marca.cajon{background:transparent;border:1px dashed var(--rv-linea)}
body.rv .marcas.prem button.marca{border-color:var(--rv-linea)}
body.rv button.volver{border:2px solid var(--rv-tinta);color:var(--rv-tinta);font-weight:600;font-size:13px;padding:4px 14px}
body.rv .espera{border:0;color:var(--rv-pizarra);font-weight:400}
body.rv .aviso{font-weight:500}

/* Hueco: claro cuando no hay subasta; INVERTIDO (tinta) mientras hay subasta,
 * como los bloques oscuros de Revolut. Se ve desde lejos que estas en el aire. */
body.rv .hueco-chat{border-radius:22.5px;padding:14px;background:var(--rv-hundido);transition:background-color .3s}
body.rv .hueco-chat .hc-cab .vivo{background:var(--rv-pizarra);animation:none}

body.rv.ocupado .hueco-chat .hc-tit{color:var(--rv-canvas)}
body.rv.ocupado .hueco-chat .hc-tit small{color:var(--rv-sobre)}
body.rv.ocupado .hueco-chat .hc-lista{border-color:transparent}
body.rv.ocupado .hueco-chat .hc-sep{color:var(--rv-sobre)}
body.rv.ocupado .hueco-chat .chat-m{background:rgba(253,252,250,.07);border-color:rgba(253,252,250,.14);color:var(--rv-canvas)}
body.rv.ocupado .hueco-chat .chat-m b{color:var(--rv-sobre)}
body.rv.ocupado .hueco-chat .chat-m.pregunta{border-color:var(--rv-canvas);box-shadow:0 0 0 1px var(--rv-canvas) inset}
body.rv.ocupado .hueco-chat .chat-m.regalo{background:rgba(217,154,6,.16);border-color:rgba(217,154,6,.5)}
body.rv.ocupado .hueco-chat .hc-pie{color:var(--rv-sobre);border-top-color:rgba(253,252,250,.14)}

body.rv .chatvista .chat-m{border-radius:20px;border-color:var(--rv-linea)}
body.rv .chatvista .chat-m.pregunta{border-color:var(--rv-tinta);box-shadow:0 0 0 1px var(--rv-tinta) inset}

  .ultima{display:flex;align-items:baseline;gap:10px;min-width:0}

  body.rv .ultima{background:var(--rv-hundido);border-radius:999px;padding:9px 18px;flex:0 1 auto;margin-right:auto}

  .hueco-chat .hc-pr{font-family:var(--titulo);font-weight:600;font-size:15px}

<script>
/* Billy's · pantalla del directo.
 *
 * LA DISTRIBUCION ES LA DE LA APP DE MARCAR DEL ALMACEN, con sus mismas
 * familias, sus mismos colores y sus mismos iconos. Es a proposito: quien
 * emite y quien recoge acaban siendo la misma gente, y aprender una pantalla
 * tiene que servir para la otra.
 *
 * LO QUE CAMBIA RESPECTO AL MOVIL es que aqui hay sitio: las prendas viven a la
 * izquierda y SIEMPRE estan todas a la vista, y las marcas aparecen a la
 * derecha sin tapar nada. Dos toques, sin cambiar de pantalla y sin volver
 * atras nunca.
 *
 * NADA SE MUEVE DE SITIO. Ni las prendas ni las marcas se reordenan por lo que
 * vaya pasando en el directo: el orden lo fijan las listas de abajo. Si los
 * botones bailan, no hay forma de memorizar donde esta cada cosa, y memorizarlo
 * es lo unico que hace que a los dos dias se vaya sin mirar.
 *
 * LAS PRENDAS NO VIENEN AGRUPADAS EN EL PERCHERO. Nada de esto supone que la
 * siguiente se parezca a la anterior.
 */
const P = new URLSearchParams(location.search);
const CODIGO  = P.get('d') || '';
const DIRECTO = P.get('directo') || '';
/* EL CANAL es el nombre fijo de este puesto: ES 1, ES 2, DE, NL. El enlace de
 * la tablet lo lleva a el y no al numero que TikTok le pone a cada directo, que
 * cambia cada vez que se arranca. Asi este enlace se guarda una vez en la
 * pantalla de inicio y no se vuelve a tocar nunca. El numero suelto sigue
 * valiendo, para no romper los enlaces de estos dias. */
const CANAL = P.get('canal') || '';
const QUIEN = CANAL ? '&canal=' + encodeURIComponent(CANAL)
                    : '&directo=' + encodeURIComponent(DIRECTO);
const PRUEBA  = P.get('prueba') === '1';
const API = '/api/tandas';

/* La pantalla se toca AQUI y en ningun otro sitio. `ico` es el dibujo que ya

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vibrar = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
let estado = null, elegido = null, bloqueoHasta = 0, ordenMia = null, fichaPintada = null;
let mapa = new Map(), huella = '';
let otras = false, visibles = [];
/* La version de la lista de anuncios que ya tiene esta tablet. Se manda en
 * cada pregunta y, si no ha cambiado, el servidor no la vuelve a mandar: solo
 * lo pequeño (ficha, si salio la prenda, la ultima venta). 27 sep 2026. */
let verLista = '';
/* Hasta cuando hay una subasta en marcha, en el reloj de ESTE iPad: el servidor
 * dice cuanto falta y aqui se suma a la hora local, asi da igual que el reloj
 * del iPad vaya adelantado o atrasado. */
let libreHasta = 0;
const faltan = () => Math.ceil(Math.max(0, libreHasta - Date.now()) / 1000);
function pintarOcupado() {
  const f = faltan();
  document.body.classList.toggle('ocupado', f > 0 && !PRUEBA);
  const arrancando = estado && estado.orden && estado.orden.estado === 'pendiente';
  if (f > 0 && !PRUEBA && !arrancando && $('punto').classList.contains('on')) $('txtEstado').textContent = 'auction running · ' + f + ' s';
  else if ($('txtEstado').textContent.indexOf('auction running') === 0) $('txtEstado').textContent = 'ready';
}
setInterval(pintarOcupado, 500);

function aviso(txt, malo) {
  const a = $('aviso');
  a.textContent = txt;
  a.classList.toggle('error', !!malo);
  a.classList.add('ver');
  clearTimeout(a._t);
  a._t = setTimeout(() => a.classList.remove('ver'), malo ? 6000 : 1300);
}

/* LA ABREVIATURA DE LA CUENTA VA AL FINAL DEL TITULO -"Sudadera Nike BV"- para
 * saber de que tienda es cada anuncio. Aqui se quita ANTES de mirar nada, y no
 * es un detalle: los tipos se deducen de los anuncios que acaban en "Vintage",
 * asi que con la abreviatura pegada "Sudadera Vintage BV" dejaria de acabar en
 * Vintage y la pantalla se quedaria sin un solo tipo. */
const limpiar = (n) => String(n || '')
  .replace(/^#\d+\s*/, '')
  .replace(/^Gebrauchtes?\s+/i, '').replace(/^De\s+segunda\s+mano\s+/i, '')
  .replace(/\s+(BV|BTo|BTa|DE|NL)$/i, '')
  .trim();
const icoDe = (t) => (TIPOS.find((x) => x.n === t) || {}).ico || 'nose';

/* Los tipos salen del panel, no de la lista de arriba: el cajon de cada uno se
 * llama "<tipo> Vintage". La lista solo manda en el ORDEN y en el dibujo, asi
 * que si un dia se añade un tipo al Excel aparece igual, al final y con el
 * icono de "no se". */
function organizar(listados) {
  const limpios = listados.map((l) => ({ ...l, corto: limpiar(l.nombre) }));
  const tipos = [...new Set(limpios.filter((l) => /\sVintage$/i.test(l.corto))
    .map((l) => l.corto.replace(/\s+Vintage$/i, '')))].sort((a, b) => b.length - a.length);
  const m = new Map();
  for (const l of limpios) {
    const t = tipos.find((u) => l.corto === u + ' Vintage' || l.corto.startsWith(u + ' '));
    if (!t) continue;
    const marca = (l.corto === t + ' Vintage') ? '' : l.corto.slice(t.length).trim();
    if (!m.has(t)) m.set(t, []);
    if (PREMIUM(marca)) { if (!m.has('Premium')) m.set('Premium', []); m.get('Premium').push({ ...l, marca, tipo: t }); continue; }
    m.get(t).push({ ...l, marca, tipo: t });
  }
  const pos = (x) => { const i = ORDEN_MARCAS.indexOf(x); return i < 0 ? 900 : i; };
  const posT = (t) => { const i = TIPOS.findIndex((x) => x.n === t); return i < 0 ? 900 : i; };
  if (m.has('Premium')) m.get('Premium').sort((a, b) =>
    a.marca.localeCompare(b.marca) || posT(a.tipo) - posT(b.tipo));
  for (const [t, items] of m) {
    if (t === 'Premium') continue;
    items.sort((a, b) => (a.marca ? 0 : 1) - (b.marca ? 0 : 1) ||
      pos(a.marca) - pos(b.marca) || a.marca.localeCompare(b.marca));
  }
  return m;
}

function pintarPrendas() {
  const cont = $('prendas');
  if (!mapa.size) {
    cont.innerHTML = '<div class="vacio">No listings yet.<br><br>Open the TikTok panel on the LIVE computer ' +
      'and leave that tab open.</div>';
    $('filaPrem').innerHTML = '';
    return;
  }
  const orden = (t) => { const i = TIPOS.findIndex((x) => x.n === t); return i < 0 ? 900 : i; };
  const suyos = (f) => [...mapa.keys()]
    .filter((t) => ((TIPOS.find((x) => x.n === t) || {}).fam || 'arriba') === f)
    .sort((a, b) => orden(a) - orden(b));
  cont.innerHTML = FAM.map((f) => {
    const ts = suyos(f.id);
    if (!ts.length) return '';
    return '<div class="fam"><h2><i style="background:' + f.color + '"></i>' + f.n + '</h2>' +
      ts.map((t) => '<button class="cat' + (t === elegido ? ' on' : '') + '" data-t="' + esc(t) + '">' +
        '<svg viewBox="0 0 32 32" fill="' + f.color + '"><use href="#i-' + icoDe(t) + '"></use></svg>' +
        '<b>' + esc(t) + '</b></button>').join('') + '</div>';
  }).join('');
  $('filaPrem').innerHTML = mapa.has('Premium')
    ? '<button class="cat prem' + (elegido === 'Premium' ? ' on' : '') + '" data-t="Premium">' +
      '<svg viewBox="0 0 32 32" fill="var(--oro)"><use href="#i-estrella"></use></svg><b>premium</b></button>' : '';
}

function pintarMarcas(mov) {
  const cont = $('marcas'), tit = $('tituloLado');
  cont.dataset.mov = mov || 'sube';
  if (!elegido) {
    tit.textContent = 'what is it';
    cont.innerHTML = '<div class="espera" style="grid-column:1/-1">Tap the garment<br>you are holding</div>';
    return;
  }
  const f = FAM.find((x) => x.id === ((TIPOS.find((y) => y.n === elegido) || {}).fam || 'arriba')) || { color: 'var(--oro)' };
  tit.innerHTML = '<svg viewBox="0 0 32 32" fill="' + f.color + '"><use href="#i-' + icoDe(elegido) +
    '"></use></svg> ' + esc(elegido) + ' · which brand';
  const items = mapa.get(elegido) || [];
  cont.classList.remove('mas', 'prem');
  cont.style.gridTemplateColumns = cont.style.gridTemplateRows = '';
  if (elegido === 'Premium') {
    tit.innerHTML = '<svg viewBox="0 0 32 32" fill="var(--oro)"><use href="#i-estrella"></use></svg> premium · which one';
    visibles = items;
    cont.classList.add('prem');
    cont.innerHTML = items.map((it, i) => '<button class="marca" data-i="' + i + '" style="--i:' + i + '"><span class="nb">' + esc(it.marca) +
      '</span><span class="ti">' + esc(it.tipo) + '</span></button>').join('');
    return;
  }
  const lista = PRIMERA[elegido] || ORDEN_MARCAS.filter((x) => items.some((it) => it.marca === x)).slice(0, 5);
  const primeras = lista.map((x) => items.find((it) => it.marca === x)).filter(Boolean);
  const segundas = items.filter((it) => it.marca && !lista.includes(it.marca))
    .sort((x, y) => x.marca.localeCompare(y.marca));
  const sinMarca = items.filter((it) => !it.marca);
  if (otras) {
    tit.innerHTML += ' · <b>more brands</b><button class="volver">&#8592; back</button>';
    visibles = segundas.concat(sinMarca);
    cont.classList.add('mas');
    /* La rejilla se ajusta a cuantas marcas haya y llena todo el alto: hasta 3,
     * una columna; hasta 8, dos; con mas, tres. "No brand" va el ultimo y se
     * estira hasta el final de su fila, asi nunca queda un hueco. */
    const n = visibles.length, cols = n <= 3 ? 1 : n <= 8 ? 2 : 3;
    const filas = Math.ceil(n / cols), ancho = cols * filas - n + 1;
    cont.style.gridTemplateColumns = 'repeat(' + cols + ',1fr)';
    cont.style.gridTemplateRows = 'repeat(' + filas + ',1fr)';
    cont.innerHTML = visibles.map((it, i) => '<button class="marca' + (it.marca ? '' : ' cajon') + '" data-i="' + i + '" style="--i:' + i + ';' +
      (it.marca ? '' : 'grid-column:span ' + ancho) + '">' +
      '<span class="nb">' + esc(it.marca || 'No brand') + '</span></button>').join('');
    return;
  }
  visibles = primeras.concat([{ otras: 1 }]);
  cont.innerHTML = visibles.map((it, i) => {
    if (it.otras) return '<button class="marca otra" data-i="' + i + '" style="--i:' + i + '"><span class="nb">+ brands</span></button>';
    const g = LOGOS[it.marca];
    return '<button class="marca" data-i="' + i + '" style="--i:' + i + '">' +
      (g ? '<span class="lg"><img src="' + g[0] + '" width="' + g[1] + '" height="' + g[2] + '" alt=""></span>' : '') +
      '<span class="nb">' + esc(it.marca) + '</span></button>';
  }).join('');
}

document.addEventListener('click', (e) => {
  const cat = e.target.closest('.cat');
  if (cat) { elegido = cat.dataset.t; otras = false; vibrar(8); pintarPrendas(); pintarMarcas(); return; }
  if (e.target.closest('.volver')) { otras = false; vibrar(8); pintarMarcas('vuelve'); return; }
  const mb = e.target.closest('.marca');
  if (mb) {
    const it = visibles[Number(mb.dataset.i)];
    if (it && it.otras) { otras = true; vibrar(8); pintarMarcas('ir'); return; }
    if (it) { if (Date.now() >= bloqueoHasta) { mb.classList.add('lanzada'); setTimeout(() => mb.classList.remove('lanzada'), 1200); } pedir(it); }
  }
});

async function pedir(item) {
  const ahora = Date.now();
  if (ahora < bloqueoHasta) return;
  if (!PRUEBA && faltan() > 0) {
    vibrar(120);
    aviso('Auction still running. Wait ' + faltan() + ' s and tap again.', true);
    return;
  }
  bloqueoHasta = ahora + 1400;
  $('tapa').classList.add('ver');
  setTimeout(() => $('tapa').classList.remove('ver'), 1100);
  vibrar([12, 40, 12]);
  const queEra = item.tipo || elegido;
  try {
    const r = await fetch(API + '?d=' + encodeURIComponent(CODIGO), {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ live: 1, directo: DIRECTO, canal: CANAL, accion: 'pedir',
        listado: item.id, nombre: item.nombre, prueba: PRUEBA ? 1 : 0 })
    });
    const j = await r.json();
    if (!j.ok && j.error === 'subasta-en-marcha') {
      libreHasta = Date.now() + (Number(j.faltan) || 3) * 1000; pintarOcupado();
      vibrar(120);
      aviso('Auction still running. Wait ' + faltan() + ' s and tap again.', true);
      return;
    }
    if (!j.ok) throw new Error(j.error || 'no');
    estado = j; ordenMia = j.orden ? j.orden.id : null;
    if (typeof j.libre_en === 'number') libreHasta = Date.now() + j.libre_en;
    pintarOcupado();
    aviso((PRUEBA ? 'TEST · ' : '') + queEra + ' ' + (item.marca || 'no brand'));
    /* Se vuelve a cero: la siguiente prenda no tiene por que parecerse a esta. */
    elegido = null; otras = false; pintarPrendas(); pintarMarcas(); cabecera();
  } catch (e) { aviso('Could not send. Check the connection.', true); }
}

/* El rotulo del puesto. El nombre de la cuenta llega del servidor en cuanto
 * contesta; hasta entonces vale con el nombre del canal, que ya viene en el
 * enlace. */
function pintarPuesto(cuenta) {
  if (!CANAL) return;
  const a = $('puesto');
  a.innerHTML = '<b>' + esc(CANAL.toUpperCase().replace(/-/g, ' ')) + '</b>' +
                '<span>' + esc(cuenta || 'cambiar') + '</span>';
  a.href = 'panel-directos.html?d=' + encodeURIComponent(CODIGO);
  a.hidden = false;
}

function cabecera() {
  if (!estado) return;
  const n = (estado.ficha || 0) + 1, el = $('ficha');
  if (fichaPintada !== null && n !== fichaPintada) {
    el.classList.remove('sube'); void el.offsetWidth; el.classList.add('sube');
  }
  fichaPintada = n; el.textContent = n;
  const u = (estado.ultimas || [])[(estado.ultimas || []).length - 1];
  /* 19 nov 2026: solo cambia COMO se ve (tag y precio grandes, prenda en pequeño). */
  $('ultima').innerHTML = u ? '<span class="ul-et">last sold</span><span class="ul-tag">tag ' + u.ficha + '</span>' +
    '<span class="ul-pr">' + esc(u.precio || '') + '</span><span class="ul-nom">' + esc(limpiar(u.nombre)) + '</span>' : '';
  /* NOVENTA SEGUNDOS Y NO CUARENTA Y CINCO. El ordenador da senales cada quince,
   * pero si Chrome ha frenado esa pestana por estar detras, pasa a hablar una
   * vez por minuto. Con el listón en cuarenta y cinco, la vendedora veia el
   * cartel rojo aparecer y desaparecer todo el rato con el sistema funcionando
   * perfectamente, y un aviso que salta sin motivo deja de mirarse. */
  const l = estado.listados_cuando ? (Date.now() - new Date(estado.listados_cuando).getTime()) / 1000 : 1e9;
  const vivo = l < 90;
  $('punto').className = 'punto ' + (vivo ? 'on' : 'off');
  $('txtEstado').textContent = !vivo ? 'computer not responding'
    : (estado.orden && estado.orden.estado === 'pendiente') ? 'starting…'
    : (estado.orden && estado.orden.estado === 'error') ? 'failed' : 'ready';

const QUIETA = 15 * 60 * 1000;

function tocaParar(j) {
  if (!j || !j.ahora) return '';
  if (arranque === undefined) arranque = j.ahora;
  if (j.apagado_en && j.apagado_en > arranque) return 'Disconnected from the panel.';
  if (j.dormir && !forzada) return 'Paused for the night.';

function mirarInactiva(viva) {
  if (viva) { inactivaDesde = 0; return ''; }
  if (!inactivaDesde) inactivaDesde = Date.now();

const RITMO = 3000, MAX = 6000, CORTE = 8000;   /* MAX 6 s: con 60 la tablet se quedaba un minuto en "no response" tras dos fallos seguidos */
let espera = RITMO;
function llamar(url) {
  const corta = new AbortController();
  const reloj = setTimeout(() => corta.abort(), CORTE);
  return fetch(url, { signal: corta.signal }).then((r) => r.json()).finally(() => clearTimeout(reloj));

async function mirar() {

      QUIEN + '&live=1&v=' + encodeURIComponent(verLista) + '&_=' + Date.now());

       * ya hay. Si viene (o es un servidor viejo que la manda siempre), se mira
       * igual que antes. */
      if (Array.isArray(j.listados)) {
        const h = JSON.stringify(j.listados.map((x) => [x.id, x.nombre]));
        if (h !== huella) { huella = h; mapa = organizar(j.listados);
          if (elegido && !mapa.has(elegido)) elegido = null;

<script>
/* FRASES Y PRECIOS DE TIENDA (facts-de.txt y preise-de.txt, junto a esta
 * pagina). Se cambian subiendo esos dos ficheros: la tablet no se toca.
 *
 * facts-de.txt:   # Nombre (marca, prenda o Nudges, escrito igual que en la
 *                 tablet), debajo una frase por linea. // = nota, no sale.
 * preise-de.txt:  Tipo | Marca | rango    ("*" = cualquier marca sin fila
 *                 propia y tambien sin marca; "-" = no enseñar precio).
 *
 * Las frases se reparten como una baraja: no se repite ninguna hasta que han
 * salido todas las de esa marca, y al barajar otra vez las ultimas 4 van al
 * fondo. Las frases con € no salen: el precio ya va aparte. */
var BillysFacts = (function () {
  'use strict';
  var pools = {}, barajas = {}, ultimo = {}, precios = {};
  function leer(txt) {
    var p = {}, actual = null;
    String(txt || '').split(/\r?\n/).forEach(function (l) {
      l = l.trim();
      if (!l || l.indexOf('//') === 0) return;
      if (l.charAt(0) === '#') { actual = l.replace(/^#+\s*/, '').trim().toLowerCase(); p[actual] = p[actual] || []; return; }
      if (actual && l.indexOf('€') < 0) p[actual].push(l);
    });
    pools = p; barajas = {}; ultimo = {};
  }
  function leerPrecios(txt) {
    var p = {};
    String(txt || '').split(/\r?\n/).forEach(function (l) {
      l = l.trim();
      if (!l || l.indexOf('//') === 0) return;
      var c = l.split('|').map(function (x) { return x.trim(); });
      if (c.length !== 3 || !c[0] || !c[1]) return;
      var t = c[0].toLowerCase();
      p[t] = p[t] || {};
      p[t][c[1].toLowerCase()] = c[2];
    });
    precios = p;
  }
  function barajar(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function saca(nombre) {
    var k = String(nombre || '').toLowerCase(), todo = pools[k] || [];
    if (!todo.length) return '';
    if (!barajas[k] || !barajas[k].length) {
      var rec = ultimo[k] || [], b = barajar(todo.filter(function (x) { return rec.indexOf(x) < 0; }));
      barajas[k] = rec.filter(function (x) { return todo.indexOf(x) >= 0; }).reverse().concat(b);
    }
    var f = barajas[k].pop();
    ultimo[k] = (ultimo[k] || []).concat([f]).slice(-4);
    return f;
  }
  function traer(url) {
    return fetch(url, { cache: 'no-cache' }).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; });
  }
  function cargar() {
    return Promise.all([traer('facts-de.txt').then(leer), traer('preise-de.txt').then(leerPrecios)]);
  }
  /* UNA frase por prenda lanzada, por turnos:
   *   con marca:  marca, prenda, nudge, marca, prenda, nudge...
   *   sin marca:  prenda, nudge, prenda, nudge...
   * Si al que le toca no tiene frases, pasa al siguiente. Los nudges van en
   * "# Nudges" (vale tambien el "# Vintage" del borrador antiguo). */
  var giroMarca = 0, giroSin = 0;
  function una(tipo, marca) {
    var nudge = (pools['nudges'] && pools['nudges'].length) ? 'Nudges' : 'Vintage';
    var orden = marca ? [marca, tipo, nudge] : [tipo, nudge];
    var ini = marca ? (giroMarca++ % 3) : (giroSin++ % 2);
    for (var i = 0; i < orden.length; i++) { var f = saca(orden[(ini + i) % orden.length]); if (f) return f; }
    return '';
  }
  function precio(tipo, marca) {
    var t = precios[String(tipo || '').toLowerCase()] || {}, m = String(marca || '').toLowerCase();
    var v = (m && Object.prototype.hasOwnProperty.call(t, m)) ? t[m] : t['*'];
    return (!v || v === '-') ? '' : v;
  }
  return { leer: leer, leerPrecios: leerPrecios, cargar: cargar, una: una, precio: precio };
})();

        (frase ? '<div class="hc-uno">' + escH(frase) + '</div>' : '') +
        '<div class="hc-sep">live comments</div>';
      caja.classList.remove('ver'); void caja.offsetWidth; caja.classList.add('ver');
    };
    new MutationObserver(function () {
      if (!aviso.classList.contains('ver') || aviso.classList.contains('error')) return;
      var t = (aviso.textContent || '').replace(/^TEST\s*·\s*/, '').trim();
      var tipos = Array.prototype.map.call(document.querySelectorAll('button.cat'), function (b) { return b.dataset.t; })
        .filter(function (x) { return x && x !== 'Premium'; }).sort(function (a, b) { return b.length - a.length; });
      var tipo = tipos.find(function (x) { return t.indexOf(x + ' ') === 0 || t === x; });
      if (!tipo) return;
      var marca = t.slice(tipo.length).trim();
      if (/^no brand$/i.test(marca)) marca = '';
      pintarFacts(tipo, marca);
    }).observe(aviso, { attributes: true, attributeFilter: ['class'], childList: true, characterData: true, subtree: true });

    var ver = function (enChat) {
      abiertoTab = enChat;
      document.body.classList.toggle('ver-chat', enChat);
      el('pChat').classList.toggle('on', enChat);
      el('pProd').classList.toggle('on', !enChat);
      if (enChat) chat.visto();
    };
    el('pProd').addEventListener('click', function () { ver(false); });
    el('pChat').addEventListener('click', function () { ver(true); });
    el('pestanas').hidden = false;
  } catch (e) { /* si falla, la tablet sigue igual */ }
})();
</script>
</body>
</html>
