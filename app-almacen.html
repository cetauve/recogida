<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) =>
    ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
  const eur = (n) => n.toFixed(2).replace('.', ',') + ' €';
  const vibrar = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };

  /* LOS COSTES SOLO CON EL PIN DE ADMIN, 26 sep 2026. Quien recoge y marca no
   * tiene por que ver cuanto cuesta cada prenda. Donde iba el coste sale un
   * candado; al tocarlo se pide el pin y se comprueba en el servidor, que es
   * donde esta guardado (no en esta pagina). Un movil con el pin puesto lo
   * recuerda doce horas: el de Aaron no tiene que ponerlo cada vez, y el de una
   * trabajadora en el que alguien lo puso un dia se olvida solo al siguiente. */
  const DOCE_HORAS = 12 * 3600 * 1000;
  let ADMIN = false;
  try { ADMIN = Number(localStorage.getItem('billys_admin_hasta') || 0) > Date.now(); } catch (e) {}
  const cifraCoste = (valor) => ADMIN
    ? `<div class="cifra verde"><u>${valor}</u><span>coste</span></div>`
    : `<button class="cifra" data-vercoste style="cursor:pointer;font:inherit;color:inherit"><u>🔒</u><span>coste · admin</span></button>`;
  document.addEventListener('click', async (e) => {
    if (!e.target.closest('[data-vercoste]')) return;
    const pin = (window.prompt('Pin de admin:') || '').trim();
    if (!pin) return;
    try {
      const r = await fetch('/api/tandas?d=' + encodeURIComponent(CODIGO), { method: 'POST',
        headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pinAdmin: pin }) });
      const j = await r.json();
      if (!j.ok) { window.alert('Ese pin no es.'); return; }
      ADMIN = true;
      try { localStorage.setItem('billys_admin_hasta', String(Date.now() + DOCE_HORAS)); } catch (e2) {}
      repintar();
    } catch (e2) { window.alert('Sin conexión. Prueba otra vez.'); }
  });

  /* ======================================================================
     DE DÓNDE SALEN LAS TANDAS
     ======================================================================
     Del servidor, igual que la app de recoger. El enlace lleva el código de
     lectura y, si se quiere una recogida concreta, su juego:

       app-almacen.html?d=CODIGO                 la recogida de hoy
       app-almacen.html?d=CODIGO&juego=es-2026-09-21   esa y no otra

     Sin juego se prueba el de hoy en hora de Valencia, que es el día con el
     que trabaja el servidor. Así hay un enlace que no caduca y siempre abre
     lo último que se ha impreso. */
  const P = new URLSearchParams(location.search);
  const CODIGO = P.get('d') || '';
  const PAIS = (P.get('pais') || '').trim().toLowerCase();
  const DIA = P.get('dia') || '';
  const HOY_ES = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Madrid' }).format(new Date());
  let JUEGO = P.get('juego') || '';
  const llavesAProbar = () => {
    if (JUEGO) return [JUEGO];
    const base = DIA || HOY_ES;
    if (!base) return [];
    return (PAIS && PAIS !== 'es') ? [PAIS + '-' + base, base] : [base, 'es-' + base];
  };

  let DATOS = null, TANDAS = [], PRENDAS = 0, PERCHEROS = [], VARIOS = false;
  /* rotulo de la cuenta -> numero de color (1, 2, 3...) */
  let COLOR_DE = {};
  let GENERADO = '', VALIDAS = new Set();

  /* LAS CATEGORÍAS, con el coste por prenda con IVA y porte dentro. Estos son
     los precios de España, sacados de las facturas de compra, así que aquí el
     euro vale tanto como el recuento. */
  const CATS = [
    { id:'sudadera',  n:'Sudadera',   fam:'arriba',   ico:'sudadera',    coste:1.87 },
    { id:'camiseta',  n:'Camiseta',   fam:'arriba',   ico:'camiseta',    coste:0.33 },
    { id:'polo',      n:'Polo',       fam:'arriba',   ico:'polo',        coste:0.67 },
    { id:'punto',     n:'Punto',      fam:'arriba',   ico:'punto',       coste:5.65 },
    { id:'nba',       n:'NBA',        fam:'arriba',   ico:'nba',         coste:4.08 },
    { id:'futbol',    n:'Fútbol',     fam:'arriba',   ico:'futbol',      coste:6.10 },
    /* CAMISA · 20 sep. Factura 20250279, línea 41, "American brands",
       12,00 €/kg, 75 kg. Es la única línea de camisa que entra.
       Con 5 camisas por kilo: (12 + 0,2096) ÷ 5 × 1,21 = 2,95 €.
       Las 5 por kilo son estimación mía por el peso, NO están pesadas.
       Va la última de su familia a propósito: así ningún botón de los que ya
       estaban cambia de sitio. */
    { id:'camisa',    n:'Camisa',     fam:'arriba',   ico:'camisa',      coste:2.95 },
    { id:'shorts',    n:'Shorts',     fam:'abajo',    ico:'shorts',      coste:1.05 },
    /* TRACK PANTS · añadida el 20 sep.
       Está en la factura 20250279: línea 47, "90s SPORT TROUSER", 7,50 €/kg,
       100 kg, 750 €. Con 2,5 prendas por kilo y la misma fórmula que el resto
       —(€/kg + 0,2096 de porte) ÷ prendas/kg × 1,21— salen 3,73 €.
       Lo único estimado son las 2,5 prendas por kilo, que vienen de la lista
       vieja y no de pesar. */
    { id:'trackpant', n:'Track pant', fam:'abajo',    ico:'trackpants',  coste:3.73 },
    /* VAQUERO · 20 sep. Factura 20250279, línea 52, código TROSKIN,
       "Skinny 5 Series Jeans", 2,00 €/kg, 225 kg, 450 €. Es la única línea de
       vaquero que entra, así que el botón se llama por la prenda y no por el
       código: quien lo tiene en la mano ve un vaquero.
       Con 2 por kilo: (2,00 + 0,2096) ÷ 2 × 1,21 = 1,34 €.
       Las 2 por kilo son estimación mía; un skinny pesa menos que un 501. */
    { id:'vaquero',   n:'Vaquero',    fam:'abajo',    ico:'vaquero',     coste:1.34 },
    { id:'chaqueta',  n:'Chaqueta',   fam:'exterior', ico:'chaqueta',    coste:6.07 },
    { id:'chaleco',   n:'Chaleco',    fam:'exterior', ico:'chaleco',     coste:3.73 },
    { id:'trackjkt',  n:'Track jkt',  fam:'exterior', ico:'trackjacket', coste:2.52 },
    { id:'anoraksra', n:'Anorak sra', fam:'exterior', ico:'anoraksra',   coste:11.14 },
    { id:'nose',      n:'No sé',      fam:'exterior', ico:'nose',        coste:null }
  ];
  const FAM = [
    { id:'arriba',   n:'De arriba', color:'#5C8FD6' },
    { id:'abajo',    n:'De abajo',  color:'#D98A4A' },
    { id:'exterior', n:'Exterior',  color:'#7FB893' }
  ];
  const COLOR = { arriba:'#5C8FD6', abajo:'#D98A4A', exterior:'#7FB893' };
  const deId = (id) => CATS.find((c) => c.id === id);

  /* Cada prenda lleva su numero y su ROTULO (la cuenta). El indice de color se
     pone en prepararTandas, cuando ya se sabe cuantos percheros hay en total. */
  const piezas = (b) => b.g.flatMap(([r, nums]) => nums.map((n) => ({ n, r }))); 

  /* ======================================================================
     DOS PERCHEROS CON LOS MISMOS NÚMEROS
     ======================================================================
     Tal cual estaba en la app de recoger, que lleva funcionando desde el 17 de
     septiembre. No se toca: si un día hay que arreglarlo, se arregla en los
     dos sitios a la vez o dejan de decir lo mismo.

     Cada anuncio numera sus prendas desde el 1. Con dos directos seguidos en
     la misma cuenta, la 20 de uno y la 20 del otro son prendas distintas y
     están en percheros distintos. Esto pregunta a TikTok de qué anuncio es
     cada pedido y, SOLO si los números se pisan de verdad, parte la tarjeta.
     ====================================================================== */
  const CLAVE_DIRECTOS = 'billys_directos_';
  const ESPERA_DIRECTOS_MS = 10000;

  async function pedidosDe(cuenta, estado){
    const corta = new AbortController();
    const reloj = setTimeout(() => corta.abort(), ESPERA_DIRECTOS_MS);
    let j = null;
    try {
      const r = await fetch('/api/tiktok-pedidos?d=' + encodeURIComponent(CODIGO) +
        '&cuenta=' + encodeURIComponent(cuenta) +
        (estado ? '&estado=' + encodeURIComponent(estado) : ''),
        { cache: 'no-store', signal: corta.signal });
      j = await r.json();
    } finally { clearTimeout(reloj); }
    if (!j || !j.ok || !Array.isArray(j.pedidos)) throw new Error('sin pedidos');
    return j.pedidos;
  }

  /* Los pedidos de esa cuenta repartidos por directo. Devuelve null si solo hubo
   * uno —que es la respuesta util, no un fallo— y lanza si no se ha podido
   * preguntar, para no guardar un "no hay" que no se sabe.
   *
   * `mios` es la lista de pedidos que salen en las tarjetas de este juego, y no
   * es un adorno: la cuenta lleva meses vendiendo y en lo ya etiquetado hay
   * directos de otros dias. Sin ese filtro, los dos directos del 9 sep salian
   * numerados 3 y 4 porque delante habia dos del 5 y del 6. */
  async function mapaDeDirectos(cuenta, mios){
    /* PRIMERO LO PENDIENTE DE ENVIAR, que es lo normal mientras se recoge. */
    let pedidos = await pedidosDe(cuenta, '');
    const cubre = () => mios.every(id => pedidos.some(p => p.pedido === id));

    /* Y SI NO ESTAN TODOS, LO YA ETIQUETADO.
     * En cuanto se crea la etiqueta el pedido sale de AWAITING_SHIPMENT, asi que
     * imprimir dejaba esto sin nada que mirar justo cuando iba a empezar la
     * recogida: el 10 sep, cero pedidos y las tarjetas otra vez sin directo. */
    if (mios.length && !cubre()) {
      try { pedidos = pedidos.concat(await pedidosDe(cuenta, 'AWAITING_COLLECTION')); }
      catch (e) { /* con lo que haya */ }
    }

    const suyos = mios.length ? pedidos.filter(p => mios.includes(p.pedido)) : pedidos;
    const cuando = {}, porPedido = {};
    for (const p of suyos) {
      for (const x of (p.prendas || [])) {
        if (!x.productoId || x.num == null) continue;
        (porPedido[p.pedido] = porPedido[p.pedido] || []).push({ num: Number(x.num), prod: String(x.productoId) });
        const t = Number(p.creado) || 0;
        if (cuando[x.productoId] == null || t < cuando[x.productoId]) cuando[x.productoId] = t;
      }
    }
    /* DOS ANUNCIOS NO SON DOS PERCHEROS - 17 sep 2026.
     *
     * EL FALLO: la tarjeta decia "billysvlc . directo 1" un dia en el que solo
     * hubo UN directo. Aqui se contaban anuncios, y un mismo directo se cuelga a
     * veces en dos anuncios (pasa cuando hay que cambiar algo del envio a media
     * subasta). Dos anuncios, dos "directos", y quien recoge buscando un perchero
     * que no existe.
     *
     * Lo que de verdad hay que separar no son los anuncios: son los NUMEROS
     * REPETIDOS. Si el segundo anuncio siguio numerando donde lo dejo el primero
     * -2, 3, 4...- no hay ninguna prenda 20 por duplicado, las prendas estan
     * todas en el mismo perchero y el rotulo sobra. Solo cuando el mismo numero
     * existe en dos anuncios hace falta ponerle apellido, que es justo el caso
     * de los dos directos seguidos del 9 sep.
     *
     * Asi que la pregunta pasa a ser "?chocan los numeros?" en vez de "?hay dos
     * anuncios?". Si no chocan, esto devuelve null y la tarjeta sale como
     * siempre. */
    const numerosDe = {};
    for (const lista of Object.values(porPedido)) {
      for (const par of lista) (numerosDe[par.prod] = numerosDe[par.prod] || new Set()).add(par.num);
    }
    const deQuien = new Map();
    let chocan = false;
    for (const prod of Object.keys(numerosDe)) {
      for (const n of numerosDe[prod]) {
        if (deQuien.has(n) && deQuien.get(n) !== prod) { chocan = true; break; }
        deQuien.set(n, prod);
      }
      if (chocan) break;
    }

    /* El perchero 1 es el que empezo antes. Es el orden en el que se colgaron las
     * prendas, que es como estan en el almacen. */
    const orden = Object.keys(cuando).sort((a, b) => cuando[a] - cuando[b]);
    return (orden.length > 1 && chocan) ? { orden, porPedido } : null;
  }

  /* Parte los numeros de cada tarjeta de esa cuenta en un grupo por directo. */
  function repartirPorDirecto(cuenta, m){
    const cual = {};
    m.orden.forEach((id, k) => { cual[id] = k + 1; });
    let tocado = 0;

    for (const t of (DATOS.tandas || [])) {
      for (const c of (t.compradores || [])) {
        /* TODOS los grupos de esa cuenta, no el primero. La extension ya parte
         * los numeros de un comprador en varios trozos con el MISMO nombre de
         * cuenta —cuatro pedidos sueltos salen en dos grupos de billys_nl— y
         * quedarse con el primero borraba el resto: la tarjeta de Y***ne decia
         * "4 PRENDAS" y ensenaba dos numeros. Se juntan y se reparten a la vez. */
        const mios = (c.porCuenta || []).filter(x =>
          String(x.cuenta) === cuenta && Array.isArray(x.numeros) && x.numeros.length);
        if (!mios.length) continue;

        /* SE REPARTE DESDE LOS PEDIDOS, NO DESDE LA LISTA DE NUMEROS. Un
         * comprador puede llevarse la 20 en los dos directos: son dos prendas
         * distintas, no un numero repetido, y recorrer la lista buscando "la 20"
         * las mandaria a las dos al mismo sitio. */
        const todos = [].concat(...mios.map(x => x.numeros));
        const quedan = todos.slice();
        const bolsas = {};
        const pedidos = Array.isArray(c.pedidos) ? c.pedidos : (c.pedido ? [c.pedido] : []);
        for (const ped of pedidos) {
          for (const par of (m.porPedido[ped] || [])) {
            /* El directo se mira ANTES de sacar el numero de la lista: si no se
             * sabe de cual es, tiene que quedarse donde estaba. */
            const d = cual[par.prod];
            if (!d) continue;
            const k = quedan.indexOf(par.num);
            if (k < 0) continue;                 // ese numero ya no esta en la tarjeta
            quedan.splice(k, 1);
            (bolsas[d] = bolsas[d] || []).push(par.num);
          }
        }
        const dirs = Object.keys(bolsas);
        if (!dirs.length) continue;

        const nuevos = dirs.sort().map(d => ({
          /* "perchero", no "directo": lo que quien recoge tiene delante es un
           * perchero, y ademas no siempre son dos directos -a veces es un directo
           * colgado en dos anuncios con numeros repetidos-. */
          cuenta: cuenta + ' · directo ' + d,
          dir: Number(d),
          numeros: bolsas[d].sort((a, b) => a - b)
        }));
        /* Lo que no se ha podido colocar sigue estando: con su cuenta a secas,
         * como toda la vida. Preferimos un numero sin apellido a un numero que
         * desaparece de la tarjeta. */
        if (quedan.length) nuevos.push({ cuenta, numeros: quedan.slice().sort((a, b) => a - b) });

        /* EL SEGURO, Y NO SOBRA. Si lo repartido no es exactamente lo que habia,
         * esta tarjeta se queda como estaba. Una tarjeta sin apellidos se recoge
         * despacio; una tarjeta a la que le falta un numero se recoge mal y nadie
         * se entera hasta que el paquete llega corto. */
        const orden = (v) => v.slice().sort((a, b) => a - b).join(',');
        if (orden(todos) !== orden([].concat(...nuevos.map(x => x.numeros)))) continue;

        c.porCuenta = (c.porCuenta || []).filter(x => String(x.cuenta) !== cuenta).concat(nuevos);
        tocado++;
      }
    }
    return tocado;
  }

  async function separarDirectos(){
    if (!CODIGO || !DATOS || !Array.isArray(DATOS.tandas)) return 0;
    const cuentas = [...new Set([].concat(...DATOS.tandas.map(t =>
      [].concat(...(t.compradores || []).map(c =>
        (c.porCuenta || []).map(x => String(x.cuenta || '')))))))].filter(Boolean);
    if (!cuentas.length) return 0;

    /* CON VARIAS CUENTAS NO SE PARTE POR DIRECTO - 22 sep 2026.
     *
     * EL FALLO: la tarjeta decia "billysvlc . directo 3" un dia en el que
     * billysvlc hizo UN solo directo. El token de TikTok es por TIENDA, no por
     * cuenta, asi que al preguntar por los pedidos de billysvlc contesta con
     * los de toda la tienda: los de billystour, los de billystacos y los suyos.
     * Esto contaba esos tres anuncios como si fueran tres directos de
     * billysvlc, y el suyo, que empezo el ultimo, salia como el 3.
     *
     * Cuando en el paso 2 se ha separado en varias cuentas, ya esta hecho el
     * trabajo: cada grupo lleva su cuenta y eso es lo que identifica la prenda.
     * Partir por directo ahi solo puede mentir, porque desde la API no hay
     * forma de saber de que cuenta es cada anuncio.
     *
     * Se sigue partiendo cuando la recogida es de UNA sola cuenta, que es el
     * caso para el que se hizo: Alemania, dos directos seguidos en billys_de
     * con los numeros pisados. */
    if (cuentas.length > 1) return 0;

    /* Guardado por juego Y por hora de calculo: cada paso 2 rehace las tandas, y
     * si el segundo directo empezo despues de la ultima consulta hay que volver a
     * preguntar en vez de arrastrar un "aqui solo hubo uno" que ya no es verdad. */
    const llave = CLAVE_DIRECTOS + (DATOS.juego || DATOS.dia || '');
    let caja = null;
    try { caja = JSON.parse(localStorage.getItem(llave) || 'null'); } catch (e) {}
    if (!caja || typeof caja !== 'object' || caja.generado !== (DATOS.generado || '')) {
      caja = { generado: DATOS.generado || '', cuentas: {} };
    }

    let tocado = 0, cambiado = false;
    for (const cuenta of cuentas) {
      /* Los pedidos que salen en las tarjetas de ESTE juego y de ESTA cuenta. */
      const mios = [...new Set([].concat(...DATOS.tandas.map(t =>
        [].concat(...(t.compradores || [])
          .filter(c => (c.porCuenta || []).some(x => String(x.cuenta) === cuenta))
          .map(c => Array.isArray(c.pedidos) ? c.pedidos : (c.pedido ? [c.pedido] : []))))))];
      let m = Object.prototype.hasOwnProperty.call(caja.cuentas, cuenta) ? caja.cuentas[cuenta] : undefined;
      if (m === undefined) {
        try { m = await mapaDeDirectos(cuenta, mios); caja.cuentas[cuenta] = m; cambiado = true; }
        catch (e) { m = null; }               // no se ha podido preguntar: ni se guarda ni se pinta
      }
      if (m) tocado += repartirPorDirecto(cuenta, m);
    }
    if (cambiado) { try { localStorage.setItem(llave, JSON.stringify(caja)); } catch (e) {} }
    /* Con dos directos, el rotulo de la tarjeta tiene que salir aunque solo haya
     * una cuenta: es lo que lo distingue. */
    if (tocado) DATOS.variasCuentas = true;
    return tocado;
  }

  /* UNA TARJETA ES UNA BOLSA Y UNA ETIQUETA, no una cuenta de TikTok.
     Es lo que rompió el 16 y el 17 de septiembre: una misma cuenta puede
     acabar en varios paquetes -TikTok parte por dirección de envío- y la
     tarjeta enseñaba una cosa mientras la impresora sacaba otra. Cuando el
     servidor dice que esa persona lleva varios bultos, aquí salen varias
     tarjetas, cada una con las prendas de SU bolsa. */
  function construir(d) {
    const salida = [];
    for (const ta of (d.tandas || [])) {
      const bolsas = [];
      for (const c of (ta.compradores || [])) {
        const grupos = (c.porCuenta || [])
          .filter((x) => x.numeros && x.numeros.length)
          .map((x) => ({ cuenta: x.cuenta || '', dir: Number(x.dir || 1), quedan: x.numeros.slice() }));
        const base = grupos.length
          ? grupos : [{ cuenta: '', dir: 1, quedan: (c.numeros || []).slice() }];
        const trozos = (c.bultos && c.bultos.length > 1)
          ? c.bultos.map((b) => (b.numeros || []).slice()) : [null];

        for (const nums of trozos) {
          const sacos = base.map((r) => ({ cuenta: r.cuenta, dir: r.dir, numeros: [] }));
          if (nums === null) {
            base.forEach((r, k) => { sacos[k].numeros = r.quedan.slice(); });
          } else {
            /* Se reparte GASTANDO: cada número se lleva el primer perchero que
               aún lo tenga libre. Con dos percheros un comprador puede llevarse
               la 20 de los dos, y son prendas distintas. */
            for (const n of nums) {
              const k = base.findIndex((r) => r.quedan.indexOf(n) >= 0);
              if (k < 0) continue;
              base[k].quedan.splice(base[k].quedan.indexOf(n), 1);
              sacos[k].numeros.push(n);
            }
          }
          /* [rotulo, numeros]. El rotulo es el nombre de la cuenta tal y como
             se eligio en el paso 2, con su directo detras si emitio dos veces.
             Es lo unico que identifica la prenda cuando varias cuentas numeran
             desde el 1, que es lo normal. */
          const g = sacos.filter((x) => x.numeros.length)
            .map((x) => [x.cuenta || '', x.numeros.slice().sort((a, b) => a - b)]);
          if (!g.length) continue;
          /* CADA BOLSA NECESITA SU PROPIO NOMBRE EN LA COLA, porque la cola
             guarda una fila por pedido y dos bolsas de la misma persona
             chocarían. La primera se queda con su pedido de verdad; las
             siguientes llevan un apellido. No se inventa un pedido de otro:
             se dice que es la bolsa 2 de ese. */
          const k = bolsas.length;
          const suyas = bolsas.filter((x) => x.raiz === c.pedido).length;
          const id = suyas ? c.pedido + '#' + (suyas + 1) : String(c.pedido || ('b' + k));
          const numeros = g.flatMap((x) => x[1]);
          bolsas.push({
            q: c.apodo || '', d: trozos.length, g,
            ped: id, raiz: c.pedido,
            /* La ficha que viaja a la cola, con la misma forma de siempre para
               que el panel y la app vieja sigan entendiéndola. */
            ficha: {
              apodo: c.apodo || '', usuario: '', pedido: id,
              pedidos: c.pedidos || (c.pedido ? [c.pedido] : []),
              numeros, etiquetas: trozos.length, bultos: null,
              regalos: c.regalos || [],
              porCuenta: sacos.filter((x) => x.numeros.length)
                .map((x) => ({ cuenta: x.cuenta, dir: x.dir,
                               numeros: x.numeros.slice().sort((a, b) => a - b) }))
            }
          });
        }
      }
      if (bolsas.length) salida.push({ e: ta.etiqueta || 'Tanda', b: bolsas });
    }
    return salida;
  }

  /* CUÁNTOS PERCHEROS HAY DE VERDAD. Con uno solo, el rótulo del perchero
     sobra y estorba: el número ya es único. Con dos o más, el color y el
     rótulo son lo que evita coger la prenda equivocada. */
  function prepararTandas() {
    TANDAS.forEach((ta) => ta.b.forEach((b) => { b.piezas = piezas(b); }));
    PRENDAS = TANDAS.reduce((a, ta) => a + ta.b.reduce((s, b) => s + b.piezas.length, 0), 0);
    /* LOS PERCHEROS SON LAS CUENTAS. Se ordenan por nombre a proposito, no por
       el orden en que aparecen: asi el color de cada cuenta es el mismo aunque
       se vuelva a pasar el paso 2 y las tarjetas cambien de sitio, y la llave de
       lo marcado no se mueve. */
    PERCHEROS = [...new Set(TANDAS.flatMap((ta) =>
      ta.b.flatMap((b) => b.g.map((g) => g[0]))))].sort();
    VARIOS = PERCHEROS.length > 1;
    COLOR_DE = {};
    PERCHEROS.forEach((r, k) => { COLOR_DE[r] = k + 1; });
    TANDAS.forEach((ta) => ta.b.forEach((b) =>
      b.piezas.forEach((z) => { z.p = COLOR_DE[z.r] || 1; })));
    VALIDAS = new Set(TANDAS.flatMap((ta) =>
      ta.b.flatMap((b) => b.piezas.map((z) => 'p' + z.p + '.' + z.n))));
  }

  /* ======================================================================
     DÓNDE SE GUARDA LO MARCADO
     ======================================================================
     EN EL SERVIDOR, y el móvil es solo la copia. El 20 de septiembre vivía
     solo en el móvil y Aaron perdió dos tandas enteras ya marcadas al salirse
     de la app. El almacén del navegador se va con la pestaña y nadie se entera
     hasta que ya no está.

     Ahora:
       · se escribe fuera en cuanto se toca un botón
       · se lee al abrir, aunque sea otro móvil u otro navegador
       · dos personas marcando a la vez se ven la una a la otra
       · sin servidor se sigue trabajando contra el móvil y la pantalla LO DICE
         en vez de fingir que va bien

     LA LLAVE ES EL PERCHERO Y EL NÚMERO -p1.15-, no la posición en la lista.
     Cada paso 2 rehace las tandas y las tarjetas cambian de sitio; con la
     posición, volver a imprimir habría movido lo marcado a prendas que no son.
     El número dentro de su perchero es la prenda, hoy y mañana. */
  let CLAVE = '', MARCA = {};
  let ESTADO = 'local', DONDE = 'menu';
  let RESCATADAS = 0, PRIMERA = true;
  let escribiendo = false, pendiente = {};

  const enElMovil = () => { try { localStorage.setItem(CLAVE, JSON.stringify(MARCA)); } catch (e) {} };

  function poner(e) { if (ESTADO === e) return; ESTADO = e; pintarEstado(); }
  function pintarEstado() {
    const n = document.getElementById('estado');
    if (!n) return;
    const t = { bien:  ['Guardado',            'var(--verde)'],
                yendo: ['Guardando',           'var(--tenue)'],
                local: ['Solo en este móvil',  'var(--ambar)'],
                mal:   ['Sin guardar fuera',   'var(--p1rot)'] }[ESTADO] || ['', 'var(--tenue)'];
    n.textContent = t[0]; n.style.color = t[1];
  }

  /* Se manda SOLO lo que ha cambiado, no la tanda entera: así dos móviles
     marcando a la vez no se pisan, y el servidor une llave a llave. */
  async function alServidor() {
    if (!CODIGO || !JUEGO) { poner('local'); return; }
    if (escribiendo) return;
    const envio = pendiente; pendiente = {};
    if (!Object.keys(envio).length) return;
    escribiendo = true;
    poner('yendo');
    try {
      const r = await fetch('/api/tandas?d=' + encodeURIComponent(CODIGO), {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ juego: JUEGO, marcas: envio }) });
      const j = await r.json();
      if (!j || !j.ok) throw new Error('no ok');
      unir(j.marcas || {});
      poner('bien');
    } catch (e) {
      /* Lo que no ha entrado se vuelve a intentar, no se tira. */
      Object.assign(pendiente, envio, pendiente);
      poner('mal');
    } finally {
      escribiendo = false;
      if (Object.keys(pendiente).length) setTimeout(alServidor, 400);
    }
  }

  /* Lo de fuera manda, pero nunca borra lo nuestro que aún no ha salido. */
  function unir(fuera) {
    let cambio = false;
    for (const k of Object.keys(fuera)) {
      if (Object.prototype.hasOwnProperty.call(pendiente, k)) continue;
      if (MARCA[k] !== fuera[k]) { MARCA[k] = fuera[k]; cambio = true; }
    }
    if (cambio) { enElMovil(); repintar(); }
    return cambio;
  }

  /* Marcar es apuntar la prenda en la lista de lo que falta por salir, no
     mandar la tanda entera. Si no se apunta aquí, no sale nada y la pantalla
     puede seguir diciendo "Guardado" por la lectura de antes: así se perdió
     una prueba entera el 21 de septiembre. */
  const guardar = (k) => {
    if (k) pendiente[k] = MARCA[k] || null;
    enElMovil();
    alServidor();
  };

  /* Repinta lo que haya en pantalla sin sacar a nadie de donde estaba. */
  function repintar() {
    /* A quien empaqueta no se le repinta la pantalla porque alguien marque una
       prenda al otro lado del almacén. */
    if (DONDE === 'cola' || DONDE === 'quien') return;
    if (DONDE === 'bolsa') pintar();
    else if (DONDE === 'resumen') resumen();
    else menu();
  }

  async function leerMarcas(primera) {
    if (!CODIGO || !JUEGO) { poner('local'); return; }
    try {
      const r = await fetch('/api/tandas?d=' + encodeURIComponent(CODIGO) +
        '&juego=' + encodeURIComponent(JUEGO) + '&marcas=1', { cache: 'no-store' });
      const j = await r.json();
      if (!j || !j.ok) throw new Error('no ok');
      const fuera = j.marcas || {};
      /* EL RESCATE. Si en este móvil había marcas de la versión vieja que el
         servidor no tiene, se suben en vez de perderse. */
      if (primera) {
        const mias = Object.keys(MARCA).filter((k) => fuera[k] !== MARCA[k] && VALIDAS.has(k));
        if (mias.length) {
          RESCATADAS = mias.length;
          for (const k of mias) pendiente[k] = MARCA[k];
          alServidor();
        }
      }
      unir(fuera);
      if (!Object.keys(pendiente).length) poner('bien');
    } catch (e) { poner('mal'); }
  }

  /* La prenda es su número dentro de su perchero. Ver arriba. */
  const llave = (t, b, k) => {
    const z = TANDAS[t].b[b].piezas[k];
    return 'p' + z.p + '.' + z.n;
  };
  const puesto = (t, b, k) => MARCA[llave(t, b, k)] || null;

  const hechasDe = (t) => TANDAS[t].b.reduce((a, b, bi) =>
    a + b.piezas.filter((_, k) => puesto(t, bi, k)).length, 0);
  const prendasDe = (t) => TANDAS[t].b.reduce((a, b) => a + b.piezas.length, 0);
  /* SE CUENTA LO QUE HAY EN LAS TANDAS, prenda a prenda, no las llaves
     guardadas. Si el paso 2 se vuelve a pasar y una prenda ya no sale, su
     marca sigue en el servidor pero aquí no suma, y los dos números de la
     pantalla -lo hecho y el total- hablan siempre de lo mismo. */
  const todasLasPiezas = () => TANDAS.flatMap((ta, t) =>
    ta.b.flatMap((b, bi) => b.piezas.map((_, k) => puesto(t, bi, k))));
  const costeTodo = () => todasLasPiezas().reduce((a, id) => {
    const c = id && deId(id); return a + (c && c.coste ? c.coste : 0); }, 0);
  const hechasTodo = () => todasLasPiezas().filter(Boolean).length;

  let T = 0, B = 0, foco = 0;

  /* ======================================================================
     QUIÉN SOY Y QUÉ HAGO
     ======================================================================
     La cola apunta quién recogió y quién empaquetó cada bolsa. Sin nombre no
     se puede repartir el trabajo ni saber a quién preguntarle si falta algo.
     Se guarda en el móvil: se pone una vez al empezar el turno. */
  let MODO = '', QUIEN = '';
  try { MODO = localStorage.getItem('billys_modo') || ''; } catch (e) {}
  try { QUIEN = localStorage.getItem('billys_quien') || ''; } catch (e) {}
  let NOMBRES_HOY = [];

  /* ¿Esto es la misma persona escrita de otra manera? "yasmin" y "Yasmine" no
     son el mismo texto, pero casi siempre son la misma. Se PREGUNTA, no se
     decide solo: "Ana" y "Anna" pueden ser dos de verdad. */
  const sinAdornos = (x) => String(x || '').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  function pareceElMismo(a, b) {
    const x = sinAdornos(a), y = sinAdornos(b);
    if (!x || !y) return false;
    if (x === y) return true;
    if (x.length < 3 || y.length < 3) return false;
    const largo = x.length > y.length ? x : y, corto = x.length > y.length ? y : x;
    if (largo.startsWith(corto) && largo.length - corto.length <= 2) return true;
    if (x.length === y.length) {
      let d = 0;
      for (let k = 0; k < x.length; k++) if (x[k] !== y[k]) d++;
      if (d === 1) return true;
    }
    return false;
  }
  function comoSeEscribe(n) {
    const puesto = String(n || '').trim();
    if (!puesto) return '';
    const clavado = NOMBRES_HOY.find((x) => sinAdornos(x) === sinAdornos(puesto));
    if (clavado) return clavado.trim();
    const parecido = NOMBRES_HOY.find((x) => pareceElMismo(x, puesto));
    if (parecido && confirm('Hoy ya est\u00e1 trabajando ' + parecido + '.\n\n¿Eres tú?\n\n' +
        'Si le das a Aceptar, tus paquetes van con los de ' + parecido + '.')) return parecido;
    return puesto;
  }
  /* Se rellena con cualquier respuesta de la cola, que ya se pide sola. */
  function apuntarNombres(j) {
    const vistos = new Map(NOMBRES_HOY.map((n) => [n.trim().toLowerCase(), n]));
    for (const n of [...((j.tandas || []).map((t) => t.quien)),
                     ...((j.gente || []).map((g) => g.quien)),
                     ...((j.paquetes || []).flatMap((p) => [p.quien_abrio, p.quien_cierra])),
                     ...((j.queda || []).flatMap((p) => [p.quien_abrio, p.quien_cierra]))]) {
      const k = String(n || '').trim().toLowerCase();
      if (k && !vistos.has(k)) vistos.set(k, String(n).trim());
    }
    NOMBRES_HOY = [...vistos.values()];
  }

  /* Un aviso que no para el trabajo: se ve unos segundos y se va. */
  function susurro(texto) {
    let caja = document.getElementById('susurro');
    if (!caja) { caja = document.createElement('div'); caja.id = 'susurro'; document.body.appendChild(caja); }
    caja.textContent = texto;
    caja.classList.add('on');
    clearTimeout(susurro.reloj);
    susurro.reloj = setTimeout(() => caja.classList.remove('on'), 6000);
  }

  /* ======================================================================
     LA COLA DE EMPAQUETADO
     ======================================================================
     Quién recoge EMPUJA: cada bolsa terminada entra aquí. Quien empaqueta no
     elige, pide "el siguiente" y el servidor reparte. Con tres personas
     doblando, es lo único que evita que dos hagan la misma bolsa.

     Todo lo que se recoge entra y coge número, incidencias incluidas. Una
     incidencia entra PARADA: no se le da a nadie, pero existe y se ve. El 17
     de agosto se acabó el turno con 21 paquetes recogidos que no existían
     para nadie porque las incidencias se quedaban en el móvil de quien las
     vio.

     Es la misma cola de siempre, el mismo /api/cola: esta app y la vieja
     hablan del mismo sitio. */
  const urlCola = () => '/api/cola?d=' + encodeURIComponent(CODIGO) +
    (JUEGO ? '&juego=' + encodeURIComponent(JUEGO) : '');

  let PAQ = null;      // la bolsa que tengo ahora mismo en la mesa
  let NADA = null;     // lo que contestó el servidor cuando no había nada que dar
  let relojCola = null;
  try { PAQ = JSON.parse(localStorage.getItem('billys_paq') || 'null'); } catch (e) { PAQ = null; }

  /* Lo deslizado que aún no ha salido del móvil. Sin esto, un segundo sin
     cobertura en el almacén es una bolsa que nadie empaqueta. */
  const LLAVE_COLA = 'billys_cola_pend';
  let PENDCOLA = [];
  try { PENDCOLA = JSON.parse(localStorage.getItem(LLAVE_COLA) || '[]'); } catch (e) { PENDCOLA = []; }
  const guardarPend = () => { try { localStorage.setItem(LLAVE_COLA, JSON.stringify(PENDCOLA)); } catch (e) {} };

  async function apiCola(cuerpo) {
    const r = await fetch(urlCola(), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, cache: 'no-store',
      body: JSON.stringify({ juego: JUEGO || undefined, ...cuerpo })
    });
    return r.json();
  }

  const hace = (t) => {
    if (!t) return '';
    const m = Math.round((Date.now() - new Date(t)) / 60000);
    return m < 1 ? 'ahora mismo' : (m < 60 ? 'hace ' + m + ' min'
      : 'hace ' + Math.floor(m / 60) + ' h ' + (m % 60) + ' min');
  };
  const laHora = (t) => {
    if (!t) return '';
    try { return new Date(t).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' }); }
    catch (e) { return ''; }
  };

  /* --------------------------------------------------- quién soy y qué hago */
  function quienSoy() {
    DONDE = 'quien';
    $('barra').hidden = true;
    $('pantalla').innerHTML = `
      <div class="menu">
        <h1>¿Quién eres?</h1>
        <p class="sub">La cola apunta quién recoge y quién empaqueta cada bolsa. Es lo
          que permite repartir el trabajo sin que dos hagan la misma.</p>
        <input class="campo" id="miNombre" placeholder="Tu nombre" value="${esc(QUIEN)}"
          autocomplete="off" autocapitalize="words">
        ${NOMBRES_HOY.length ? `<div class="nombresHoy">${NOMBRES_HOY.map((n) =>
          `<button data-n="${esc(n)}"${sinAdornos(n) === sinAdornos(QUIEN) ? ' class="yo"' : ''}>${esc(n)}</button>`
        ).join('')}</div>` : ''}
        <p class="sub" style="margin-top:6px">¿Qué vas a hacer ahora?</p>
        <div class="modos">
          <button class="modoBtn${MODO === 'recoge' ? ' on' : ''}" data-m="recoge">Cojo prendas</button>
          <button class="modoBtn${MODO === 'empaqueta' ? ' on' : ''}" data-m="empaqueta">Empaqueto</button>
        </div>
        <button class="accion" id="empezar"${QUIEN.trim() && MODO ? '' : ' disabled'}>Empezar</button>
        <div class="nota">
          <div><b>Cojo prendas</b> es ir por los percheros con la app: al acabar cada bolsa,
            esa bolsa entra en la cola con su número y quien empaqueta la recibe.</div>
          <div><b>Empaqueto</b> es pedir bolsas de la cola, una a una, y cerrarlas.</div>
          <div>Se puede cambiar cuando quieras desde arriba.</div>
        </div>
      </div>`;
    window.scrollTo(0, 0);
  }

  /* A dónde va cada uno al empezar. */
  function casa() {
    if (!QUIEN.trim() || !MODO) { quienSoy(); return; }
    if (MODO === 'empaqueta') verCola(); else menu();
  }

  const barraQuien = () => `<div class="quienSoyBarra">
      <span><b>${esc(QUIEN)}</b> · ${MODO === 'empaqueta' ? 'empaquetando' : 'cogiendo prendas'}</span>
      <button class="volver" id="cambiarQuien" style="margin-left:auto">Cambiar</button>
    </div>`;

  /* ------------------------------------------------------------- el menú */
  function menu() {
    DONDE = 'menu';
    $('barra').hidden = true;
    const total = hechasTodo();
    const BOLSAS = TANDAS.reduce((a, ta) => a + ta.b.length, 0);
    $('pantalla').innerHTML = `
      <div class="menu">
        ${barraQuien()}
        <h1>${esc(DATOS.titulo || 'Recogida')}</h1>
        <p class="sub">${BOLSAS} bolsas, ${PRENDAS} prendas. Las bolsas van en el mismo
          orden que las hojas del taco que ya está impreso.</p>
        <div class="cifras">
          <div class="cifra"><u>${total}/${PRENDAS}</u><span>marcadas</span></div>
          ${cifraCoste(eur(costeTodo()))}
          <div class="cifra"><u>${TANDAS.length}</u><span>tandas</span></div>
        </div>
        <div class="tandas">
          ${TANDAS.map((ta, k) => {
            const h = hechasDe(k), p = prendasDe(k);
            const clase = h === p ? ' lista' : (h ? ' media' : '');
            return `<button class="tbot${clase}" data-t="${k}">
              <span class="tt"><b>${esc(ta.e)}</b>
                <span>${ta.b.length} ${ta.b.length === 1 ? 'bolsa' : 'bolsas'} · ${p} prendas</span></span>
              <span class="marca">${h}/${p}</span></button>`;
          }).join('')}
        </div>
        <button class="accion" id="irCola">Ir a la cola de empaquetado</button>
        ${total ? `<button class="accion fuera" id="resumen">Ver el resumen</button>` : ''}
        ${RESCATADAS ? `<div class="nota" style="border-color:var(--verde)">
          <div><b>He rescatado ${RESCATADAS} ${RESCATADAS === 1 ? 'prenda' : 'prendas'} que estaban
          guardadas solo en este ordenador</b>, y ya están en el servidor. Desde ahora se ven
          también desde el móvil y no se pueden perder al cerrar.</div></div>` : ''}
        <div class="nota">
          ${VARIOS ? `<div><b>Hay ${PERCHEROS.length} percheros y cada uno numera desde el 1.</b>
            La 20 de uno y la 20 de otro son prendas distintas: ${PERCHEROS.map((r, k) =>
            `<b style="color:var(--p${k + 1}rot)">${esc(r)}</b>`).join(', ')}.
            Mira el nombre antes que el número.</div>` : `<div><b>Un solo perchero.</b> Todo es
            del mismo anuncio, así que cada número está una sola vez.</div>`}
          <div>Lo que marcas se guarda fuera, no en el móvil. Puedes cerrar, cambiar de
            móvil o repartiros la tanda entre varias: arriba a la derecha pone
            <b>Guardado</b> cuando está a salvo.</div>
        </div>
        <p class="pie">Los euros llevan IVA y porte dentro y salen de las facturas de compra.</p>
      </div>`;
    window.scrollTo(0, 0);
  }

  /* ---------------------------------------------------------- una bolsa */
  function pintarBarra() {
    $('tanda').textContent = TANDAS[T].e;
    $('cuenta').textContent = hechasDe(T) + '/' + prendasDe(T);
    $('coste').innerHTML = (ADMIN ? eur(costeTodo()) : '') + '<small id="estado"></small>';
    pintarEstado();
    $('tripa').style.width = (hechasDe(T) / prendasDe(T) * 100) + '%';
  }

  function pintar() {
    DONDE = 'bolsa';
    const ta = TANDAS[T], b = ta.b[B];
    const marcaAhora = puesto(T, B, foco);
    const pieza = b.piezas[foco];

    let k = -1;
    const cuerpo = b.g.map(([r, nums]) => { const p = COLOR_DE[r] || 1; return `
      <div class="grupo p${p}">
        ${VARIOS ? `<div class="perchero p${p}"><i></i>${esc(r)}</div>` : ''}
        <div class="nums">${nums.map((n) => { k++; const kk = k; const id = puesto(T, B, kk);
          return `<button class="num p${p}${kk === foco ? ' foco' : ''}${id ? ' hecho' : ''}"
            data-k="${kk}"><u>${n}</u><em>${id ? esc(deId(id).n) : ''}</em></button>`;
        }).join('')}</div>
      </div>`; }).join('');

    const rejilla = FAM.map((f) => `
      <div class="familia"><i style="background:${f.color}"></i>${f.n}</div>
      <div class="rejilla">${CATS.filter((c) => c.fam === f.id).map((c) => `
        <button class="cat${marcaAhora === c.id ? ' puesta' : ''}" data-cat="${c.id}">
          <svg viewBox="0 0 32 32" fill="${COLOR[c.fam]}"><use href="#i-${c.ico}"></use></svg>
          <b>${c.n}</b>
        </button>`).join('')}</div>`).join('');

    $('pantalla').innerHTML = `
      <div class="tarjeta">
        <div class="quien">
          <div class="nombre">${esc(b.q)}</div>
          <div class="bolsa"><b>${B + 1} de ${ta.b.length}</b>
            <span>hoja ${B + 1} del taco</span></div>
        </div>
        ${b.d > 1 ? `<div class="aviso">A esta persona TikTok le ha hecho <b>${b.d} bultos</b>.
          Esta bolsa lleva <b>su propia etiqueta</b>: no metas en ella lo de la otra.</div>` : ''}
        ${cuerpo}
      </div>
      <div class="marcar">
        <p class="pregunta">Tienes la <b>${pieza.n}</b>${VARIOS ? ` de
          <b style="color:var(--p${pieza.p}rot)">${esc(pieza.r)}</b>` : ''} en la mano. ¿Qué es?</p>
        ${rejilla}
      </div>
      <div style="display:flex;gap:9px;margin-top:14px">
        <button class="accion fuera" id="atras" style="flex:1"${B === 0 ? ' disabled' : ''}>Bolsa anterior</button>
        <button class="accion fuera" id="salir" style="flex:1">Salir a las tandas</button>
      </div>
      <button class="accion fuera" id="incidencia" style="margin-top:9px;
        border-color:var(--ambar);color:var(--ambar)">Esta bolsa tiene un problema</button>`;
    pintarBarra();
  }

  function siguiente() {
    const ta = TANDAS[T], b = ta.b[B];
    const libre = b.piezas.findIndex((_, k) => !puesto(T, B, k));
    if (libre >= 0) { foco = libre; pintar(); return; }
    /* BOLSA TERMINADA. Todas sus prendas están dichas, o sea que están en la
       mano de quien recoge: la bolsa entra en la cola y quien empaqueta la
       puede pedir ya. Repetirla no hace daño: meter no toca una bolsa que ya
       esté en la cola, por si alguien vuelve a corregir una categoría. */
    aLaCola(b, ta, false, '');
    if (B + 1 < ta.b.length) { B++; foco = 0; pintar(); window.scrollTo(0, 0); return; }
    resumen();
  }

  /* ======================================================================
     EMPUJAR UNA BOLSA A LA COLA
     ====================================================================== */
  function aLaCola(b, ta, incidencia, motivo) {
    if (MODO !== 'recoge' || !CODIGO || !QUIEN.trim()) return;
    if (!b || !b.ped) return;
    PENDCOLA.push({
      pedido: b.ped, apodo: b.q, prendas: b.piezas.length,
      tanda: (ta && ta.e) || '',
      /* Sellado aquí: si el envío espera cobertura y mientras cambia quien usa
         la tablet, esa bolsa es de quien la recogió. */
      quien: QUIEN,
      incidencia: !!incidencia, motivo: motivo || '',
      dia: diaMadrid(Date.now()), juego: JUEGO || null,
      ficha: b.ficha, en: new Date().toISOString()
    });
    guardarPend();
    vaciarCola();
  }

  const diaMadrid = (t) => {
    try { return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Madrid' }).format(new Date(t)); }
    catch (e) { return null; }
  };

  const YA_AVISADO = new Set();
  function avisarDeOtro(lista, delEnvio) {
    if (!Array.isArray(lista) || !lista.length) return;
    const nuevos = lista.filter((x) => delEnvio.has(x.pedido) && !YA_AVISADO.has(x.pedido));
    if (!nuevos.length) return;
    for (const x of nuevos) YA_AVISADO.add(x.pedido);
    const quien = nuevos[0].quien;
    susurro(nuevos.length === 1
      ? 'La bolsa de ' + (nuevos[0].apodo || 'ese comprador') + ' ya la había recogido ' +
        quien + ' (nº' + nuevos[0].numero + '). Estáis haciendo la misma tanda.'
      : nuevos.length + ' de las bolsas que acabas de pasar ya las había recogido ' + quien +
        '. Estáis haciendo la misma tanda.');
  }

  let vaciando = false;
  async function vaciarCola() {
    if (vaciando || !PENDCOLA.length || !CODIGO) return;
    vaciando = true;
    /* Una tanda por persona y por día: el servidor apunta un solo nombre y un
       solo día por envío, así que mezclarlos le colgaría a uno el trabajo del
       otro. */
    const dueno = PENDCOLA[0].quien || QUIEN;
    const cuando = PENDCOLA[0].dia || null;
    const elJuego = PENDCOLA[0].juego || JUEGO;
    const mismo = (x) => (x.quien || QUIEN) === dueno && (x.dia || null) === cuando &&
                         (x.juego || JUEGO) === elJuego;
    const iban = PENDCOLA.filter(mismo);
    try {
      const r = await fetch(urlCola(), {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, cache: 'no-store',
        body: JSON.stringify({ accion: 'meter', quien: dueno, dia: cuando,
                               juego: elJuego || undefined, paquetes: iban })
      });
      const j = await r.json();
      if (j && j.ok) {
        const fuera = new Set(iban.map((x) => x.pedido));
        PENDCOLA = PENDCOLA.filter((x) => !fuera.has(x.pedido));
        guardarPend();
        avisarDeOtro(j.deOtro, fuera);
      }
    } catch (e) { /* sin red: se queda pendiente y sale con el siguiente */ }
    vaciando = false;
    if (PENDCOLA.length) setTimeout(vaciarCola, 4000);
  }
  setInterval(vaciarCola, 20000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) vaciarCola(); });

  /* ======================================================================
     LA PANTALLA DE QUIEN EMPAQUETA
     ====================================================================== */
  /* La tarjeta de una bolsa que viene de la cola. No se pinta desde las
     tandas: se pinta desde la ficha que viajó con ella, que es lo único que
     seguro que existe aunque el paso 2 se haya vuelto a pasar desde entonces. */
  function tarjetaDeFicha(ficha) {
    if (!ficha) return '';
    const grupos = (ficha.porCuenta || []).filter((x) => (x.numeros || []).length);
    const varios = grupos.length > 1 || grupos.some((x) => Number(x.dir || 0) > 1);
    const cuerpo = (grupos.length ? grupos : [{ dir: 1, numeros: ficha.numeros || [] }])
      .map((x) => {
        const p = Number(x.dir || 1);
        return `<div class="grupo p${p}">
          ${varios ? `<div class="perchero p${p}"><i></i>${esc(x.cuenta || ('Perchero ' + p))}</div>` : ''}
          <div class="nums">${(x.numeros || []).map((n) =>
            `<span class="num p${p}" style="pointer-events:none"><u>${n}</u><em></em></span>`).join('')}</div>
        </div>`;
      }).join('');
    return `<div class="tarjeta">
      <div class="quien">
        <div class="nombre">${esc(ficha.apodo || '')}</div>
        <div class="bolsa"><b>${(ficha.numeros || []).length}
          ${(ficha.numeros || []).length === 1 ? 'prenda' : 'prendas'}</b></div>
      </div>
      ${Number(ficha.etiquetas || 1) > 1 ? `<div class="aviso">A esta persona TikTok le ha hecho
        <b>${ficha.etiquetas} bultos</b>. Esta bolsa lleva <b>su propia etiqueta</b>.</div>` : ''}
      ${cuerpo}
    </div>`;
  }

  function verCola() {
    DONDE = 'cola';
    $('barra').hidden = true;
    pintarCola();
    refrescarContador();
    comprobarMio();
  }

  function pintarCola() {
    const hay = !!PAQ;
    $('pantalla').innerHTML = `
      <div class="menu">
        ${barraQuien()}
        <h1>Empaquetar</h1>
        <p class="sub" id="colaSub">Mirando cómo va la cola…</p>
        <div id="colaFicha">${hay ? `
          <div class="colaNum">#${PAQ.numero}</div>
          ${PAQ.quien_abrio ? `<div class="deQuien">La recogió <b>${esc(PAQ.quien_abrio)}</b>${
            PAQ.abierto_en ? ' · ' + laHora(PAQ.abierto_en) + ' (' + hace(PAQ.abierto_en) + ')' : ''}${
            PAQ.tanda ? ' · ' + esc(PAQ.tanda) : ''}</div>` : ''}
          ${PAQ.rescatado ? `<div class="rescate">Esta bolsa la tenía
            <b>${esc(PAQ.rescatado.loTenia)}</b> desde hace ${PAQ.rescatado.minutos} min y no la
            cerró. <b>Compruébala antes de cerrarla</b>: puede estar a medias.</div>` : ''}
          ${PAQ.motivo ? `<div class="rescate">Venía con incidencia: <b>${esc(PAQ.motivo)}</b>.
            Si sigue sin arreglarse, devuélvela.</div>` : ''}
          ${tarjetaDeFicha(PAQ.ficha)}
        ` : `<div class="vacia">${NADA
          ? (NADA.haciendo || NADA.parado
              ? 'Nadie tiene bolsas esperando, pero <b>todavía queda trabajo</b>:' +
                (NADA.haciendo ? '<br>' + NADA.haciendo + (NADA.haciendo === 1
                  ? ' abierta en otro móvil' : ' abiertas en otros móviles') : '') +
                (NADA.parado ? '<br>' + NADA.parado + (NADA.parado === 1
                  ? ' parada por incidencia' : ' paradas por incidencia') : '') +
                '<br><br>Lo tienes aquí abajo.'
              : 'No hay bolsas esperando.<br>Vuelve a pulsar en un momento.')
          : 'Pulsa <b>Dame la siguiente</b> cuando estés libre.'}</div>`}
        </div>
        ${hay ? `
          <button class="accion" id="cerrarPaq">Cerrada, siguiente</button>
          <button class="accion fuera" id="soltarPaq">Devolverla a la cola</button>
        ` : `<button class="accion" id="pedir">Dame la siguiente</button>`}
        <div class="colaQueda" id="colaQueda"></div>
        ${MODO === 'empaqueta' ? `<button class="accion fuera" id="irTandas"
          style="margin-top:4px">Ver las tandas</button>` : `<button class="accion fuera"
          id="irTandas" style="margin-top:4px">Volver a las tandas</button>`}
      </div>`;
    window.scrollTo(0, 0);
  }

  /* ¿La bolsa que tengo en pantalla sigue siendo mía? Si estuvo doce minutos
     parada, el servidor se la dio a otro y este móvil seguía enseñándola. */
  async function comprobarMio() {
    if (!PAQ || !PAQ.pedido || !CODIGO) return;
    try {
      const j = await (await fetch(urlCola(), { cache: 'no-store' })).json();
      if (!j || !j.ok || !Array.isArray(j.queda)) return;
      const mio = j.queda.find((x) => x.pedido === PAQ.pedido);
      const num = '#' + ((mio && mio.numero) || PAQ.numero);
      if (mio && mio.estado === 'haciendo' && mio.quien_cierra === QUIEN) return;
      if (!mio) {
        /* Ya no está sin cerrar: o la cerró alguien, o no existe. */
        PAQ = null; try { localStorage.removeItem('billys_paq'); } catch (e) {}
        pintarCola();
        susurro('La bolsa ' + num + ' ya está cerrada. Pide la siguiente.');
        return;
      }
      PAQ = null; try { localStorage.removeItem('billys_paq'); } catch (e) {}
      pintarCola();
      susurro('La bolsa ' + num + ' ha pasado a ' + (mio.quien_cierra || 'la cola') +
        ': llevaba mucho rato abierta. Pide la siguiente.');
    } catch (e) { /* sin red: mejor dejarlo como estaba */ }
  }

  /* Cuántas quedan. Es lo que le dice a quien empaqueta si puede ir al baño o
     si tiene diez encima. */
  async function refrescarContador() {
    clearInterval(relojCola);
    if (DONDE !== 'cola') return;
    relojCola = setInterval(refrescarContador, 15000);
    try {
      const j = await (await fetch(urlCola(), { cache: 'no-store' })).json();
      if (!j || !j.ok) return;
      apuntarNombres(j);
      const sub = $('colaSub');
      if (sub) sub.innerHTML = j.espera + (j.espera === 1 ? ' bolsa esperando · ' : ' bolsas esperando · ')
        + j.cerrado + ' hechas hoy'
        + (j.atascados ? ' · <b style="color:var(--ambar)">' + j.atascados +
            (j.atascados === 1 ? ' atascada' : ' atascadas') + '</b>' : '')
        + (j.parado ? ' · <b style="color:var(--ambar)">' + j.parado +
            (j.parado === 1 ? ' parada' : ' paradas') + '</b>' : '');
      pintarQueda(j.queda || []);
    } catch (e) { const sub = $('colaSub'); if (sub) sub.textContent = 'Sin conexión con el servidor'; }
  }

  /* LO QUE QUEDA POR CERRAR. El 17 de agosto se acabó el turno con cero en
     espera, una abierta en un móvil que ya no estaba en el almacén y 21
     paradas por incidencia, y las pantallas decían "no hay nada esperando".
     Esta lista es el sitio donde mirarlo. */
  function pintarQueda(queda) {
    const caja = $('colaQueda');
    if (!caja) return;
    const otros = queda.filter((q) => !(PAQ && q.pedido === PAQ.pedido));
    if (!otros.length) { caja.innerHTML = ''; return; }
    const linea = (q) => {
      const quienTiene = q.estado === 'haciendo'
        ? 'la tiene <b>' + esc(q.quien_cierra || '¿?') + '</b> ' + hace(q.tomado_en)
        : (q.estado === 'espera' ? 'esperando desde ' + laHora(q.abierto_en)
          : (q.estado === 'parado' ? (q.motivo ? esc(q.motivo) : 'incidencia sin resolver')
            : 'la retiró ' + esc(q.quien_abrio || 'quien recoge')));
      const datos = ' data-p="' + esc(q.pedido) + '" data-n="' + q.numero + '"';
      const boton = q.estado === 'parado'
        ? '<button class="qResolver"' + datos + '>Ya está</button>'
        : (q.estado === 'retirado' ? ''
          : '<button class="qCerrar"' + datos + '>Cerrada</button>' +
            '<button class="qCoger"' + datos + '>La hago yo</button>');
      return '<div class="qLinea ' + q.estado + (q.atascado ? ' atascado' : '') + '">' +
        '<b>' + q.numero + '</b><span class="qq">' + esc(q.apodo || '') +
        '<small>' + quienTiene + ' · recogió ' + esc(q.quien_abrio || '¿?') + '</small></span>' +
        boton + '</div>';
    };
    const grupo = (titulo, lista) => lista.length
      ? '<h3>' + titulo + '</h3>' + lista.map(linea).join('') : '';
    caja.innerHTML =
      grupo('Sin cerrar', otros.filter((q) => q.estado === 'haciendo' || q.estado === 'espera')) +
      grupo('Paradas por incidencia', otros.filter((q) => q.estado === 'parado')) +
      grupo('Retiradas por quien recoge', otros.filter((q) => q.estado === 'retirado'));
  }

  async function pedirSiguiente() {
    const b = $('pedir');
    if (b) { b.disabled = true; b.textContent = 'Pidiendo…'; }
    try {
      const j = await apiCola({ accion: 'siguiente', quien: QUIEN });
      if (j && j.ok && j.hay) {
        PAQ = j.paquete;
        PAQ.juego = JUEGO;
        PAQ.rescatado = j.rescatado ? { loTenia: j.loTenia, minutos: j.minutos } : null;
        try { localStorage.setItem('billys_paq', JSON.stringify(PAQ)); } catch (e) {}
        vibrar(20);
      } else {
        PAQ = null;
        NADA = (j && (j.haciendo || j.parado))
          ? { haciendo: j.haciendo || 0, parado: j.parado || 0 } : { haciendo: 0, parado: 0 };
      }
    } catch (e) { susurro('No he podido hablar con el servidor. Prueba otra vez.'); }
    pintarCola(); refrescarContador();
  }

  async function cerrarPaquete() {
    if (!PAQ) return;
    const en = new Date().toISOString();
    const pedido = PAQ.pedido;
    try {
      const j = await apiCola({ accion: 'cerrar', quien: QUIEN, pedido, en });
      if (j && j.ok) {
        PAQ = null;
        try { localStorage.removeItem('billys_paq'); } catch (e) {}
        vibrar([18, 40, 18]);
      } else susurro('No se ha podido cerrar. Prueba otra vez.');
    } catch (e) { susurro('Sin conexión. La bolsa sigue siendo tuya; prueba otra vez.'); }
    pintarCola(); refrescarContador();
  }

  async function soltarPaquete() {
    if (!PAQ) return;
    if (!confirm('¿Devolverla a la cola para que la haga otra persona?')) return;
    try { await apiCola({ accion: 'soltar', quien: QUIEN, pedido: PAQ.pedido }); } catch (e) {}
    PAQ = null;
    try { localStorage.removeItem('billys_paq'); } catch (e) {}
    pintarCola(); refrescarContador();
  }

  /* ------------------------------------------------------------ resumen */
  function resumen() {
    DONDE = 'resumen';
    $('barra').hidden = true;
    const cuenta = {};
    todasLasPiezas().forEach((id) => { if (id) cuenta[id] = (cuenta[id] || 0) + 1; });
    const filas = Object.entries(cuenta).map(([id, n]) => ({ c: deId(id), n }))
      .filter((f) => f.c).sort((a, b) => ADMIN ? (b.c.coste || 0) * b.n - (a.c.coste || 0) * a.n : b.n - a.n);
    const sinSaber = cuenta.nose || 0;
    /* Dónde está cada "No sé", para poder volver sin buscarla a mano. */
    const dudas = [];
    TANDAS.forEach((ta, t) => ta.b.forEach((b, bi) => b.piezas.forEach((z, k) => {
      if (puesto(t, bi, k) === 'nose') dudas.push({ t, b: bi, k, n: z.n });
    })));
    const texto = 'Billy\'s · ' + JUEGO + '\n' +
      filas.map((f) => f.c.n + ': ' + f.n).join('\n') +
      '\nTOTAL: ' + hechasTodo() + ' prendas' + (ADMIN ? ' · ' + eur(costeTodo()) : '');

    $('pantalla').innerHTML = `
      <div class="fin">
        <button class="volver" id="alMenu">Volver a las tandas</button>
        <h1>Lo marcado hasta ahora</h1>
        <div class="cifras">
          <div class="cifra"><u>${hechasTodo()}/${PRENDAS}</u><span>prendas</span></div>
          ${cifraCoste(eur(costeTodo()))}
          <div class="cifra"><u>${filas.length}</u><span>categorías</span></div>
        </div>
        <table class="tabla"><thead><tr>
          <th>Categoría</th><th class="n">Prendas</th>${ADMIN ? '<th class="n">Coste</th>' : ''}
        </tr></thead><tbody>
          ${filas.map((f) => `<tr><td>${f.c.n}</td><td class="n">${f.n}</td>
            ${ADMIN ? `<td class="n">${f.c.coste == null ? '—' : eur(f.c.coste * f.n)}</td>` : ''}</tr>`).join('')}
        </tbody></table>
        ${sinSaber ? `<div class="nota"><div><b>${sinSaber}
          ${sinSaber === 1 ? 'prenda ha ido' : 'prendas han ido'} a "No sé".</b> Toca una para
          volver a ella y cambiarla.</div>
          <div class="dudas">${dudas.map((d) => `<button class="duda"
            data-ir="${d.t}.${d.b}.${d.k}">T${d.t + 1} · bolsa ${d.b + 1} · nº ${d.n}</button>`).join('')}</div>
          </div>` : ''}
        <button class="accion" id="copiar">Copiar el resumen</button>
        <div class="copiado" id="copiado"></div>
        <p class="pie">Esto se guarda fuera y se actualiza solo. Cópialo cuando quieras
          pasarlo a una hoja.</p>
      </div>`;
    $('alMenu').addEventListener('click', menu);
    $('copiar').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(texto); $('copiado').textContent = 'Copiado.'; }
      catch (e) { $('copiado').textContent = 'No he podido copiar. Haz una captura de la tabla.'; }
    });
    window.scrollTo(0, 0);
  }

  /* --------------------------------------------------------------- click */
  /* El nombre se escribe en la pantalla de quién soy. */
  $('pantalla').addEventListener('input', (e) => {
    if (e.target && e.target.id === 'miNombre') {
      QUIEN = e.target.value;
      const b = $('empezar');
      if (b) b.disabled = !(QUIEN.trim() && MODO);
    }
  });

  $('pantalla').addEventListener('click', async (e) => {
    /* --------------------------------------------------- quién soy y qué hago */
    const nom = e.target.closest('.nombresHoy button');
    if (nom) {
      QUIEN = nom.dataset.n;
      const campo = $('miNombre');
      if (campo) campo.value = QUIEN;
      quienSoy();
      return;
    }
    const mb = e.target.closest('.modoBtn');
    if (mb) {
      MODO = mb.dataset.m;
      const campo = $('miNombre');
      if (campo) QUIEN = campo.value;
      quienSoy();
      return;
    }
    if (e.target.closest('#empezar')) {
      const campo = $('miNombre');
      QUIEN = comoSeEscribe(campo ? campo.value : QUIEN);
      if (!QUIEN.trim() || !MODO) return;
      try { localStorage.setItem('billys_quien', QUIEN); } catch (err) {}
      try { localStorage.setItem('billys_modo', MODO); } catch (err) {}
      casa();
      return;
    }
    if (e.target.closest('#cambiarQuien')) { quienSoy(); return; }
    if (e.target.closest('#irCola')) { verCola(); return; }
    if (e.target.closest('#irTandas')) { clearInterval(relojCola); menu(); return; }

    /* ------------------------------------------------------------- la cola */
    if (e.target.closest('#pedir')) { await pedirSiguiente(); return; }
    if (e.target.closest('#cerrarPaq')) { await cerrarPaquete(); return; }
    if (e.target.closest('#soltarPaq')) { await soltarPaquete(); return; }

    const bC = e.target.closest('.qCoger');
    const bR = e.target.closest('.qResolver');
    const bX = e.target.closest('.qCerrar');
    if (bC || bR || bX) {
      const bot = bC || bR || bX;
      const pedido = bot.dataset.p, num = bot.dataset.n;
      bot.disabled = true;
      /* "Esa ya está hecha": se cierra a nombre de quien lo dice, sin tener que
         cogerla antes. Es el gesto que faltaba para la bolsa que ya está
         cerrada encima de la mesa. */
      if (bX) {
        if (!confirm('¿La bolsa #' + num + ' ya está cerrada?\n\nSe apuntará a tu nombre.')) {
          bot.disabled = false; return;
        }
        try {
          const j = await apiCola({ accion: 'cerrarLista', quien: QUIEN,
            paquetes: [{ pedido, en: new Date().toISOString() }] });
          if (!j || !j.ok) susurro('No he podido cerrarla. Prueba otra vez.');
          else if ((j.deOtro || []).length) {
            susurro('La nº' + num + ' la tenía abierta ' + j.deOtro[0].quien +
              '. La he cerrado a tu nombre; díselo.');
          }
          if (PAQ && PAQ.pedido === pedido) {
            PAQ = null; try { localStorage.removeItem('billys_paq'); } catch (err) {}
            pintarCola();
          }
        } catch (err) { susurro('Sin conexión. Prueba otra vez.'); }
        refrescarContador();
        return;
      }
      if (bR) {
        if (!confirm('¿La bolsa #' + num + ' ya está resuelta?\n\nVuelve a la cola y se la daré a quien pida la siguiente.')) {
          bot.disabled = false; return;
        }
        try {
          const j = await apiCola({ accion: 'resolver', quien: QUIEN, pedido });
          if (!j || !j.ok || !j.resuelto) susurro('No he podido: puede que ya la haya movido otra persona.');
        } catch (err) { susurro('Sin conexión. Prueba otra vez.'); }
        refrescarContador();
        return;
      }
      if (PAQ && !confirm('Tienes la #' + PAQ.numero + ' sin cerrar.\n\n¿Coger la #' + num + ' de todas formas?')) {
        bot.disabled = false; return;
      }
      try {
        const j = await apiCola({ accion: 'coger', quien: QUIEN, pedido });
        if (j && j.ok && j.cogido) {
          PAQ = j.paquete;
          PAQ.juego = JUEGO;
          PAQ.rescatado = j.rescatado ? { loTenia: j.loTenia, minutos: j.minutos } : null;
          try { localStorage.setItem('billys_paq', JSON.stringify(PAQ)); } catch (err) {}
          vibrar(20);
          pintarCola();
        } else {
          susurro(j && j.estado === 'cerrado'
            ? 'Esa ya la ha cerrado ' + (j.loTenia || 'otra persona') + '.'
            : 'No he podido cogerla. Mira cómo está en la lista.');
        }
      } catch (err) { susurro('Sin conexión. Prueba otra vez.'); }
      refrescarContador();
      return;
    }

    /* ----------------------------------------------------- una bolsa con problema */
    if (e.target.closest('#incidencia')) {
      const ta = TANDAS[T], b = ta.b[B];
      const motivo = (prompt('¿Qué le pasa a la bolsa de ' + (b.q || 'este comprador') + '?\n\n' +
        'Una línea basta: falta la 214, manchada, no está en el perchero…') || '').trim();
      if (!motivo) return;
      aLaCola(b, ta, true, motivo.slice(0, 140));
      vibrar([12, 40, 12]);
      susurro('Apuntada como incidencia. Entra en la cola parada, con su número, ' +
        'hasta que alguien diga que está resuelta.');
      if (B + 1 < ta.b.length) { B++; foco = 0; pintar(); window.scrollTo(0, 0); }
      else resumen();
      return;
    }

    const t = e.target.closest('[data-t]');
    if (t) { T = Number(t.dataset.t); B = 0; foco = 0;
      const ta = TANDAS[T];
      /* Se abre por la primera bolsa que quede sin acabar. */
      const pend = ta.b.findIndex((b, bi) => b.piezas.some((_, k) => !puesto(T, bi, k)));
      B = pend >= 0 ? pend : 0;
      foco = Math.max(0, ta.b[B].piezas.findIndex((_, k) => !puesto(T, B, k)));
      $('barra').hidden = false; pintar(); window.scrollTo(0, 0); return; }

    const ir = e.target.closest('[data-ir]');
    if (ir) { const [t, b, k] = ir.dataset.ir.split('.').map(Number);
      T = t; B = b; foco = k; $('barra').hidden = false; pintar(); window.scrollTo(0, 0); return; }
    if (e.target.closest('#resumen')) { resumen(); return; }
    if (e.target.closest('#salir')) { menu(); return; }
    if (e.target.closest('#atras')) { if (B > 0) { B--; foco = 0; pintar(); window.scrollTo(0, 0); } return; }

    const num = e.target.closest('.num');
    if (num) { foco = Number(num.dataset.k); pintar(); return; }

    const cat = e.target.closest('.cat');
    if (!cat) return;
    vibrar(14);
    const k = llave(T, B, foco);
    MARCA[k] = cat.dataset.cat;
    guardar(k);
    siguiente();
  });

  /* ------------------------------------------------------------ arranque */
  function decir(t, s) {
    $('barra').hidden = true;
    $('pantalla').innerHTML = `<div class="menu"><h1>${esc(t)}</h1>
      <p class="sub">${esc(s)}</p></div>`;
  }

  async function unJuego(l) {
    try {
      const r = await fetch('/api/tandas?d=' + encodeURIComponent(CODIGO) +
        '&juego=' + encodeURIComponent(l), { cache: 'no-store' });
      if (!r.ok) return null;
      const j = await r.json();
      if (!j || !j.hay || !j.datos || !(j.datos.tandas || []).length) return null;
      j.datos.generado = j.datos.generado || j.generado || '';
      j.datos.juego = j.juego || l;
      return j.datos;
    } catch (e) { return null; }
  }

  async function bajarTandas() {
    for (const l of llavesAProbar()) {
      const d = await unJuego(l);
      if (d) { JUEGO = d.juego || l; return d; }
    }
    return null;
  }

  async function arrancar() {
    if (!CODIGO) { decir('Falta el código', 'Este enlace no lleva el código de lectura. Pide el bueno.'); return; }
    decir('Un momento', 'Bajando la recogida.');
    const d = await bajarTandas();
    if (!d) {
      decir('Todavía no hay nada',
        'No hay ninguna recogida preparada para esta fecha. En cuanto se pase el paso 2 aparece aquí sola.');
      setTimeout(arrancar, 20000);
      return;
    }
    DATOS = d; GENERADO = d.generado || '';
    /* Si hubo dos directos en la misma cuenta, esto parte los percheros antes
       de montar las tarjetas. Tarda unos segundos y puede fallar sin romper
       nada: si falla, las prendas salen todas juntas como siempre. */
    try { await separarDirectos(); } catch (e) {}
    TANDAS = construir(d);
    prepararTandas();
    CLAVE = 'billys_marcado_' + JUEGO;
    try { MARCA = JSON.parse(localStorage.getItem(CLAVE) || '{}') || {}; } catch (e) { MARCA = {}; }
    /* La bolsa guardada en el móvil es de otro juego: no vale. */
    if (PAQ && PAQ.juego && PAQ.juego !== JUEGO) {
      PAQ = null; try { localStorage.removeItem('billys_paq'); } catch (e) {}
    }
    casa();
    await leerMarcas(PRIMERA);
    PRIMERA = false;
    if (DONDE === 'menu') menu();
    vaciarCola();

    /* Cada medio minuto se mira lo que han marcado los demás. No se recarga la
       pantalla de nadie a medio paquete: unir() solo repinta si algo cambió. */
    setInterval(() => { if (!document.hidden) leerMarcas(false); }, 30000);
  }

  arrancar();
})();
</script>
