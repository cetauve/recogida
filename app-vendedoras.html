<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0E1723">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- Le dice al puente de la extension que esta pagina quiere los datos del
     directo. Sin esta etiqueta, pantalla-web.js se retira y no manda nada.
     En un movil sin la extension no cambia nada: nadie contesta. -->
<meta name="billys-datos" content="1">
<title>Registro de prendas</title>

<!--
  ===========================================================================
  REGISTRO DE PRENDAS DEL DIRECTO  ·  app de la vendedora
  ===========================================================================

  QUE HACE
    La vendedora pone su nombre y, cada vez que se vende una prenda, pulsa el
    boton de la categoria. Se guarda QUE categoria y a QUE HORA, con el nombre
    de quien lo pulso. Nada mas. Un toque.

  POR QUE ASI
    El toque se da DESPUES de que la prenda se haya vendido (decision de Aaron,
    7 ago 2026). Por eso el cruce en cruce.html busca el ULTIMO lote cerrado
    antes del toque. Si algun dia se cambia y se pulsa al ENSENARLA, hay que
    cambiar el criterio alli, no aqui.

  DONDE SE GUARDA
    En el propio movil, despues de CADA toque. Aguanta que se cierre el
    navegador, que se bloquee la pantalla o que se caiga el WiFi. Nada se
    pierde por no tener cobertura.

    GitHub Pages solo sirve archivos: no recibe ni guarda datos. Por eso los
    datos salen del movil al pulsar "Terminar", en forma de enlace que se manda
    por WhatsApp. En el PC se abre ese enlace con cruce.html y ahi es donde se
    cruza con los lotes del directo.


  NADA DE ESTO ESTA ATADO A UNA TIENDA CONCRETA: categorias, precios, textos y
  marca salen del bloque CONFIG de aqui abajo.
  ===========================================================================
-->

<style>
  :root{
    --fondo:#0E1723; --tinta:#EDE7DB; --acento:#C8321F;
    --verde:#2E9E6B; --carta:#16212F; --borde:#243244; --tenue:#8A99AB;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--fondo);color:var(--tinta);
    font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;
  }
  .pantalla{display:none;flex-direction:column;min-height:100dvh;padding:18px 16px}
  .pantalla.on{display:flex}

  h1{font-size:22px;margin:0 0 4px;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--tenue);font-size:14px;margin:0 0 20px}

  input[type=text],input[type=number]{
    width:100%;padding:16px;font-size:19px;border-radius:14px;
    border:2px solid var(--borde);background:var(--carta);color:var(--tinta);
  }
  input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--acento)}

  button{font-family:inherit;color:inherit;border:0;cursor:pointer}
  .primario{
    width:100%;padding:17px;font-size:18px;font-weight:800;border-radius:14px;
    background:var(--acento);color:#fff;
  }
  .primario:disabled{opacity:.35}
  .secundario{
    padding:13px 16px;font-size:15px;font-weight:600;border-radius:12px;
    background:transparent;border:1.5px solid var(--borde);color:var(--tinta);
  }

  .recientes{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 24px}
  .recientes button{
    padding:10px 15px;border-radius:999px;background:var(--carta);
    border:1.5px solid var(--borde);font-size:15px;font-weight:600;
  }

  /* --- pantalla de trabajo --- */
  .barra{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .quien{font-weight:800;font-size:18px;line-height:1.1}
  .quien small{display:block;font-weight:500;font-size:13px;color:var(--tenue);margin-top:2px}
  .marcador{text-align:right;line-height:1}
  .marcador b{font-size:34px;font-weight:800;font-variant-numeric:tabular-nums}
  .marcador span{display:block;font-size:12px;color:var(--tenue);margin-top:3px}

  /* Los botones se estiran hasta llenar la pantalla. La vendedora esta de pie,
     con una prenda en la otra mano y mirando a camara: cuanto mas grande sea el
     area de toque, menos veces tiene que mirar el movil. */
  .rejilla{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;
           grid-auto-rows:1fr;align-content:stretch}
  /* Si el numero de categorias es impar, la ultima ocupa las dos columnas en
     vez de dejar un hueco muerto. */
  .cat:last-child:nth-child(odd){grid-column:span 2}
  .cat{
    position:relative;min-height:76px;border-radius:16px;background:var(--carta);
    border:1.5px solid var(--borde);padding:12px 12px 10px;text-align:left;
    display:flex;flex-direction:column;justify-content:space-between;
    font-size:17px;font-weight:700;line-height:1.15;transition:transform .06s,background .15s;
  }
  .cat:active{transform:scale(.96)}
  .cat.pulsada{background:var(--verde);border-color:var(--verde);color:#fff}
  .cat .n{font-size:13px;font-weight:700;color:var(--tenue);font-variant-numeric:tabular-nums}
  .cat.pulsada .n{color:rgba(255,255,255,.85)}

  .pie{margin-top:14px;display:flex;gap:10px}
  .pie .secundario{flex:1}

  #conDirecto{font-size:12px;text-align:center;margin-top:6px;min-height:15px;
 letter-spacing:.03em;color:rgba(237,231,219,.35)}
#conDirecto.conectado{color:#2E9E6B;font-weight:700}
#estadoEnvio{font-size:12px;text-align:center;min-height:15px;
 letter-spacing:.03em;color:rgba(237,231,219,.35)}
#estadoEnvio.ok{color:#2E9E6B;font-weight:700}
#ultimo{
    min-height:22px;text-align:center;font-size:14px;color:var(--verde);
    font-weight:700;margin:10px 0 2px
  }

  /* --- resumen --- */
  .tabla{width:100%;border-collapse:collapse;margin:8px 0 18px;font-size:15px}
  .tabla td{padding:9px 0;border-bottom:1px solid var(--borde)}
  .tabla td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
  .tabla tr:last-child td{border-bottom:0}
  .cifras{display:flex;gap:10px;margin:4px 0 18px}
  .cifra{flex:1;background:var(--carta);border:1.5px solid var(--borde);border-radius:14px;padding:13px}
  .cifra b{display:block;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  .cifra span{font-size:12px;color:var(--tenue);display:block;margin-top:5px}
  .aviso{
    background:#2A1512;border:1.5px solid var(--acento);border-radius:12px;
    padding:12px 14px;font-size:14px;margin-bottom:16px
  }
  .botonera{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:16px}

  #versionNueva{position:fixed;left:12px;right:12px;bottom:12px;z-index:99;display:none;
   background:#12241C;border:1.5px solid var(--verde);border-radius:14px;padding:12px 14px;
   align-items:center;gap:12px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
  #versionNueva.on{display:flex}
  #versionNueva button{margin-left:auto;background:var(--verde);color:#fff;border:0;
   border-radius:10px;padding:10px 16px;font:inherit;font-weight:800}
</style>
</head>
<body>

<!-- 1 · QUIEN ERES -->
<section id="pEntrada" class="pantalla on">
  <h1 id="tituloEntrada">Registro de prendas</h1>
  <p class="sub">Pon tu nombre para empezar el turno.</p>
  <input id="nombre" type="text" placeholder="Tu nombre" autocomplete="off"
         autocapitalize="words" enterkeyhint="go">
  <!-- AQUI SE PREGUNTABA "¿por que numero va el directo?".
       Ya no hace falta: cada toque sale sellado con el numero que publica la
       extension desde el panel del directo, en el mismo gesto. Preguntarselo
       de memoria a alguien que esta de pie con una prenda en la mano era pedir
       a mano el dato que ya tenemos mejor. Quitado el 15 ago 2026. -->
  <div class="recientes" id="recientes"></div>
  <div style="margin-top:auto">
    <div id="estadoServidor" class="sub" style="margin-bottom:10px"></div>
    <button id="empezar" class="primario" disabled>Empezar turno</button>
  </div>
</section>

<!-- Se avisa, no se recarga solo: recargar a alguien a media venta le borra
     la pantalla de las manos. -->
<div id="versionNueva">
  <span><b>Hay una versión nueva.</b> Toca para ponerte al día.</span>
  <button id="actualizarYa">Actualizar</button>
</div>

<!-- 2 · TRABAJO -->
<section id="pTrabajo" class="pantalla">
  <div class="barra">
    <div class="quien">
      <span id="quienNombre"></span>
      <small id="quienDesde"></small>
    </div>
    <div class="marcador">
      <b id="total">0</b>
      <span>prendas</span>
    </div>
  </div>
  <div class="rejilla" id="rejilla"></div>
  <div id="ultimo"></div>
  <!-- Se enseña SOLO si la tablet tiene la extensión y el panel abierto. En un
       móvil suelto queda vacío y no ocupa nada: no hay que explicar una
       ausencia, pero sí conviene ver la presencia. -->
  <div id="conDirecto"></div>
  <div id="estadoEnvio"></div>
  <div class="pie">
    <button id="deshacer" class="secundario" disabled>Deshacer</button>
    <button id="terminar" class="secundario">Terminar</button>
  </div>
</section>

<!-- LA PANTALLA DE CIERRE YA NO EXISTE.
     Preguntaba el numero de lote final, que es el mismo dato que se quito al
     entrar. Sin esa pregunta, la pantalla se quedaba en un paso de mas entre
     "Terminar" y el resumen. Ahora Terminar cierra y ya. -->

<!-- 4 · RESUMEN Y ENVIO -->
<section id="pFin" class="pantalla">
  <h1>Turno terminado</h1>
  <p class="sub" id="finQuien"></p>
  <div class="cifras">
    <div class="cifra"><b id="finTotal">0</b><span>prendas</span></div>
    <div class="cifra"><b id="finHoras">0</b><span>horas</span></div>
    <div class="cifra"><b id="finRitmo">0</b><span>por hora</span></div>
  </div>
  <table class="tabla"><tbody id="finDetalle"></tbody></table>
  <!-- Este aviso decia "esto todavia no ha salido del movil" SIEMPRE, aunque
       el turno ya estuviera guardado, y solo se corregia si la red contestaba
       rapido. Ahora dice lo que de verdad ha pasado. -->
  <div class="aviso" id="finAviso">Guardando el turno…</div>
  <div class="botonera">
    <button id="otro" class="primario">Empezar otro turno</button>
    <!-- El rescate de toda la vida, en pequeño: si el servidor estuvo caido el
         turno entero, esto es lo unico que queda. -->
    <button id="descargar" class="secundario"
            style="opacity:.5;font-size:14px;padding:12px">Guardar archivo (solo si falla el servidor)</button>
  </div>
</section>

<script>
(() => {
'use strict';

/* =========================================================================
   CONFIGURACION  ·  lo unico que se toca al cambiar de tienda o de precios
   ========================================================================= */
/* LOS PRECIOS NO ESTAN AQUI, Y ES A PROPOSITO.
   Esta pantalla no calcula dinero: solo apunta qué tipo de prenda es cada
   venta. Los €/kilo, el IVA y la hora de presentadora vivían aquí copiados y
   no se leían en ninguna línea: eran una segunda tabla de precios esperando a
   quedarse vieja. El único sitio donde están es costes-prendas.json. */
const CONFIG = {
  marca: 'Registro de prendas',
  categorias: [
    { id:'camisetas_a', nombre:'Camisetas A'    },
    { id:'camisetas_b', nombre:'Camisetas B'    },
    { id:'sudaderas_a', nombre:'Sudaderas A'    },
    { id:'sudaderas_b', nombre:'Sudaderas B'    },
    { id:'polos_a',     nombre:'Polos A'        },
    { id:'polos_b',     nombre:'Polos B'        },
    { id:'shorts',      nombre:'Shorts deporte' },
    { id:'trackjacket', nombre:'Track jacket'   },
    { id:'trackpants',  nombre:'Trackpants'     },
    { id:'chaquetas',   nombre:'Chaquetas'      }
  ]
};

const LLAVE_SESION     = 'billys_vend_sesion';
const LLAVE_NOMBRES    = 'billys_vend_nombres';
const ANTIRREBOTE_MS   = 350;   // dos toques mas juntos que esto = uno solo

/* =========================================================================
   UTILIDADES
   ========================================================================= */
const $ = (id) => document.getElementById(id);
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
const leer = (k, x) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : x; } catch (_) { return x; } };
const borrar = (k) => { try { localStorage.removeItem(k); } catch (_) {} };

const hhmm = (ts) => {
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};
const nombreCat = (id) => (CONFIG.categorias.find((c) => c.id === id) || {}).nombre || id;

function pantalla(cual) {
  for (const s of document.querySelectorAll('.pantalla')) s.classList.remove('on');
  $(cual).classList.add('on');
  window.scrollTo(0, 0);
}

/* =========================================================================
   EL SERVIDOR
   =========================================================================
   La vendedora abre SIEMPRE el mismo enlace y no vuelve a tocarlo:

       /vendedoras?d=CODIGO

   Sin el código la app funciona exactamente como antes: todo se guarda en el
   móvil y sale por WhatsApp al terminar. Con el código, además, los toques y
   el turno viajan solos al servidor.

   SE MANDA TODO CADA VEZ, no solo lo nuevo. La clave en el servidor es
   (día, vendedora, hora exacta), así que repetir un envío no duplica nada y
   sí arregla el anterior si se perdió por falta de cobertura. Es más simple
   que llevar una cola de pendientes y falla de menos maneras.
   ========================================================================= */
const CODIGO = new URLSearchParams(location.search).get('d') || '';
let mandando = false, otraVez = false, ultimoOk = 0;

async function subir(cual) {
  const ses = cual || sesion;
  if (!CODIGO || !ses) return false;
  if (mandando) { otraVez = true; return false; }   // ya hay uno en vuelo
  mandando = true;
  try {
    const r = await fetch('/api/toques?d=' + encodeURIComponent(CODIGO), {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        vendedora: ses.vendedora,
        /* El turno empieza cuando puso el nombre y entró a la rejilla, no en
           su primer toque: si se contara desde el primer toque, las horas de
           quien menos vende saldrían más cortas y su €/hora inflado. */
        /* Los números de ficha de entrada y salida se preguntaban aquí y ya
           no: cada toque lleva el suyo sellado. El servidor sigue aceptando
           esos dos campos por si un día vuelven, pero la tablet no los manda. */
        turno: {
          empezo: new Date(ses.inicio).toISOString(),
          acabo: ses.fin ? new Date(ses.fin).toISOString() : null
        },
        /* Las horas de los toques deshechos, para que el servidor los borre. */
        quitar: ses.quitados || [],
        toques: ses.toques.map((t) => ({
          en: new Date(t.t).toISOString(),
          categoria: t.c,
          lote: t.lote == null ? null : t.lote,
          sesion: t.sesionDirecto || ''
        }))
      })
    });
    const j = await r.json().catch(() => null);
    const bien = r.ok && j && j.ok;
    if (bien) ultimoOk = Date.now();
    pintarEnvio(bien);
    return bien;
  } catch (_) {
    pintarEnvio(false);
    return false;
  } finally {
    mandando = false;
    if (otraVez) { otraVez = false; subir(ses); }
  }
}

/* Un solo renglón, sin alarmismo: si no hay cobertura no pasa nada grave
   —lo de verdad está guardado en el móvil— pero conviene poder verlo. */
function pintarEnvio(bien) {
  const el = $('estadoEnvio');
  if (!el || !CODIGO) return;
  el.textContent = bien ? 'Guardado en el servidor' : 'Sin conexión · se reintenta al siguiente toque';
  el.className = bien ? 'ok' : '';
}

/* Cada pocos toques y cada minuto. No en cada toque: la vendedora pulsa a
   ráfagas y no hace falta una petición por dedo. */
setInterval(() => { if (sesion && CODIGO && Date.now() - ultimoOk > 60000) subir(); }, 20000);

/* =========================================================================
   ESTADO
   ========================================================================= */
let sesion = null;          // { vendedora, inicio, toques:[{c,t}] }
let ultimoToque = 0;
let cronometro = null;

/* =========================================================================
   1 · ENTRADA
   ========================================================================= */
function pintarEntrada() {
  $('tituloEntrada').textContent = CONFIG.marca;

  const nombres = leer(LLAVE_NOMBRES, []);
  $('recientes').innerHTML = '';
  for (const n of nombres.slice(0, 6)) {
    const b = document.createElement('button');
    b.textContent = n;
    b.onclick = () => { $('nombre').value = n; validar(); arrancar(); };
    $('recientes').appendChild(b);
  }

  /* AQUI SALIA "tienes N turnos sin mandar", que era la memoria del WhatsApp.
     Ya no hay nada que mandar a mano. Lo que sí hace falta saber antes de
     empezar es si el servidor está escuchando. */
  mirarServidor();
}

/* ===========================================================================
 * ¿ME ESTÁ OYENDO EL SERVIDOR?
 * ===========================================================================
 * Se puede trabajar un directo entero con el enlace equivocado y que no llegue
 * ni un toque, sin que nadie se entere hasta el día siguiente. Así que se dice
 * antes de empezar, no después del primer toque.
 * ========================================================================= */
async function mirarServidor(){
  const caja = $('estadoServidor');
  if (!caja) return;
  if (!CODIGO) {
    caja.innerHTML = `<div class="aviso" style="border-color:#C8321F">
      <b>A este enlace le falta el código.</b><br>
      Nada de lo que marques va a llegar. Pídele el enlace bueno a Aaron:
      tiene que acabar en <code>?d=</code> y el código.</div>`;
    return;
  }
  caja.textContent = 'Comprobando el servidor…';
  try {
    const r = await fetch('/api/salud', { cache: 'no-store' });
    const j = await r.json();
    caja.innerHTML = (j && j.ok)
      ? '<span style="color:#7BD6AC">● Servidor conectado</span>'
      : '<span style="color:#E7C078">● El servidor contesta raro. Avisa a Aaron.</span>';
  } catch(e){
    caja.innerHTML = '<span style="color:#E7C078">● Sin conexión. Puedes marcar igual: se manda solo al volver.</span>';
  }
}

function validar() { $('empezar').disabled = !$('nombre').value.trim(); }
$('nombre').addEventListener('input', validar);
$('nombre').addEventListener('keydown', (e) => { if (e.key === 'Enter' && $('nombre').value.trim()) arrancar(); });
$('empezar').onclick = arrancar;

function arrancar() {
  const v = $('nombre').value.trim();
  if (!v) return;
  const nombres = leer(LLAVE_NOMBRES, []).filter((n) => n.toLowerCase() !== v.toLowerCase());
  nombres.unshift(v);
  guardar(LLAVE_NOMBRES, nombres.slice(0, 8));

  sesion = { v: 1, vendedora: v, inicio: Date.now(), toques: [] };
  guardar(LLAVE_SESION, sesion);
  /* Se avisa al PC de que empieza el turno. La pantalla en vivo necesita la
     HORA DE ENTRADA para calcular las horas trabajadas: si las sacara del hueco
     entre el primer y el ultimo toque, estaria inflando el €/hora justo de
     quien menos vende. */
  /* El turno se abre en el servidor AQUÍ, no al terminar: así se sabe quién
     está trabajando ahora mismo aunque el móvil se quede sin batería después. */
  subir();
  entrarTrabajo();
}

/* =========================================================================
   2 · TRABAJO
   ========================================================================= */
function entrarTrabajo() {
  $('quienNombre').textContent = sesion.vendedora;
  $('rejilla').innerHTML = '';
  for (const c of CONFIG.categorias) {
    const b = document.createElement('button');
    b.className = 'cat';
    b.dataset.id = c.id;
    b.innerHTML = `<span>${c.nombre}</span><span class="n" data-n="${c.id}">0</span>`;
    b.onclick = () => marcar(c.id, b);
    $('rejilla').appendChild(b);
  }
  pantalla('pTrabajo');
  refrescar();
  clearInterval(cronometro);
  cronometro = setInterval(refrescar, 30000);
}

/* ===========================================================================
 * EL LOTE, LEIDO DEL PANEL, EN EL MOMENTO DEL TOQUE
 *
 * Hasta ahora el toque solo guardaba la hora, y despues cruce.html adivinaba a
 * que lote correspondia. Adivinaba mal: la hora de venta que publica el panel
 * tiene precision de minuto y al arrancar se aplasta, asi que el 10 ago 2026
 * quedaron 24 de 65 prendas sin lote, y el 11, con dos directos a la vez,
 * quedaron TODAS sin cruzar.
 *
 * Pero las chicas trabajan con la tablet, y en esa misma tablet esta abierto el
 * panel de subastas. Si la extension esta puesta ahi, el puente ya publica por
 * que lote va el directo AHORA. Asi que no hay que adivinar nada: se sella el
 * numero de lote en el mismo gesto, igual que se sella la hora.
 *
 * Y como cada tablet mira SU directo, el sessionId viene con el lote: dos
 * directos a la vez dejan de ser un problema, porque cada toque dice de cual es.
 *
 * SI NO HAY EXTENSION no pasa nada: `loteAhora` se queda a null, el toque va
 * como iba y cruce.html sigue con sus metodos de siempre. Un movil suelto
 * funciona exactamente igual que ayer.
 * ======================================================================== */
let loteAhora = null;      // { num, sessionId, visto }

window.addEventListener('message', (e) => {
  if (e.source !== window) return;
  const m = e.data;
  if (!m || m.fuente !== 'billys-pantalla') return;
  const now = m.datos && m.datos.billysNow;
  if (!now) return;
  const num = now.current && Number(now.current.num);
  if (Number.isFinite(num)) {
    loteAhora = { num, sessionId: now.sessionId || null, visto: Date.now() };
  } else if (now.metrics && Number.isFinite(Number(now.metrics.loteActual))) {
    loteAhora = { num: Number(now.metrics.loteActual), sessionId: now.sessionId || null, visto: Date.now() };
  }
  pintarDirecto();
});
window.postMessage({ fuente: 'billys-pantalla-pide' }, '*');

/* El lote solo vale si es reciente. Si el panel se cerro hace un rato, el
 * numero que quedo guardado ya no es el de ahora y pegarselo al toque seria
 * mentir con mas seguridad que antes. Dos minutos. */
const LOTE_FRESCO_MS = 120000;
function loteValido() {
  return loteAhora && (Date.now() - loteAhora.visto) < LOTE_FRESCO_MS ? loteAhora : null;
}

function pintarDirecto() {
  const el = document.getElementById('conDirecto');
  if (!el) return;
  const l = loteValido();
  el.textContent = l ? 'Conectado al directo · va por el #' + l.num : '';
  el.className = l ? 'conectado' : '';
}
setInterval(pintarDirecto, 5000);

function marcar(id, boton) {
  const ahora = Date.now();
  // Dos toques pegados casi siempre son el mismo dedo, no dos prendas.
  if (ahora - ultimoToque < ANTIRREBOTE_MS) return;
  ultimoToque = ahora;

  /* El lote se sella AQUI, en el gesto, igual que la hora. Los dos son datos
     que despues no se pueden reconstruir. */
  const l = loteValido();
  const toque = { c: id, t: ahora };
  if (l) { toque.lote = l.num; toque.sesionDirecto = l.sessionId; }
  sesion.toques.push(toque);
  guardar(LLAVE_SESION, sesion);   // en disco ANTES de pintar nada
  /* Al servidor cada 5 toques. En disco va SIEMPRE, así que perder un envío
     no pierde nada: el siguiente manda el turno entero otra vez. */
  if (sesion.toques.length % 5 === 0) subir();

  if (navigator.vibrate) navigator.vibrate(18);
  boton.classList.add('pulsada');
  setTimeout(() => boton.classList.remove('pulsada'), 220);

  $('ultimo').textContent = `${nombreCat(id)} · ${hhmm(ahora)}`;
  refrescar();
}

$('deshacer').onclick = () => {
  if (!sesion || !sesion.toques.length) return;
  const fuera = sesion.toques.pop();
  /* DESHACER TIENE QUE LLEGAR AL SERVIDOR.
     Antes solo borraba en la tablet: ella veía 40 prendas y el reparto le
     contaba 41, y esa de más se llevaba una venta que no era suya. Ahora se
     apunta para que el siguiente envío la borre también allí. */
  sesion.quitados = (sesion.quitados || []).concat(new Date(fuera.t).toISOString());
  guardar(LLAVE_SESION, sesion);
  $('ultimo').textContent = `Quitado: ${nombreCat(fuera.c)}`;
  refrescar();
  subir();
};

function refrescar() {
  const cuenta = {};
  for (const t of sesion.toques) cuenta[t.c] = (cuenta[t.c] || 0) + 1;
  for (const c of CONFIG.categorias) {
    const el = document.querySelector(`[data-n="${c.id}"]`);
    if (el) el.textContent = cuenta[c.id] || 0;
  }
  $('total').textContent = sesion.toques.length;
  $('deshacer').disabled = !sesion.toques.length;
  const mins = Math.round((Date.now() - sesion.inicio) / 60000);
  $('quienDesde').textContent = mins < 60
    ? `desde las ${hhmm(sesion.inicio)} · ${mins} min`
    : `desde las ${hhmm(sesion.inicio)} · ${Math.floor(mins/60)} h ${mins%60} min`;
}

/* TERMINAR CIERRA Y YA.
   Antes pasaba por una pantalla que preguntaba el número de lote final; ese
   dato ya no se pide (lo sella la extensión en cada toque), así que la
   pantalla se quedaba en un paso de más entre pulsar y acabar. */
$('terminar').onclick = () => {
  if (!sesion) return;
  if (sesion.toques.length && !confirm('¿Terminas el turno?\n\n' + sesion.toques.length +
      ' prendas marcadas. Se guarda en el servidor.')) return;
  sesion.fin = Date.now();

  const cerrado = sesion;
  clearInterval(cronometro);

  /* El envío de cierre lleva el turno entero, con su hora de salida. El aviso
     de la pantalla siguiente dice lo que de verdad ha pasado con él: antes
     decía "esto todavía no ha salido del móvil" aunque ya estuviera guardado. */
  const av = $('finAviso');
  if (av) { av.textContent = 'Guardando el turno…'; av.style.borderColor = ''; av.style.background = ''; }
  subir(cerrado).then((bien) => {
    sesion = null; borrar(LLAVE_SESION);
    if (!av) return;
    if (bien) {
      av.innerHTML = '<b>Turno guardado en el servidor.</b> Ya puedes cerrar.';
      av.style.borderColor = 'var(--verde)'; av.style.background = '#12241C';
    } else {
      av.innerHTML = '<b>No he podido guardarlo todavía.</b> Deja esta pantalla abierta ' +
        'con wifi y se manda solo. Si tienes prisa, usa Guardar archivo.';
      av.style.borderColor = 'var(--ambar)'; av.style.background = '#241C0E';
    }
  });
  if (!CODIGO) { sesion = null; borrar(LLAVE_SESION); }

  mostrarFin([cerrado]);
};

/* =========================================================================
   3 · RESUMEN Y ENVIO
   ========================================================================= */
let paraMandar = [];

function mostrarFin(sesiones) {
  paraMandar = sesiones.filter((s) => s && s.toques && s.toques.length);
  if (!paraMandar.length) { pantalla('pEntrada'); pintarEntrada(); return; }

  const todos = paraMandar.flatMap((s) => s.toques);
  const inicio = Math.min(...paraMandar.map((s) => s.inicio));
  const fin = Math.max(...paraMandar.map((s) => s.fin || Date.now()));
  const horas = Math.max((fin - inicio) / 3600000, 0.01);

  $('finQuien').textContent = paraMandar.map((s) => s.vendedora).join(', ')
    + ` · ${hhmm(inicio)}–${hhmm(fin)}`;
  $('finTotal').textContent = todos.length;
  $('finHoras').textContent = horas.toFixed(1).replace('.', ',');
  $('finRitmo').textContent = Math.round(todos.length / horas);

  const cuenta = {};
  for (const t of todos) cuenta[t.c] = (cuenta[t.c] || 0) + 1;
  $('finDetalle').innerHTML = CONFIG.categorias
    .filter((c) => cuenta[c.id])
    .sort((a, b) => cuenta[b.id] - cuenta[a.id])
    .map((c) => `<tr><td>${c.nombre}</td><td>${cuenta[c.id]}</td></tr>`).join('');

  pantalla('pFin');
}

/* AQUI VIVIAN "Mandar por WhatsApp" y "Copiar enlace": metian el turno entero
   comprimido dentro de una direccion para pegarla en cruce.html. Era como
   viajaban los datos cuando no habia servidor. Hoy el turno ya esta guardado
   antes de que esta pantalla aparezca. Quitados el 15 ago 2026. */

$('descargar').onclick = () => {
  const blob = new Blob([JSON.stringify({ v: 1, sesiones: paraMandar }, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date(paraMandar[0].inicio);
  a.download = `prendas-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.json`;
  a.click();
};

$('otro').onclick = () => { pantalla('pEntrada'); $('nombre').value = ''; validar(); pintarEntrada(); };



/* =========================================================================
   AVISO DE VERSION NUEVA
   =========================================================================
   Un movil con la pestaña abierta no se entera de que hay version nueva. El
   14 ago 2026 el almacen estuvo una tarde con la app de antes por esto. Se
   compara el sello del archivo con el que habia al abrir, y se avisa. Nunca
   se recarga solo: a media venta le borrarias la pantalla de las manos.
   ========================================================================= */
let selloVersion = null;
async function mirarVersion() {
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { method: 'HEAD', cache: 'no-store' });
    const sello = r.headers.get('etag') || r.headers.get('last-modified');
    if (!sello) return;
    if (selloVersion === null) { selloVersion = sello; return; }
    if (sello !== selloVersion) $('versionNueva').classList.add('on');
  } catch (_) { /* sin red, otra vez sera */ }
}
$('actualizarYa').onclick = () => location.reload();
mirarVersion();
setInterval(mirarVersion, 90000);

/* =========================================================================
   ARRANQUE  ·  si habia un turno a medias, se retoma donde estaba
   ========================================================================= */
const aMedias = leer(LLAVE_SESION, null);
if (aMedias && aMedias.toques) {
  sesion = aMedias;
  entrarTrabajo();
} else {
  pintarEntrada();
}

// Que no se pierda nada si el movil mata la pestana de repente.
document.addEventListener('visibilitychange', () => {
  if (document.hidden && sesion) guardar(LLAVE_SESION, sesion);
});
})();
</script>
