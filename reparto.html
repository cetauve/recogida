<!--
  ===========================================================================
  QUÉ VENDIÓ CADA VENDEDORA  ·  /reparto?d=CODIGO
  ===========================================================================

  Junta las dos mitades que hasta ahora había que cuadrar a mano:

     lo que leyó la extensión  →  cada prenda vendida, con su hora real
     lo que marcaron ellas     →  cada toque, con su hora

  Ninguna de las dos partes sabe de la otra. El cruce lo hace el servidor AL
  LEER, nunca al guardar: si un día sale torcido se vuelve a mirar y ya está,
  porque los dos lados siguen guardados en crudo. Sellar el reparto sería
  irreversible, y además dejaría sin prenda cualquier toque dado sin cobertura.

  POR ESO ESTA PÁGINA NO GUARDA NADA. Solo pregunta y enseña.

  LO QUE NADIE MARCÓ NO SE REPARTE, y no es una limitación: el toque existe
  para saber QUÉ TIPO DE PRENDA era —la categoría no está en ningún otro
  sitio— y sin categoría no hay coste ni margen. Una prenda sin marcar no
  sirve de nada aunque supiéramos de quién es. Además, si esto se rellenara
  solo, marcar dejaría de dar incentivo y se acabaría el dato.

  Por eso la cifra que manda es el % MARCADO, y va arriba del todo.

  Esta página NO sustituye a cruce.html: aquella sigue siendo la de pegar
  archivos y CSV a mano, que es el último recurso cuando no hay servidor.
  ===========================================================================
-->

<body>

<h1>Reparto de prendas</h1>
<p class="sub" id="sub">Qué categoría tiene cada prenda vendida, según lo que marcaron.</p>

<div class="fila">
  <input type="date" id="dia">
  <button id="ver">Ver</button>
  <button id="csv" class="sec">Descargar hoja de cálculo</button>
</div>

<!-- UNA PESTAÑA POR CUENTA.
     Billy's emite desde dos cuentas a la vez y mezclarlas en una sola página
     hacía dos daños: no había forma de comprobar que en billysvlc estaba SOLO
     lo de billysvlc, y los totales invitaban a comparar cosas que no se pueden
     comparar, porque de la cuenta del tour no se sabe nada hasta que se leen sus
     pedidos. Cada pestaña se pide al servidor por separado, así que lo que se
     ve es lo de esa cuenta y nada más. -->
<div id="pestanas"></div>

<div id="salida"><div class="cargando">Cargando…</div></div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

/* Sin el código no se devuelve nada: es lo único que separa los datos del
   negocio de cualquiera que teclee la dirección. */
const CODIGO = new URLSearchParams(location.search).get('d') || '';

const hhmm = (t) => {
  if (!t) return '';
  const d = new Date(t);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};
const eur = (n) => (Math.round(Number(n || 0) * 100) / 100).toFixed(2).replace('.', ',') + ' €';
/* "1 prendas" canta mucho en una página que se enseña a la gente. */
const pl = (n, uno, varios) => n + ' ' + (n === 1 ? uno : varios);

/* Cómo se ha decidido que una prenda es de alguien. El orden importa: de más
   seguro a menos, y la página lo dice con todas las letras. */
const VIAS = {
  lote: { et:'lote', txt:'número leído' },
  hora: { et:'hora', txt:'por la hora' }
};

let ULTIMO = null;
let PRENDAS = [];          // las prendas del día en crudo, para el desglose por cuenta
/* LO QUE DICE LA CONSOLA DE TIKTOK: { gmv, items, cuando }.
   Lo manda el puente del directo con cada latido. No es lo mismo que lo nuestro
   —su GMV suma los portes— y por eso se enseñan los dos: el 17 ago 2026 la
   consola decía 1493,06 € y esta página 1353 €, y con un solo número delante eso
   parece un fallo en vez de dos formas de contar. */
let PANEL = null;
let TIPOS = null;          // el análisis por categoría ya hecho, para reordenarlo sin recargar
let ORDEN = 'margen';      // por qué columna se ordena la tabla de tipos

/* =========================================================================
   EL DINERO
   =========================================================================
   Los costes salen de costes-prendas.json, que es donde Aaron los mantiene.
   NO se copian aquí: si se copiaran, el día que cambie un precio habría un
   sitio más que actualizar y este sería el que se olvidaría.

       costePieza = (euroKilo / piezasKilo + transporte) × (1 + IVA)

   Se recalcula con la fórmula en vez de usar el `costeConIva` guardado, para
   que no puedan separarse nunca.

   CON IVA EN LOS DOS LADOS. El precio de venta de TikTok ya lo lleva, así que
   el coste también. Decisión de Aaron, 7 ago 2026. El margen real del negocio
   es el de sin IVA —el soportado se deduce— pero eso es mirar otra columna,
   no rehacer nada.

   La hora de presentadora NO lleva IVA: un salario no lo lleva.
   ========================================================================= */
let COSTES = null;
async function cargarCostes() {
  if (COSTES) return COSTES;
  try {
    const c = await (await fetch('/costes-prendas.json', { cache: 'no-store' })).json();
    const porId = {};
    for (const x of c.categorias || []) {
      porId[x.id] = {
        nombre: x.nombre,
        coste: (x.euroKilo / x.piezasKilo + (c.transportePorPieza || 0)) * (1 + (c.iva || 0))
      };
    }
    COSTES = { porId, hora: c.horaPresentadora || 0, actualizado: c.actualizado };
  } catch (e) { COSTES = { porId: {}, hora: 0, error: e.message }; }
  return COSTES;
}

/* Lo que cuesta una prenda de esa categoría. null si la categoría no está en
   la tabla —pasa con lo marcado antes de la división A/B de agosto— y en ese
   caso NO se inventa un coste: se cuenta aparte y se dice. */
const costeDe = (cat) => {
  const c = COSTES && COSTES.porId[cat];
  return c ? c.coste : null;
};
const horasDe = (t) => (t && t.empezo && t.acabo)
  ? Math.max((new Date(t.acabo) - new Date(t.empezo)) / 3600000, 0.01) : null;

/* HASTA CUÁNDO CUENTA UN TURNO.
   Si ella pulsó Terminar, hasta ahí. Si no la pulsó pero el directo ya se ha
   dado por terminado —veinte minutos sin vender ni una prenda—, hasta el fin
   del directo. Y si el directo sigue vivo, hasta ahora: mientras trabaja, sus
   horas corren, que si no el €/hora de quien está currando sale disparado.

   Antes esto era solo `t.acabo || ahora`, y un turno sin cerrar seguía sumando
   horas toda la noche: a las tres de la mañana la presentadora del directo de
   la tarde llevaba doce horas de coste y beneficio por hora negativo. */
const finTurno = (t, c) => (t && (t.acabo || (c && c.finDirecto))) || null;
/* NADA DE DIVIDIR POR CASI CERO. Un turno de dos minutos —o uno con las horas
   mal, que también pasa— daba "27.735 € por hora" y ese número no significa
   nada. Por debajo de tres minutos no hay €/hora que enseñar: se devuelve null
   y en pantalla sale una raya. */
const horasVivas = (t, c) => {
  if (!t || !t.empezo) return null;
  const h = (new Date(finTurno(t, c) || Date.now()) - new Date(t.empezo)) / 3600000;
  return h >= 0.05 ? h : null;
};

/* =========================================================================
   ANÁLISIS POR TIPO DE PRENDA
   =========================================================================
   La pregunta que hace Aaron es "¿qué tipo de prenda me da dinero y cuál me
   lo quita?". Con el precio de venta de cada prenda y el coste de su
   categoría eso ya se puede contestar sin inventarse nada.

   SOLO ENTRA LO MARCADO. Una prenda sin categoría no tiene coste, y sin
   coste no hay margen: no se reparte por ahí ni se estima. Se cuenta aparte
   y se dice cuántas son.

   Ojo con "pierde dinero": aquí no se reparte el coste de presentadora entre
   categorías. Ese coste es del rato, no de la prenda, y repartirlo por
   unidades haría que una categoría barata pareciera ruinosa solo por ser
   barata. Lo que se ve aquí es el margen de compra-venta de la ropa.
   ========================================================================= */
function nombreCat(id) {
  return (COSTES && COSTES.porId[id] && COSTES.porId[id].nombre) || id || '(sin categoría)';
}

function analizarTipos(c) {
  const m = {};
  const bajoCoste = [];       // prendas vendidas por debajo de lo que costaron
  let unidades = 0, sinTarifa = 0;

  for (const f of c.filas) {
    if (f.lote == null) continue;                       // toque sin prenda: no hay venta
    const id = f.categoria || '(sin categoría)';
    const g = m[id] = m[id] || {
      id, nombre: nombreCat(f.categoria), unidades: 0, venta: 0, coste: 0,
      conTarifa: 0, sinTarifa: 0, bajoCoste: 0, min: null, max: null
    };
    const p = Number(f.precio || 0);
    const cp = costeDe(f.categoria);
    g.unidades++; unidades++;
    g.venta += p;
    g.min = g.min == null ? p : Math.min(g.min, p);
    g.max = g.max == null ? p : Math.max(g.max, p);
    if (cp == null) { g.sinTarifa++; sinTarifa++; }
    else {
      g.coste += cp; g.conTarifa++;
      if (p < cp) { g.bajoCoste++; bajoCoste.push({ ...f, coste: cp, perdida: cp - p }); }
    }
  }

  const lista = Object.values(m).map((g) => {
    const margen = g.venta - g.coste;
    return {
      ...g,
      margen,
      margenUd: g.unidades ? margen / g.unidades : 0,
      precioMedio: g.unidades ? g.venta / g.unidades : 0,
      costeUd: g.conTarifa ? g.coste / g.conTarifa : null,
      /* Cuánto de cada euro vendido se queda. Es lo que compara bien una
         chaqueta de 20 € con una camiseta de 3 €: el margen suelto no. */
      pct: g.venta ? Math.round(margen / g.venta * 100) : 0
    };
  });

  /* UNA CATEGORÍA SIN TARIFA NO ES UNA CATEGORÍA RENTABLE.
     Si no está en costes-prendas.json su coste es desconocido, no cero. Si se
     dejara en el montón la tabla la pintaría al 100 % de margen y sería la
     estrella del día por no saber lo que costó. Va en su propio grupo. */
  const conocidos = lista.filter((g) => g.conTarifa > 0);
  const sinCoste  = lista.filter((g) => g.conTarifa === 0);
  const buenos = conocidos.filter((g) => g.margen > 0);
  const malos  = conocidos.filter((g) => g.margen <= 0);
  const margenBueno = buenos.reduce((a, g) => a + g.margen, 0);

  bajoCoste.sort((a, b) => b.perdida - a.perdida);

  return {
    lista, conocidos, sinCoste, buenos, malos, unidades, sinTarifa, bajoCoste, margenBueno,
    margenTotal: conocidos.reduce((a, g) => a + g.margen, 0),
    ventaTotal: lista.reduce((a, g) => a + g.venta, 0),
    /* Para las barras: la referencia es el que más, no el total. Así la barra
       más larga siempre llena y las demás se comparan con ella. */
    topUnidades: Math.max(1, ...lista.map((g) => g.unidades)),
    topMargen: Math.max(0.01, ...lista.map((g) => Math.abs(g.margen)))
  };
}

const ORDENES = {
  margen:   { txt: 'Lo que más deja',      f: (a, b) => b.margen - a.margen },
  ud:       { txt: 'Margen por prenda',    f: (a, b) => b.margenUd - a.margenUd },
  pct:      { txt: '% que se queda',       f: (a, b) => b.pct - a.pct },
  unidades: { txt: 'Más vendidas',         f: (a, b) => b.unidades - a.unidades },
  precio:   { txt: 'Precio medio',         f: (a, b) => b.precioMedio - a.precioMedio }
};

function filaTipo(g, t) {
  const anchoU = Math.round(g.unidades / t.topUnidades * 100);
  const anchoM = Math.round(Math.abs(g.margen) / t.topMargen * 100);
  /* Sin tarifa no se enseña margen: enseñar "100 %" porque el coste está a
     cero sería mentir con la cara muy seria. */
  const mudo = g.conTarifa === 0;
  return `<tr>
    <td>${esc(g.nombre)}${(g.sinTarifa && !mudo) ? ` <span class="et no">${g.sinTarifa} sin tarifa</span>` : ''}</td>
    <td class="n">${g.unidades}
      <span class="barra" style="display:inline-block;width:52px;vertical-align:middle">
        <i class="neutro" style="width:${anchoU}%"></i></span></td>
    <td class="n">${eur(g.precioMedio)}</td>
    <td class="n">${g.costeUd == null ? '—' : eur(g.costeUd)}</td>
    <td class="n ${g.margenUd < 0 ? 'neg' : ''}">${mudo ? '—' : eur(g.margenUd)}</td>
    <td class="n ${g.pct < 0 ? 'neg' : ''}">${mudo ? '—' : g.pct + '%'}</td>
    <td class="n ${mudo ? '' : (g.margen < 0 ? 'neg' : 'bien')}">${mudo ? '—' : eur(g.margen) +
      `<span class="barra" style="display:inline-block;width:52px;vertical-align:middle">
        <i class="${g.margen < 0 ? 'malo' : ''}" style="width:${anchoM}%"></i></span>`}</td>
  </tr>`;
}

const CABECERA_TIPOS = `<thead><tr>
  <th>Tipo de prenda</th><th>Vendidas</th><th>Precio medio</th><th>Coste ud.</th>
  <th>Margen ud.</th><th>% del precio</th><th>Margen total</th></tr></thead>`;

/* Solo la tabla: se vuelve a pintar sola cuando se cambia el orden, sin
   recargar la página ni cerrar el desplegable. */
function pintarTipos() {
  const caja = $('tablaTipos');
  if (!caja || !TIPOS) return;
  const t = TIPOS;
  const orden = (ORDENES[ORDEN] || ORDENES.margen).f;
  const buenos = t.buenos.slice().sort(orden);
  const malos = t.malos.slice().sort(orden);

  let h = '';
  if (malos.length) {
    h += `<div class="gr mal">Pierden dinero · ${pl(malos.length, 'tipo', 'tipos')}</div>
      <table>${CABECERA_TIPOS}<tbody>${malos.map((g) => filaTipo(g, t)).join('')}</tbody></table>`;
  }
  if (buenos.length) {
    h += `<div class="gr bien">Dan dinero · ${pl(buenos.length, 'tipo', 'tipos')}</div>
      <table>${CABECERA_TIPOS}<tbody>${buenos.map((g) => filaTipo(g, t)).join('')}</tbody></table>`;
  }
  if (t.sinCoste.length) {
    h += `<div class="gr">Sin tarifa · ${pl(t.sinCoste.length, 'tipo', 'tipos')}</div>
      <table>${CABECERA_TIPOS}<tbody>${t.sinCoste.slice().sort(orden).map((g) => filaTipo(g, t)).join('')}</tbody></table>
      <p class="nota" style="margin:8px 0 0">Estos no están en la tabla de costes, así que no se
        sabe lo que costaron. <b>No se cuentan como beneficio</b>: aparecen aparte para que se
        vean, no para sumarlos.</p>`;
  }
  if (!h) h = '<p class="nota">Todavía no hay prendas marcadas con categoría este día.</p>';
  caja.innerHTML = h;
}

function bloqueTipos(t) {
  if (!t.lista.length) return '';
  const masVendido = t.lista.slice().sort((a, b) => b.unidades - a.unidades)[0];
  const masDeja = t.conocidos.slice().sort((a, b) => b.margen - a.margen)[0];
  const peor = t.conocidos.slice().sort((a, b) => a.margen - b.margen)[0];

  /* El resumen en una frase: quien abra esto y no quiera leer tablas ya se
     lleva lo importante en dos líneas. */
  let resumen = `De los <b>${t.conocidos.length}</b> tipos de prenda marcados hoy,
    <b>${t.buenos.length}</b> dejan dinero y <b class="${t.malos.length ? 'neg' : ''}">${t.malos.length}</b> no.`;
  if (masDeja) {
    resumen += ` El que más aporta es <b>${esc(masDeja.nombre)}</b> con ${eur(masDeja.margen)}${
      t.margenBueno > 0 ? ` (${Math.round(masDeja.margen / t.margenBueno * 100)}% de lo que se gana)` : ''}.`;
  }
  resumen += ` El más vendido es <b>${esc(masVendido.nombre)}</b>, ${pl(masVendido.unidades, 'prenda', 'prendas')}
    (${Math.round(masVendido.unidades / t.unidades * 100)}% de lo marcado).`;
  if (peor && peor.margen < 0) {
    resumen += ` El que más resta es <b class="neg">${esc(peor.nombre)}</b>: ${eur(peor.margen)}
      en ${pl(peor.unidades, 'prenda', 'prendas')}.`;
  }

  let h = `<details class="mas"><summary>Analizar por tipo de prenda</summary>
    <p class="nota" style="margin-top:4px">${resumen}</p>

    <div class="chips" id="ordenTipos">
      ${Object.entries(ORDENES).map(([k, v]) =>
        `<button class="chip${k === ORDEN ? ' on' : ''}" data-orden="${k}">${v.txt}</button>`).join('')}
    </div>
    <div id="tablaTipos"></div>
    <p class="nota" style="margin-top:12px">
      <b>Margen ud.</b> es lo que deja una prenda de ese tipo de media: precio de venta
      menos lo que costó comprarla. <b>% del precio</b> es cuánto de cada euro vendido
      se queda, y es lo que compara bien una chaqueta de 20 € con una camiseta de 3 €.<br>
      ${t.sinTarifa ? `<br><b>${pl(t.sinTarifa, 'prenda', 'prendas')}</b> ${t.sinTarifa === 1 ? 'lleva' : 'llevan'}
        una categoría que no está en la tabla de costes: ${t.sinTarifa === 1 ? 'suma' : 'suman'} venta pero no coste.` : ''}
    </p>`;

  /* PRENDAS VENDIDAS POR DEBAJO DE COSTE.
     Una categoría puede salir en verde y aun así llevar dentro diez prendas
     rematadas a 1 €. Esto las saca a la luz una a una. */
  if (t.bajoCoste.length) {
    const ver = t.bajoCoste.slice(0, 15);
    const perdido = t.bajoCoste.reduce((a, f) => a + f.perdida, 0);
    h += `<h3>Vendidas por debajo de lo que costaron</h3>
      <p class="nota"><b>${pl(t.bajoCoste.length, 'prenda salió', 'prendas salieron')}</b> por menos de su coste.
        Entre todas se dejaron <b class="neg">${eur(perdido)}</b>. No es un error del sistema:
        es el precio al que se remataron.</p>
      <table><thead><tr><th>Hora</th><th>Ficha</th><th>Tipo</th><th>Vendedora</th>
        <th>Precio</th><th>Coste</th><th>Diferencia</th></tr></thead><tbody>
        ${ver.map((f) => `<tr>
          <td class="n">${hhmm(f.en)}</td>
          <td class="n">${f.lote == null ? '—' : '#' + f.lote}</td>
          <td>${esc(nombreCat(f.categoria))}</td>
          <td>${esc(f.vendedora)}</td>
          <td class="n">${eur(f.precio)}</td>
          <td class="n">${eur(f.coste)}</td>
          <td class="n neg">−${eur(f.perdida)}</td>
        </tr>`).join('')}
      </tbody></table>
      ${t.bajoCoste.length > ver.length
        ? `<p class="nota" style="margin-top:8px">Y ${t.bajoCoste.length - ver.length} más.
            Están todas en la hoja de cálculo.</p>` : ''}`;
  }

  /* Va aquí y no en el otro desplegable: es análisis por tipo de prenda, solo
     que cruzado con quién la marcó. */
  h += bloqueMix(t.c || {});
  h += '</details>';
  return h;
}

/* =========================================================================
   QUÉ HA TRAÍDO CADA CUENTA
   =========================================================================
   Billy's emite desde dos cuentas y solo una tiene panel de directo:
   billysvlc llega sola y en vivo; billystourvlc no manda nada hasta que se
   lee el Centro de vendedores.

   Sin este bloque, un directo de tour se veía como "no ha vendido nada" o
   como un porcentaje de marcado ridículo, y no había forma de saber si es que
   no se había vendido o es que faltaba la lectura. Aquí se dice cuál es.

   El número que sale como cuenta —1729895654391191721— es el identificador
   interno del producto: es lo que manda el panel en vivo, que no sabe el
   nombre. Aparece cuando esas prendas todavía no tienen su lectura buena.
   ========================================================================= */
/* El identificador interno del producto no le dice nada a nadie: cuando una
   prenda todavía no tiene su lectura buena, en la columna del rack sale eso en
   vez de un número de veinte cifras. */
const soloNumero = (c) => /^\d+$/.test(String(c || ''));
const rotuloCuenta = (c) => soloNumero(c) ? 'sin leer' : (c || '');

/* DE QUÉ CUENTA ES UNA PRENDA.
 *
 * Aquí ponía "Pendiente de leer · leídas en vivo, sin la lectura buena", y eso
 * ya no es verdad y confundía —lo dijo Aaron el 17 ago 2026: "no entiendo lo de
 * sin la lectura buena, no hemos quedado en eso"—. El panel del directo es de
 * UNA cuenta, así que una prenda que llega en vivo sin nombre SÍ se sabe de
 * quién es: de la cuenta con panel. Lo que le falta no es la cuenta, es el
 * nombre de la prenda, y eso no cambia de quién es la venta. */
const cuentaDePrenda = (l, c) => (soloNumero(l && l.cuenta) || !(l && l.cuenta))
  ? ((c && c.cuentaConPanel) || 'la cuenta del panel')
  : String(l.cuenta);

function bloqueCuentas(c) {
  if (!PRENDAS.length) return '';
  const m = {};
  for (const l of PRENDAS) {
    const id = cuentaDePrenda(l, c);
    const g = m[id] = m[id] || { id, prendas: 0, euros: 0, envivo: 0 };
    g.prendas++; g.euros += Number(l.precio || 0);
    if (soloNumero(l.cuenta) || !l.cuenta) g.envivo++;
  }
  const lista = Object.values(m).sort((a, b) => b.prendas - a.prendas);
  if (lista.length < 2 && !lista.some((g) => g.envivo)) return '';

  return `<h2 style="font-size:19px;margin:22px 0 4px">Por cuenta</h2>
    <p class="sub" style="margin-bottom:10px">Solo <b>${esc((c && c.cuentaConPanel) || 'billysvlc')}</b>
      manda sus ventas en vivo. Las de la otra cuenta aparecen cuando se lee el Centro de
      vendedores, con el botón de su cuenta en el panel de la extensión.</p>
    <table><thead><tr><th>Cuenta</th><th>Prendas</th><th>Vendido</th><th></th></tr></thead><tbody>
    ${lista.map((g) => `<tr>
      <td>${esc(g.id)}</td>
      <td class="n">${g.prendas}</td>
      <td class="n">${eur(g.euros)}</td>
      <td>${g.envivo === g.prendas
        ? '<span class="et lote">del panel del directo, en vivo</span>'
        : (g.envivo
          ? `<span class="et lote">${g.prendas - g.envivo} leídas del Centro de vendedores · ${g.envivo} en vivo</span>`
          : '<span class="et lote">leídas del Centro de vendedores</span>')}</td>
    </tr>`).join('')}
    </tbody></table>`;
}

/* Qué tipo de prenda vendió cada una. No es para señalar: sirve para ver si
   una está atascada en lo barato mientras otra saca las chaquetas. */
function bloqueMix(c) {
  if (!c || !Array.isArray(c.filas)) return '';
  const m = {};
  for (const f of c.filas) {
    if (f.lote == null || !f.categoria) continue;
    const g = m[f.vendedora] = m[f.vendedora] ||
      { vendedora: f.vendedora, prendas: 0, venta: 0, coste: 0, conTarifa: 0, ventaConTarifa: 0, cats: {} };
    const cp = costeDe(f.categoria);
    g.prendas++; g.venta += Number(f.precio || 0);
    /* El margen medio solo se hace con lo que tiene tarifa: una prenda sin
       coste conocido saldría con margen entero y le subiría la media a quien
       marcó categorías viejas. */
    if (cp != null) { g.coste += cp; g.conTarifa++; g.ventaConTarifa += Number(f.precio || 0); }
    g.cats[f.categoria] = (g.cats[f.categoria] || 0) + 1;
  }
  const lista = Object.values(m);
  if (!lista.length) return '';
  for (const g of lista) {
    g.margenUd = g.conTarifa ? (g.ventaConTarifa - g.coste) / g.conTarifa : null;
    g.top = Object.entries(g.cats).sort((a, b) => b[1] - a[1]).slice(0, 3);
  }
  lista.sort((a, b) => (b.margenUd == null ? -1e9 : b.margenUd) - (a.margenUd == null ? -1e9 : a.margenUd));
  return `<h3>Qué vende cada una</h3>
    <p class="nota">De lo que marcaron. Sirve para ver si a alguien le tocan siempre
      las prendas baratas, no para premiar ni castigar.</p>
    <table><thead><tr><th>Vendedora</th><th>Marcadas</th><th>Precio medio</th>
      <th>Margen por prenda</th><th>Lo que más marcó</th></tr></thead><tbody>
      ${lista.map((g) => `<tr>
        <td>${esc(g.vendedora)}</td>
        <td class="n">${g.prendas}</td>
        <td class="n">${eur(g.venta / g.prendas)}</td>
        <td class="n ${g.margenUd < 0 ? 'neg' : ''}">${g.margenUd == null ? '—' : eur(g.margenUd)}</td>
        <td>${g.top.map(([id, n]) => `<span class="et no">${esc(nombreCat(id))} ${n}</span>`).join(' ')}</td>
      </tr>`).join('')}
    </tbody></table>`;
}

/* ===========================================================================
   LAS PESTAÑAS DE CUENTA
   ===========================================================================
   La cuenta elegida viaja al servidor y él filtra TODO: turnos, prendas, dinero,
   horas y tipos. Así la pestaña de billysvlc no puede tener nada que no sea de
   billysvlc, y no hay que acordarse de filtrar en cada bloque de la página.

   Se recuerda la elegida en este navegador: quien mira siempre billysvlc no
   tiene que volver a pulsar cada mañana.
   ======================================================================== */
let CUENTA = null;
try { CUENTA = localStorage.getItem('billys_reparto_cuenta') || null; } catch (e) {}

function pintarPestanas(c) {
  const caja = $('pestanas');
  const cuentas = (c && c.cuentas) || [];
  /* Con una sola cuenta no se pintan: serían una pestaña sola, que no es una
     pestaña, es un adorno. */
  if (cuentas.length < 2) { caja.innerHTML = ''; return; }
  caja.innerHTML = cuentas.map((x) => `<button data-c="${esc(x)}"${
    x === (c.cuenta || cuentas[0]) ? ' class="on"' : ''}>${esc(x)}${
    x === c.cuentaConPanel ? '' : '<span class="cuantas">sin panel</span>'}</button>`).join('');
}

async function cargar() {
  const dia = $('dia').value;
  $('salida').innerHTML = '<div class="cargando">Cargando…</div>';
  if (!CODIGO) {
    $('salida').innerHTML = `<div class="aviso rojo"><b>Falta el código en la dirección.</b><br>
      Esta página se abre con <code>?d=</code> y el código detrás. Pídeselo a quien
      te pasó el enlace del equipo.</div>`;
    return;
  }
  try {
    await cargarCostes();
    const r = await fetch('/api/toques?d=' + encodeURIComponent(CODIGO) +
      '&cruce=1' + (dia ? '&dia=' + dia : '') +
      (CUENTA ? '&cuenta=' + encodeURIComponent(CUENTA) : ''), { cache: 'no-store' });
    const j = await r.json();
    if (!j || !j.ok) throw new Error((j && j.detalle) || 'el servidor no ha contestado bien');
    /* Si no había ninguna elegida, se abre en la que tiene panel: es la que se
       mira durante el directo. */
    const cc = j.cruce || {};
    if (!CUENTA && (cc.cuentas || []).length > 1) {
      CUENTA = cc.cuentaConPanel || cc.cuentas[0];
      return cargar();          // se vuelve a pedir, ya filtrado
    }
    pintarPestanas(cc);
    /* Las prendas en crudo, para poder decir cuántas ha traído cada cuenta.
       Si falla, la página sigue: es información de más, no el plato. */
    try {
      const rp = await fetch('/api/directo?d=' + encodeURIComponent(CODIGO) +
        (dia ? '&dia=' + dia : ''), { cache: 'no-store' });
      const jp = await rp.json();
      PRENDAS = (jp && jp.ok && jp.lotes) ? jp.lotes : [];
      PANEL = (jp && jp.ok && jp.panel) ? jp.panel : null;
    } catch (e) { PRENDAS = []; PANEL = null; }
    ULTIMO = j;
    pintar(j);
  } catch (e) {
    $('salida').innerHTML = `<div class="aviso rojo"><b>No he podido preguntarle al servidor.</b><br>
      ${esc(e.message)}</div>`;
  }
}

function pintar(j) {
  const c = j.cruce || { filas: [], porVendedora: [], lotes: 0, sinMarcar: 0, sinCruzar: 0 };
  $('sub').textContent = j.dia + ' · ' + c.lotes + ' prendas vendidas · ' +
    j.total + ' marcadas por ' + (c.porVendedora.length || 0) + ' vendedoras';

  let html = '';

  /* CUÁNDO ENTRÓ LA ÚLTIMA PRENDA.
   *
   * El 14 ago 2026 el envío en vivo se paró y estuvo horas parado sin que
   * nadie lo supiera: la pantalla del directo iba por la 226 y aquí ponía 88.
   * Un número que no se mueve no se nota; un reloj que dice "hace 40 minutos"
   * sí. Esto es lo que convierte una avería silenciosa en una visible. */
  if (c.ultimaVenta) {
    const min = Math.round((Date.now() - new Date(c.ultimaVenta)) / 60000);
    const hayTurnoAbierto = (j.turnos || []).some((t) => !t.acabo);
    if (!c.finDirecto && hayTurnoAbierto && min >= 15) {
      html += `<div class="aviso rojo">
        <b>La última prenda entró hace ${min} minutos</b> y hay un turno abierto.
        Si el directo sigue vendiendo, es que <b>han dejado de llegar</b>.
        Mira que el PC del almacén siga encendido y con el panel del directo abierto.</div>`;
    }
    /* PASADOS LOS VEINTE MINUTOS ya no se puede saber si el directo terminó o
     * si se paró el envío, así que se deja de gritar y se cuenta lo que se ha
     * dado por hecho. Un aviso rojo que sale todas las noches al acabar deja
     * de leerse, y entonces no sirve el día que la avería es de verdad. */
    /* LOS TURNOS QUE CIERRA EL PROGRAMA SE DICEN AUNQUE EL DIRECTO SIGA.
       19 ago 2026: a Heikelin le salían 46 horas y −396 € de beneficio de turno,
       porque su turno se quedó abierto dos días. Ahora un turno sin cerrar se
       cierra solo en su última prenda a los diez minutos, y eso hay que decirlo
       aquí, no solo cuando el directo se da por terminado. */
    const cs0 = c.cerradosSolos || [];
    if (!c.finDirecto && cs0.length) {
      html += `<div class="aviso ambar">
        Se ${pl(cs0.length, 'ha cerrado solo el turno de', 'han cerrado solos los turnos de')}
        <b>${cs0.map(esc).join(', ')}</b>: llevaban más de diez minutos sin marcar ninguna prenda,
        así que sus horas cuentan hasta su última marca. Si siguen trabajando, con marcar una
        prenda el turno vuelve a correr.</div>`;
    }
    if (c.finDirecto) {
      const cs = c.cerradosSolos || [];
      html += `<div class="aviso ambar">
        <b>Directo dado por terminado a las ${hhmm(c.finDirecto)}.</b>
        Es la hora de la última prenda vendida, y desde entonces han pasado
        ${min} minutos sin ninguna más.
        ${cs.length ? `<br>Se han cerrado a esa hora ${pl(cs.length, 'turno que se quedó', 'turnos que se quedaron')}
            sin cerrar: <b>${cs.map(esc).join(', ')}</b>. Sus horas cuentan hasta las
            ${hhmm(c.finDirecto)}, no hasta ahora.` : ''}
        ${min < 60 ? '' : '<br>Si el directo siguiera en marcha, mira el PC del almacén: querría decir que el panel ha dejado de mandar.'}
        </div>`;
    }
  }


  /* LO PRIMERO ES DECIR SI ESTO SE PUEDE MIRAR O NO.
     Un reparto con la mitad de las prendas sin dueño no es un reparto: es una
     lista que alguien va a dar por buena sin fijarse. Mejor cantarlo arriba. */
  if (!c.lotes) {
    /* NO ES UNA ALARMA. Las prendas suben cuando alguien hace la lectura del
     * paso 2, que se hace al final del directo, al imprimir etiquetas. Durante
     * el directo este día sale a cero y eso es lo normal.
     *
     * Poner aquí "comprueba que la extensión está activa" hizo que el 14 ago
     * 2026 se parara un directo a buscar una avería que no existía. Un aviso
     * que salta cuando no pasa nada acaba ignorándose cuando sí pasa. */
    const conToques = (c.filas || []).length > 0;
    /* LA PESTAÑA DE LA CUENTA SIN PANEL NO ESTÁ VACÍA: está esperando.
       De billystourvlc no se sabe NADA hasta que se leen sus pedidos, así que
       aquí no hay prendas ni las va a haber durante el directo. Decir solo "no
       hay prendas" hacía pensar en una avería; y lo que sí hay —su turno y lo
       que marcó— tiene que verse, que es su trabajo. */
    html += c.sinPanel
      ? `<div class="aviso ambar">
          <b>De ${esc(c.cuenta)} no hay datos de venta hasta que se lean sus pedidos.</b><br>
          Esta cuenta no tiene panel de directo: nadie puede saber cuántas prendas se venden
          mientras pasa. Sus prendas aparecen aquí al leer el Centro de vendedores con el botón
          de su cuenta, en el panel de la extensión.
          ${conToques ? `<br><br>Lo que sí hay es su trabajo: <b>${(c.filas || []).length}</b>
            ${(c.filas || []).length === 1 ? 'marca' : 'marcas'} en su turno, esperando su prenda.` : ''}
        </div>`
      : `<div class="aviso ambar">
          <b>Todavía no hay prendas de este día.</b><br>
          Las prendas del directo suben cuando se hace <b>la lectura del panel</b> (paso 2
          de la extensión), que normalmente es al final, al imprimir las etiquetas.
          Si el directo está en marcha, esto es lo normal: aparecerán al leer.
          ${conToques ? `<br><br>Mientras tanto sí están llegando los toques:
            <b>${(c.filas || []).length}</b> de ${(c.porVendedora || []).length || 'varias'} vendedoras.
            Se cruzarán solos en cuanto suban las prendas.` : ''}
        </div>`;
  } else if (c.sinMarcar) {
    /* LA CIFRA DEL DÍA. Sin categoría no hay coste ni margen, así que una
       prenda sin marcar no entra en el cálculo — da igual de quién fuera.
       Y como el incentivo cuelga de esto, va arriba y en grande. */
    /* EL QUE MANDA ES EL DEL DINERO, no el de unidades: diez camisetas de 1 €
       sin marcar no son lo mismo que dos chaquetas de 30. Antes el grande y en
       rojo era el de unidades y el de euros iba abajo y en pequeño. */
    const pctDinero = c.marcadoEurosPct == null ? c.marcadoPct : c.marcadoEurosPct;
    /* EL DENOMINADOR ES LO QUE HA LLEGADO, Y HAY QUE DECIRLO.
       El 17 ago 2026: "me pone que el 100% del dinero está contado cuando solo
       hay 300 y algo y ya vamos por 400 y pico". Y las dos cosas eran ciertas:
       estaba marcado el 100% de LO QUE HABÍA LLEGADO del panel de esa cuenta, y
       lo que él veía era el total del día con las dos cuentas. Un porcentaje sin
       decir de qué es un porcentaje que engaña. */
    html += `<div class="aviso ${pctDinero < 75 ? 'rojo' : 'ambar'}">
      <b>Marcado el ${pctDinero}% del dinero${c.cuenta ? ' de ' + esc(c.cuenta) : ''}</b> ·
      ${eur(c.eurosMarcados)} de ${eur(c.euros)}.
      <br>En prendas es el ${c.marcadoPct}%: ${c.lotes - c.sinMarcar} de ${c.lotes}.
      Las <b>${c.sinMarcar}</b> que nadie marcó se quedan fuera del cálculo: sin
      categoría no hay coste ni margen. No se reparten ni se rellenan.
      <br><span class="sub">Ese <b>${eur(c.euros)}</b> es <b>lo que se ha pagado por la ropa</b>
      ${c.cuenta ? 'en <b>' + esc(c.cuenta) + '</b>' : ''}: ${c.cuentaConPanel && c.cuenta === c.cuentaConPanel
        ? 'lo que el panel del directo ha mandado hasta ahora'
        : 'lo leído del Centro de vendedores'}.
      <b>No es el GMV de TikTok</b>, que sale más alto porque suma los portes que paga cada
      comprador — el 17 ago 2026 eran 549,12 € de GMV contra 511 € de ropa: 38,12 € de ocho
      envíos, con 111 prendas leídas contra las 109 que TikTok atribuía—. Para el coste y el
      margen el bueno es este: el porte no es tuyo.
      ${c.cuentas && c.cuentas.length > 1 ? 'Y si comparas con el total del día, ahí están las dos cuentas juntas.' : ''}</span></div>`;
  } else {
    html += `<div class="aviso verde"><b>Marcado el 100%.</b> Todas las prendas del día
      llevan categoría y entran en el cálculo.</div>`;
  }

  if (c.sinCruzar) {
    html += `<div class="aviso ambar"><b>${c.sinCruzar} toques sin prenda.</b>
      Alguien pulsó cuando no había ninguna venta cerca. Suele ser un doble toque
      o una prenda que se acabó devolviendo.</div>`;
  }

  /* ----------------------------------------------------------- EL DINERO
   *
   *   beneficio de una prenda = lo que se vendió − lo que costó comprarla
   *   margen neto de un turno = beneficio de sus prendas − horas × 9 €
   *
   * Solo entra lo MARCADO: sin categoría no hay coste, y sin coste no hay
   * beneficio. Lo que nadie marcó se cuenta arriba y se queda fuera. */
  const cuentas = {};
  let sinTarifa = 0;
  for (const f of c.filas) {
    if (f.lote == null) continue;
    const q = cuentas[f.vendedora] = cuentas[f.vendedora] ||
      { prendas: 0, venta: 0, coste: 0, sinTarifa: 0, conTarifa: 0, ventaConTarifa: 0 };
    q.prendas++;
    q.venta += Number(f.precio || 0);
    const cp = costeDe(f.categoria);
    /* EL MARGEN SOLO SE HACE CON LO QUE TIENE TARIFA.
       Antes el beneficio por prenda de la ficha se calculaba con TODAS sus
       prendas —incluidas las de categoría sin precio de compra, que suman
       venta y no suman coste— mientras la tabla de "qué vende cada una" lo
       hacía solo con las que sí lo tienen. Dos números distintos para lo
       mismo, en la misma página. Manda este: sin coste no hay margen. */
    if (cp == null) { q.sinTarifa++; sinTarifa++; }
    else { q.coste += cp; q.conTarifa++; q.ventaConTarifa += Number(f.precio || 0); }
  }

  let tVenta = 0, tCoste = 0, tHoras = 0, tPrendas = 0;
  for (const g of c.porVendedora) {
    const q = cuentas[g.vendedora] || { venta: 0, coste: 0, prendas: 0 };
    const t = (j.turnos || []).find((x) => x.vendedora === g.vendedora);
    tVenta += q.venta; tCoste += q.coste; tPrendas += q.prendas;
    tHoras += horasVivas(t, c) || 0;
  }
  const tPersonal = tHoras * (COSTES ? COSTES.hora : 0);
  const tNeto = tVenta - tCoste - tPersonal;

  if (tPrendas) {
    /* EL DINERO DEL DIRECTO ENTERO, MARCADO O NO.
     *
     * Contar prendas no basta: diez camisetas de 1 € sin marcar no son lo
     * mismo que dos chaquetas de 30. Lo que decide es el dinero, así que el
     * % que manda es el de euros, no el de unidades. */
    /* EL NÚMERO DE LA CONSOLA DE TIKTOK, EL PRIMERO Y EN GRANDE.
     *
     * Aaron, 17 ago 2026: "lo que quiero ver en directo es el total que se está
     * registrando como vendido en directo, que se puede ver en la consola del
     * live". Ese número es el GMV, y ya lo lee el lector del panel: aquí se
     * enseña tal cual, sin mezclarlo con el nuestro. Al lado va lo que se pagó
     * por la ropa, que es lo que sirve para el coste y el margen, y la
     * diferencia —portes y lo que aún no ha entrado— se dice debajo. */
    const gmv = PANEL && PANEL.gmv != null ? Number(PANEL.gmv) : null;
    const frescoPanel = PANEL && PANEL.cuando
      ? Math.round((Date.now() - new Date(PANEL.cuando)) / 60000) : null;
    html += `<div class="totales">
      ${gmv != null ? `<div><b>${eur(gmv)}</b><span>en la consola de TikTok${
        PANEL.items != null ? ' · ' + PANEL.items + ' art.' : ''}</span></div>` : ''}
      <div><b>${eur(c.euros)}</b><span>vendido en el directo</span></div>
      <div><b>${eur(c.eurosMarcados)}</b><span>vendido y marcado</span></div>
      <div><b class="${c.marcadoEurosPct < 75 ? 'neg' : 'bien'}">${c.marcadoEurosPct}%</b><span>del dinero, marcado</span></div>
      <div><b>${eur(tCoste)}</b><span>coste ropa</span></div>
      <div><b>${eur(tPersonal)}</b><span>coste presentadoras</span></div>
      <div><b class="${tNeto < 0 ? 'neg' : 'bien'}">${eur(tNeto)}</b><span>beneficio de lo marcado</span></div>
      <div><b>${eur(tPrendas ? (tVenta - tCoste) / tPrendas : 0)}</b><span>beneficio por prenda</span></div>
      <div><b class="${tNeto < 0 ? 'neg' : ''}">${eur(tHoras ? tNeto / tHoras : 0)}</b><span>beneficio por hora</span></div>
    </div>`;
    /* LA DIFERENCIA ENTRE LOS DOS NÚMEROS, EXPLICADA Y NO ESCONDIDA.
       Con esto se contesta en un vistazo lo que hoy costó media hora: cuánto de
       la diferencia son portes y cuánto son prendas que aún no han entrado. */
    if (gmv != null) {
      const hueco = Math.round((gmv - c.euros) * 100) / 100;
      const faltanArt = PANEL.items != null ? PANEL.items - c.lotes : null;
      html += `<div class="aviso ${Math.abs(hueco) > 0 && faltanArt > 5 ? 'ambar' : ''}">
        <b>La consola dice ${eur(gmv)} y aquí hay ${eur(c.euros)}: ${eur(Math.abs(hueco))}
        de diferencia.</b> El GMV de TikTok suma <b>los portes</b> que paga cada comprador;
        esto suma solo <b>la ropa</b>, que es lo que cuenta para coste y margen.
        ${faltanArt != null ? (faltanArt > 0
          ? `Y de artículos: la consola lleva <b>${PANEL.items}</b> y aquí hay <b>${c.lotes}</b>,
             así que <b>${faltanArt}</b> ${faltanArt === 1 ? 'está' : 'están'} sin registrar todavía
             —el panel las manda con unos segundos de retraso, y las que no se han pagado no entran—.`
          : (faltanArt < 0
            ? `De artículos vamos por delante: aquí hay <b>${c.lotes}</b> y la consola atribuye
               <b>${PANEL.items}</b>. TikTok tarda en atribuir, no falta nada.`
            : 'En artículos cuadran exactamente.')) : ''}
        ${frescoPanel != null && frescoPanel > 3
          ? `<br><b>Ojo:</b> el número de la consola es de hace ${frescoPanel} min. Si no se mueve,
             mira que la pestaña del panel de TikTok siga abierta y leída.` : ''}
      </div>`;
    }

    /* Lo de "sin tarifa" se decía aquí, en la ficha de cada vendedora, en la
       tabla de tipos y en su nota: cuatro veces lo mismo. Se queda donde sirve
       para hacer algo —la ficha y el análisis— y aquí solo si es gordo. */
    if (sinTarifa && tPrendas && sinTarifa / tPrendas > 0.1) {
      html += `<div class="aviso ambar"><b>${pl(sinTarifa, 'prenda', 'prendas')} sin tarifa</b>
        de ${tPrendas}. Llevan una categoría que no está en <code>costes-prendas.json</code>,
        así que suman venta pero no coste: el beneficio sale más alto de lo real.</div>`;
    }
  }

  html += bloqueCuentas(c);

  // --------------------------------------------------------------- la gente
  html += '<div class="gente">';
  for (const g of c.porVendedora.slice().sort((a, b) => b.cruzadas - a.cruzadas)) {
    const t = (j.turnos || []).find((x) => x.vendedora === g.vendedora);
    const q = cuentas[g.vendedora] || { prendas: 0, venta: 0, coste: 0, sinTarifa: 0 };
    /* El turno de verdad acabado, o el que se ha dado por acabado con el
       directo. Solo sigue "en curso" si el directo sigue vivo. */
    const fin = finTurno(t, c);
    const abierto = !(t && fin);
    const solo = !!(t && !t.acabo && fin);
    const horas = t && t.empezo
      ? hhmm(t.empezo) + '–' + (fin ? hhmm(fin) : 'sigue')
      : 'sin turno apuntado';
    const hv = horasVivas(t, c);
    const bruto = q.ventaConTarifa - q.coste;        // solo lo que tiene coste conocido
    const neto = bruto - (hv || 0) * (COSTES ? COSTES.hora : 0);

    html += `<div class="quien">
      <h2>${esc(g.vendedora)}${abierto ? '<span class="enCurso">en curso</span>' : ''}</h2>
      ${solo ? '<div class="horas" style="color:#E7C078;margin-bottom:6px">cerrado solo · no pulsó Terminar</div>' : ''}
      <div class="horas">${horas}${hv ? ' · ' + hv.toFixed(1).replace('.', ',') + ' h' : ''}</div>
      <div class="cifras">
        <div><b>${g.cruzadas}</b><span>prendas</span></div>
        <div><b>${eur(q.venta)}</b><span>vendido</span></div>
        <div><b>${eur(q.coste)}</b><span>coste ropa</span></div>
      </div>
      <div class="cifras">
        <div><b>${eur(q.conTarifa ? bruto / q.conTarifa : 0)}</b><span>benef. por prenda</span></div>
        ${hv ? `<div><b class="${neto < 0 ? 'neg' : ''}">${eur(neto / hv)}</b><span>benef. por hora</span></div>` : ''}
      </div>
      ${/* EL BENEFICIO DEL TURNO SOLO CUANDO EL TURNO HA ACABADO. Mientras
           sigue trabajando la cifra cambia cada minuto y no significa nada:
           enseñarla invita a juzgar a alguien por media hora suelta. */''}
      ${abierto
        ? `<div class="horas" style="margin:6px 0 10px">El beneficio del turno sale al terminarlo.</div>`
        : `<div class="cifras"><div><b class="${neto < 0 ? 'neg' : 'bien'}">${eur(neto)}</b>
             <span>beneficio del turno</span></div></div>`}
      <div class="via">
        ${g.porLote ? `<span class="et lote">${g.porLote} número leído</span>` : ''}
        ${g.porHora ? `<span class="et hora">${g.porHora} por la hora</span>` : ''}
        ${q.sinTarifa ? `<span class="et no">${q.sinTarifa} sin tarifa</span>` : ''}
        ${g.prendas - g.cruzadas ? `<span class="et no">${g.prendas - g.cruzadas} sin prenda</span>` : ''}
      </div>
    </div>`;
  }
  html += '</div>';

  if (!c.porVendedora.length) {
    html += `<div class="aviso ambar">Nadie ha marcado prendas este día.
      Las vendedoras entran por <code>/vendedoras?d=…</code> y su turno se abre al
      poner el nombre.</div>`;
  }

  /* =======================================================================
   *  QUIÉN ESTABA CUANDO SE DEJÓ DE MARCAR
   * =======================================================================
   *  Esto NO adjudica ventas. Una prenda sin marcar sigue sin contar para
   *  nadie —esa regla no se toca—. Lo que se dice aquí es otra cosa: durante
   *  el turno de Fulana se vendieron 40 prendas y ella marcó 25. No se
   *  inventa nada; la hora de cada venta y la de cada turno están las dos
   *  guardadas.
   *
   *  Y con dos a la vez no se señala a nadie: lo no marcado en un rato
   *  solapado es de las dos o de ninguna, y así se dice. */
  if ((c.porTurno || []).length) {
    html += `<h2 style="font-size:19px;margin:26px 0 4px">Marcado por turno</h2>
      <p class="sub" style="margin-bottom:10px">Lo que se vendió mientras cada una estaba, y lo que marcó.
      Las prendas sin marcar no cuentan para nadie: esto solo dice en qué rato se perdieron.</p>
      <table><thead><tr>
        <th>Vendedora</th><th>Turno</th><th>Vendidas</th><th>Marcadas</th>
        <th>Marcado</th><th>Dinero del rato</th><th>Sin marcar</th>
      </tr></thead><tbody>`;
    for (const t of c.porTurno) {
      /* DE BILLYSTOURVLC NO HAY DATOS DE VENTA, Y ESO SE DICE EN VEZ DE
         INVENTARSE UN NÚMERO. Antes esta fila salía con las ventas de la OTRA
         cuenta —las que coincidían en la hora— y un porcentaje bajísimo al lado.
         Eso no es un número flojo: es el trabajo de otra persona colgado a
         quien no le toca. Lo que marcó sí se enseña: eso sí se sabe. */
      const ciega = t.sinDatos || t.vendidas == null;
      const falta = ciega ? 0 : t.vendidas - t.marcadas;
      const clase = t.pct == null ? '' : (t.pct >= 90 ? '' : (t.pct >= 70 ? 'flojo' : 'malo'));
      html += `<tr>
        <td>${esc(t.vendedora)}${t.abierto ? '<span class="enCurso">en curso</span>' : ''}</td>
        <td class="n">${hhmm(t.empezo)}–${t.fin ? hhmm(t.fin) : 'sigue'}${
          t.cerradoSolo ? '<br><span class="et hora">cerrado solo</span>' : ''}${
          t.solapado ? '<br><span class="et no">solapado con otra</span>' : ''}${
          /* Dos turnos con el mismo nombre son un turno: cambió de aparato. Se
             dice, para que ver un rato largo no parezca un error. */
          t.unidos > 1 ? `<br><span class="et lote">${t.unidos} turnos juntados · cambió de aparato</span>` : ''}${
          ciega ? `<br><span class="et hora">${esc(t.cuenta || 'su cuenta')} · sin datos de venta</span>` : ''}</td>
        <td class="n">${ciega ? '—' : t.vendidas}</td>
        <td class="n">${ciega
          ? (t.marcas || 0) + ' <span class="et hora">sin prenda todavía</span>'
          : t.marcadas}</td>
        <td class="n">${t.pct == null ? '—' : `${t.pct}% <span class="barra" style="display:inline-block;width:60px;vertical-align:middle"><i class="${clase}" style="width:${t.pct}%"></i></span>`}</td>
        <td class="n">${ciega ? '—' : eur(t.euros)}</td>
        <td class="n">${!ciega && falta > 0 ? falta + ' · ' + eur(t.euros - t.eurosMarcados) : '—'}</td>
      </tr>`;
    }
    html += '</tbody></table>';
    /* Se explica una vez debajo, no en cada fila. */
    if (c.porTurno.some((t) => t.sinDatos)) {
      html += `<p class="sub" style="margin-top:8px">De <b>${esc(
        [...new Set(c.porTurno.filter((t) => t.sinDatos).map((t) => t.cuenta))].join(', ')
        )}</b> no hay panel de directo, así que no se puede saber cuántas prendas se vendieron
        mientras. Ese turno enseña lo que marcó y lo demás va en blanco a propósito: contar ahí
        las ventas de la otra cuenta sería colgarle a una el trabajo de la otra.</p>`;
    }
  }

  // -------------------------------------------- analizar por tipo de prenda
  TIPOS = analizarTipos(c);
  TIPOS.c = c;
  html += bloqueTipos(TIPOS);

  // ------------------------------------------------------ ver más estadísticas
  html += `<details class="mas"><summary>Ver más estadísticas</summary>

    <h3>Hora a hora</h3>
    <p class="nota">Un día al 70 % casi nunca es un 70 % constante: suelen ser dos horas
      al 100 % y una a cero. Aquí se ve en qué hora se rompió.</p>
    <table><thead><tr><th>Hora</th><th>Vendidas</th><th>Marcadas</th><th>Marcado</th>
      <th>Vendido</th><th>Marcado (€)</th></tr></thead><tbody>
      ${(c.porHora || []).map((f) => {
        const p = f.vendidas ? Math.round(f.marcadas / f.vendidas * 100) : 0;
        const clase = p >= 90 ? '' : (p >= 70 ? 'flojo' : 'malo');
        return `<tr>
          <td class="n">${f.hora}</td><td class="n">${f.vendidas}</td><td class="n">${f.marcadas}</td>
          <td class="n">${p}% <span class="barra" style="display:inline-block;width:60px;vertical-align:middle"><i class="${clase}" style="width:${p}%"></i></span></td>
          <td class="n">${eur(f.euros)}</td><td class="n">${eur(f.eurosMarcados)}</td>
        </tr>`; }).join('')}
    </tbody></table>

    <h3>El directo en números</h3>
    <table><tbody>
      <tr><td>Prendas vendidas</td><td class="n">${c.lotes}</td></tr>
      <tr><td>Precio medio de venta</td><td class="n">${eur(c.lotes ? c.euros / c.lotes : 0)}</td></tr>
      <tr><td>Prenda más cara</td><td class="n">${eur(Math.max(0, ...c.filas.map((f) => Number(f.precio || 0))))}</td></tr>
      ${(() => {
        /* EL RITMO VA CONTRA EL RELOJ DEL DIRECTO, no contra la suma de horas
           de las presentadoras: con dos a la vez dos horas, aquello sumaba 4 y
           el ritmo salía a la mitad del real. */
        const desde = c.filas.length ? Math.min(...c.filas.filter((f) => f.lote != null)
          .map((f) => new Date(f.en).getTime())) : null;
        const hasta = c.finDirecto ? new Date(c.finDirecto).getTime()
          : (c.ultimaVenta ? new Date(c.ultimaVenta).getTime() : null);
        const h = (desde && hasta && hasta > desde) ? (hasta - desde) / 3600000 : null;
        return `<tr><td>Ritmo de venta</td><td class="n">${h
          ? pl(Math.round(c.lotes / h), 'prenda', 'prendas') + '/hora · ' +
            h.toFixed(1).replace('.', ',') + ' h de directo'
          : '—'}</td></tr>`;
      })()}
      <tr><td>Coste medio de la ropa marcada</td><td class="n">${eur(tPrendas ? tCoste / tPrendas : 0)}</td></tr>
      <tr><td>Horas de presentadora</td><td class="n">${tHoras.toFixed(1).replace('.', ',')} h · ${eur(tPersonal)}</td></tr>
      <tr><td>Toques que no cuadraron con ninguna prenda</td><td class="n">${c.sinCruzar}</td></tr>
    </tbody></table>

    <h3>Cómo se calcula el dinero</h3>
    <p class="nota">
      <b>Coste de una prenda</b> = (€/kilo ÷ piezas/kilo + 0,05 € de transporte) × 1,21 de IVA.
      Sale de <code>costes-prendas.json</code> y se recalcula con la fórmula, no se copia.<br>
      <b>Beneficio de una prenda</b> = lo que se vendió − lo que costó comprarla.<br>
      <b>Beneficio de un turno</b> = beneficio de sus prendas − sus horas × ${eur(COSTES ? COSTES.hora : 0)}.
      Solo sale cuando el turno ha terminado.<br>
      <b>Beneficio del directo</b> = todo lo anterior sumado.<br><br>
      Con IVA en los dos lados, porque el precio de TikTok ya lo lleva. La hora de
      presentadora va <b>sin</b> IVA: un salario no lo lleva.<br><br>
      <b>Solo entra lo marcado.</b> Sin categoría no hay coste, y sin coste no hay margen.
      Por eso el beneficio es el de <b>lo marcado</b>, no el del directo entero: si hoy
      se marcó el ${c.marcadoEurosPct}% del dinero, esto es el margen de ese ${c.marcadoEurosPct}%.
    </p>
  </details>`;

  // -------------------------------------------------------------- el detalle
  if (c.filas.length) {
    html += `<h2 style="font-size:19px;margin:26px 0 10px">Prenda a prenda</h2>
      <table id="prendaAPrenda"><thead><tr>
        <th>Hora</th><th>Vendedora</th><th>Ficha</th><th>Rack</th>
        <th>Categoría</th><th>Precio</th><th>Coste</th><th>Beneficio</th><th>Cómo se ha sabido</th>
      </tr></thead><tbody>`;
    for (const f of c.filas) {
      const v = VIAS[f.metodo];
      html += `<tr>
        <td class="n">${hhmm(f.en)}</td>
        <td>${esc(f.vendedora)}</td>
        <td class="n">${f.lote == null ? '—' : '#' + f.lote}</td>
        <td>${esc(rotuloCuenta(f.cuenta))}</td>
        <td>${esc((COSTES && COSTES.porId[f.categoria] && COSTES.porId[f.categoria].nombre) || f.categoria || '')}</td>
        <td class="n">${f.precio == null ? '' : eur(f.precio)}</td>
        <td class="n">${costeDe(f.categoria) == null ? '—' : eur(costeDe(f.categoria))}</td>
        <td class="n">${(f.precio == null || costeDe(f.categoria) == null) ? '' : eur(Number(f.precio) - costeDe(f.categoria))}</td>
        <td>${v ? `<span class="et ${v.et}">${v.txt}</span>` : '<span class="et no">sin cruzar</span>'}</td>
      </tr>`;
    }
    html += '</tbody></table>';
  }

  $('salida').innerHTML = html;

  /* La tabla de tipos se pinta aparte para poder reordenarla con los botones
     sin volver a preguntarle al servidor ni cerrar el desplegable. */
  pintarTipos();
  const chips = $('ordenTipos');
  if (chips) chips.onclick = (e) => {
    const b = e.target.closest('.chip');
    if (!b) return;
    ORDEN = b.dataset.orden;
    for (const x of chips.querySelectorAll('.chip')) x.classList.toggle('on', x === b);
    pintarTipos();
  };
}

/* La hoja de cálculo con punto y coma: es lo que abre bien el Excel en
   español sin tener que tocar nada al importarla. */
$('csv').onclick = () => {
  if (!ULTIMO || !ULTIMO.cruce) return;
  const cab = ['hora','vendedora','ficha','rack','categoria','precio','coste','beneficio','como_se_ha_sabido'];
  const lineas = [cab.join(';')].concat(ULTIMO.cruce.filas.map((f) => [
    hhmm(f.en), f.vendedora, f.lote == null ? '' : f.lote, rotuloCuenta(f.cuenta),
    f.categoria || '', f.precio == null ? '' : String(f.precio).replace('.', ','),
    costeDe(f.categoria) == null ? '' : costeDe(f.categoria).toFixed(3).replace('.', ','),
    (f.precio == null || costeDe(f.categoria) == null) ? ''
      : (Number(f.precio) - costeDe(f.categoria)).toFixed(3).replace('.', ','),
    (VIAS[f.metodo] || {}).txt || 'sin cruzar'
  ].map((x) => '"' + String(x).replace(/"/g, '""') + '"').join(';')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + lineas.join('\n')], { type: 'text/csv' }));
  a.download = 'reparto-' + ULTIMO.dia + '.csv';
  a.click();
};

$('ver').onclick = cargar;
$('dia').addEventListener('change', cargar);

/* Cambiar de cuenta es volver a pedirlo todo con esa cuenta: la página no
   reaprovecha nada, así que no puede quedar un número de la otra. */
$('pestanas').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  CUENTA = b.dataset.c;
  try { localStorage.setItem('billys_reparto_cuenta', CUENTA); } catch (err) {}
  cargar();
});

/* El día del negocio en hora de Valencia, que es el que usa el servidor. */
$('dia').value = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Madrid' }).format(new Date());
cargar();
/* Durante el directo interesa verlo moverse; fuera del directo da igual. */
setInterval(() => { if (!document.hidden) cargar(); }, 60000);
/* Al volver a la pestaña se pide de nuevo. Una pestaña de fondo no refresca, y
   volver a ella y leer una foto de hace media hora es peor que no mirar. */
document.addEventListener('visibilitychange', () => { if (!document.hidden) cargar(); });
})();
</script>
</body>
</html>
