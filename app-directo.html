<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Billy's · Directo</title>
<style>
  :root{
    --fondo:#0d1117; --caja:#161c22; --caja2:#1d252c; --borde:#2b353d;
    --texto:#f2f5f7; --suave:#8b97a1; --cian:#3fb6a8; --malo:#e05b55; --ok:#5ec264;
    --arriba:#5C8FD6; --abajo:#D98A4A; --exterior:#7FB893;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html,body{margin:0;height:100%;background:var(--fondo);color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overscroll-behavior:none;user-select:none;overflow:hidden}
  body{display:flex;flex-direction:column}

  header{display:flex;align-items:center;gap:22px;padding:9px 18px;
    border-bottom:1px solid var(--borde);background:var(--caja);flex:0 0 auto}
  .ficha{display:flex;align-items:baseline;gap:11px;min-width:190px}
  .ficha .et{font-size:11px;letter-spacing:.17em;color:var(--suave);text-transform:uppercase}
  .ficha .n{font-size:50px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;transition:color .15s}
  .ficha .n.sube{color:var(--cian)}
  .ultima{flex:1;font-size:14px;color:var(--suave);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ultima b{color:var(--texto);font-weight:600}
  .estado{font-size:12.5px;color:var(--suave);text-align:right;min-width:150px}
  .punto{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--suave);margin-right:7px}
  .punto.on{background:var(--ok)} .punto.off{background:var(--malo)}
  .banda{background:#8a5a00;color:#fff;padding:6px;font-size:13px;font-weight:600;text-align:center;flex:0 0 auto}

  .cuerpo{flex:1;display:grid;grid-template-columns:1.25fr 1fr;gap:14px;padding:12px 16px 16px;min-height:0}

  /* ---- prendas, a la izquierda, SIEMPRE en el mismo sitio ---- */
  .prendas{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-content:start;min-height:0}
  .fam{display:flex;flex-direction:column;gap:9px;min-height:0}
  .fam h2{margin:0 0 1px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--suave);display:flex;align-items:center;gap:7px;font-weight:800}
  .fam h2 i{width:9px;height:9px;border-radius:50%;display:block}
  button.cat{appearance:none;border:2px solid var(--borde);background:var(--caja);color:var(--texto);
    border-radius:15px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:7px;flex:1;min-height:82px;transition:transform .05s,border-color .1s,background .1s}
  button.cat svg{width:40px;height:40px;display:block;flex:none}
  button.cat b{font-size:15px;font-weight:750;line-height:1.1;text-align:center;letter-spacing:-.01em}
  button.cat:active{transform:scale(.96)}
  button.cat.on{background:color-mix(in srgb,var(--cian) 22%,var(--caja))}

  /* ---- marcas, a la derecha ---- */
  .lado{display:flex;flex-direction:column;gap:10px;min-height:0}
  .lado h3{margin:0;font-size:13px;color:var(--suave);font-weight:700;letter-spacing:.04em;
    display:flex;align-items:center;gap:9px}
  .lado h3 svg{width:22px;height:22px}
  .marcas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;flex:1;min-height:0}
  button.marca{appearance:none;border:1px solid var(--borde);background:var(--caja2);color:var(--texto);
    border-radius:16px;font-size:26px;font-weight:750;padding:8px 12px;line-height:1.1;
    display:flex;align-items:center;justify-content:center;text-align:center;
    transition:transform .05s,background .1s}
  button.marca:active{transform:scale(.96);background:#28323a}
  button.marca.cajon{border-style:dashed;color:var(--suave);font-size:22px}
  .espera{display:flex;align-items:center;justify-content:center;height:100%;
    color:var(--suave);font-size:19px;text-align:center;line-height:1.7;
    border:1px dashed var(--borde);border-radius:16px;padding:20px}

  .aviso{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--caja2);border:1px solid var(--borde);border-radius:14px;
    padding:15px 30px;font-size:22px;font-weight:700;box-shadow:0 10px 34px rgba(0,0,0,.6);
    opacity:0;pointer-events:none;transition:opacity .12s;max-width:92vw;text-align:center;z-index:9}
  .aviso.ver{opacity:1}
  .aviso.error{border-color:var(--malo);color:#ffb9b6;background:#2a1a19}
  .tapa{position:fixed;inset:0;background:rgba(13,17,23,.4);display:none;z-index:8}
  .tapa.ver{display:block}
  .vacio{padding:30px 6px;color:var(--suave);font-size:17px;line-height:1.7}
</style>
</head>

<script>
/* Billy's · pantalla del directo.
 *
 * LA DISTRIBUCION ES LA DE LA APP DE MARCAR DEL ALMACEN, con sus mismas
 * familias, sus mismos colores y sus mismos iconos. Es a proposito: quien
 * emite y quien recoge acaban siendo la misma gente, y aprender una pantalla
 * tiene que servir para la otra.
 *
 * LO QUE CAMBIA RESPECTO AL MOVIL es que aqui hay sitio: las prendas viven a la
 * izquierda y SIEMPRE estan todas a la vista, y las marcas aparecen a la
 * derecha sin tapar nada. Dos toques, sin cambiar de pantalla y sin volver
 * atras nunca.
 *
 * NADA SE MUEVE DE SITIO. Ni las prendas ni las marcas se reordenan por lo que
 * vaya pasando en el directo: el orden lo fijan las listas de abajo. Si los
 * botones bailan, no hay forma de memorizar donde esta cada cosa, y memorizarlo
 * es lo unico que hace que a los dos dias se vaya sin mirar.
 *
 * LAS PRENDAS NO VIENEN AGRUPADAS EN EL PERCHERO. Nada de esto supone que la
 * siguiente se parezca a la anterior.
 */
const P = new URLSearchParams(location.search);
const CODIGO  = P.get('d') || '';
const DIRECTO = P.get('directo') || '';
const PRUEBA  = P.get('prueba') === '1';
const API = '/api/tandas';

/* La pantalla se toca AQUI y en ningun otro sitio. `ico` es el dibujo que ya
 * usa la app del almacen; `fam` la columna en la que cae. */
const TIPOS = [
  { n:'Hoodie',         ico:'sudadera',    fam:'arriba' },
  { n:'T Shirt',        ico:'camiseta',    fam:'arriba' },
  { n:'Shirt',          ico:'camisa',      fam:'arriba' },
  { n:'Jersey',         ico:'punto',       fam:'arriba' },
  { n:'Football Shirt', ico:'futbol',      fam:'arriba' },
  { n:'Jacket',         ico:'chaqueta',    fam:'exterior' },
  { n:'Track Jacket',   ico:'trackjacket', fam:'exterior' },
  { n:'Anorak',         ico:'anoraksra',   fam:'exterior' },
  { n:'Track Pant',     ico:'trackpants',  fam:'abajo' },
  { n:'Jeans',          ico:'vaquero',     fam:'abajo' },
  { n:'Shorts',         ico:'shorts',      fam:'abajo' }
];
const FAM = [
  { id:'arriba',   n:'De arriba', color:'var(--arriba)' },
  { id:'abajo',    n:'De abajo',  color:'var(--abajo)' },
  { id:'exterior', n:'Exterior',  color:'var(--exterior)' }
];
const ORDEN_MARCAS = ['Nike','Adidas','Puma','Champion','Ellesse',
  'Ralph Lauren','Lacoste','Tommy Hilfiger','Hugo Boss','Gant',
  "Levi's",'Wrangler','Lee','Diesel','Carhartt',
  'The North Face','Columbia','Helly Hansen','Berghaus','Jack Wolfskin','Umbro','Kappa'];

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const vibrar = (p) => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
let estado = null, elegido = null, bloqueoHasta = 0, ordenMia = null, fichaPintada = null;
let mapa = new Map(), huella = '';

function aviso(txt, malo) {
  const a = $('aviso');
  a.textContent = txt;
  a.classList.toggle('error', !!malo);
  a.classList.add('ver');
  clearTimeout(a._t);
  a._t = setTimeout(() => a.classList.remove('ver'), malo ? 6000 : 1300);
}

const limpiar = (n) => String(n || '').replace(/^#\d+\s*/, '').replace(/^Gebrauchtes?\s+/i, '').trim();
const icoDe = (t) => (TIPOS.find((x) => x.n === t) || {}).ico || 'nose';

/* Los tipos salen del panel, no de la lista de arriba: el cajon de cada uno se
 * llama "<tipo> Vintage". La lista solo manda en el ORDEN y en el dibujo, asi
 * que si un dia se añade un tipo al Excel aparece igual, al final y con el
 * icono de "no se". */
function organizar(listados) {
  const limpios = listados.map((l) => ({ ...l, corto: limpiar(l.nombre) }));
  const tipos = [...new Set(limpios.filter((l) => /\sVintage$/i.test(l.corto))
    .map((l) => l.corto.replace(/\s+Vintage$/i, '')))].sort((a, b) => b.length - a.length);
  const m = new Map();
  for (const l of limpios) {
    const t = tipos.find((u) => l.corto === u + ' Vintage' || l.corto.startsWith(u + ' '));
    if (!t) continue;
    const marca = (l.corto === t + ' Vintage') ? '' : l.corto.slice(t.length).trim();
    if (!m.has(t)) m.set(t, []);
    m.get(t).push({ ...l, marca });
  }
  const pos = (x) => { const i = ORDEN_MARCAS.indexOf(x); return i < 0 ? 900 : i; };
  for (const [, items] of m) {
    items.sort((a, b) => (a.marca ? 0 : 1) - (b.marca ? 0 : 1) ||
      pos(a.marca) - pos(b.marca) || a.marca.localeCompare(b.marca));
  }
  return m;
}

function pintarPrendas() {
  const cont = $('prendas');
  if (!mapa.size) {
    cont.innerHTML = '<div class="vacio">Todavía no hay anuncios.<br><br>Abre el panel de TikTok ' +
      'en el ordenador del directo y deja esa pestaña abierta.</div>';
    return;
  }
  const orden = (t) => { const i = TIPOS.findIndex((x) => x.n === t); return i < 0 ? 900 : i; };
  const suyos = (f) => [...mapa.keys()]
    .filter((t) => ((TIPOS.find((x) => x.n === t) || {}).fam || 'arriba') === f)
    .sort((a, b) => orden(a) - orden(b));
  cont.innerHTML = FAM.map((f) => {
    const ts = suyos(f.id);
    if (!ts.length) return '';
    return '<div class="fam"><h2><i style="background:' + f.color + '"></i>' + f.n + '</h2>' +
      ts.map((t) => '<button class="cat' + (t === elegido ? ' on' : '') + '" data-t="' + esc(t) + '"' +
        ' style="border-color:' + (t === elegido ? 'var(--cian)' : 'var(--borde)') + '">' +
        '<svg viewBox="0 0 32 32" fill="' + f.color + '"><use href="#i-' + icoDe(t) + '"></use></svg>' +
        '<b>' + esc(t) + '</b></button>').join('') + '</div>';
  }).join('');
}

function pintarMarcas() {
  const cont = $('marcas'), tit = $('tituloLado');
  if (!elegido) {
    tit.textContent = 'Qué prenda es';
    cont.innerHTML = '<div class="espera" style="grid-column:1/-1">Toca la prenda que tienes<br>en la mano</div>';
    return;
  }
  const f = FAM.find((x) => x.id === ((TIPOS.find((y) => y.n === elegido) || {}).fam || 'arriba'));
  tit.innerHTML = '<svg viewBox="0 0 32 32" fill="' + f.color + '"><use href="#i-' + icoDe(elegido) +
    '"></use></svg> ' + esc(elegido) + ' · de qué marca';
  const items = mapa.get(elegido) || [];
  cont.innerHTML = items.map((it, i) =>
    '<button class="marca' + (it.marca ? '' : ' cajon') + '" data-i="' + i + '">' +
    esc(it.marca || 'Sin marca') + '</button>').join('');
}

document.addEventListener('click', (e) => {
  const cat = e.target.closest('.cat');
  if (cat) { elegido = cat.dataset.t; vibrar(8); pintarPrendas(); pintarMarcas(); return; }
  const mb = e.target.closest('.marca');
  if (mb) { const items = mapa.get(elegido) || []; const it = items[Number(mb.dataset.i)]; if (it) pedir(it); }
});

async function pedir(item) {
  const ahora = Date.now();
  if (ahora < bloqueoHasta) return;
  bloqueoHasta = ahora + 1400;
  $('tapa').classList.add('ver');
  setTimeout(() => $('tapa').classList.remove('ver'), 1100);
  vibrar([12, 40, 12]);
  const queEra = elegido;
  try {
    const r = await fetch(API + '?d=' + encodeURIComponent(CODIGO), {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ live: 1, directo: DIRECTO, accion: 'pedir',
        listado: item.id, nombre: item.nombre, prueba: PRUEBA ? 1 : 0 })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'no');
    estado = j; ordenMia = j.orden ? j.orden.id : null;
    aviso((PRUEBA ? 'PRUEBA · ' : '') + queEra + ' ' + (item.marca || 'sin marca'));
    /* Se vuelve a cero: la siguiente prenda no tiene por que parecerse a esta. */
    elegido = null; pintarPrendas(); pintarMarcas(); cabecera();
  } catch (e) { aviso('No se ha podido mandar. Mira la conexión.', true); }
}

function cabecera() {
  if (!estado) return;
  const n = (estado.ficha || 0) + 1, el = $('ficha');
  if (fichaPintada !== null && n !== fichaPintada) {
    el.classList.add('sube'); setTimeout(() => el.classList.remove('sube'), 600);
  }
  fichaPintada = n; el.textContent = n;
  const u = (estado.ultimas || [])[(estado.ultimas || []).length - 1];
  $('ultima').innerHTML = u ? 'Última vendida: <b>ficha ' + u.ficha + '</b> · ' +
    esc(limpiar(u.nombre)) + ' · ' + esc(u.precio || '') : '';
  const l = estado.listados_cuando ? (Date.now() - new Date(estado.listados_cuando).getTime()) / 1000 : 1e9;
  const vivo = l < 45;
  $('punto').className = 'punto ' + (vivo ? 'on' : 'off');
  $('txtEstado').textContent = !vivo ? 'el ordenador no responde'
    : (estado.orden && estado.orden.estado === 'pendiente') ? 'lanzando…'
    : (estado.orden && estado.orden.estado === 'error') ? 'falló' : 'listo';
  if (estado.orden && estado.orden.estado === 'error' && estado.orden.id === ordenMia) {
    ordenMia = null;
    aviso('No arrancó: ' + (estado.orden.error || 'sin motivo'), true);
  }
}

/* Preguntar sin tumbar el servidor: vueltas encadenadas, corte a los 8 segundos
 * y freno progresivo. El 22 sep 2026 tres cosas preguntando cada dos segundos
 * dejaron toda la API sin responder, también las tandas del almacén. */
const RITMO = 3000, MAX = 60000, CORTE = 8000;
let espera = RITMO;
function llamar(url) {
  const corta = new AbortController();
  const reloj = setTimeout(() => corta.abort(), CORTE);
  return fetch(url, { signal: corta.signal }).then((r) => r.json()).finally(() => clearTimeout(reloj));
}
async function mirar() {
  try {
    const j = await llamar(API + '?d=' + encodeURIComponent(CODIGO) +
      '&directo=' + encodeURIComponent(DIRECTO) + '&live=1&_=' + Date.now());
    if (!j.ok) { $('punto').className = 'punto off'; $('txtEstado').textContent = j.error || 'el servidor dice que no'; }
    else {
      estado = j; cabecera();
      const h = JSON.stringify((j.listados || []).map((x) => [x.id, x.nombre]));
      if (h !== huella) { huella = h; mapa = organizar(j.listados || []);
        if (elegido && !mapa.has(elegido)) elegido = null;
        pintarPrendas(); pintarMarcas(); }
    }
    espera = RITMO;
  } catch (e) {
    $('punto').className = 'punto off'; $('txtEstado').textContent = 'sin respuesta';
    espera = Math.min(espera * 2, MAX);
  }
  setTimeout(mirar, espera);
}

if (PRUEBA) $('banda').style.display = '';
if (!CODIGO || !DIRECTO) {
  $('prendas').innerHTML = '<div class="vacio">Falta el código o el directo en el enlace.</div>';
} else { pintarMarcas(); mirar(); }
</script>
