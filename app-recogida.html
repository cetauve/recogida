<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1723">
<title>Billy's — Recogida</title>
<style>
:root{--bone:#EDE7DB;--navy:#1B2A3D;--red:#C8321F;--verde:#2E9E6B;--ambar:#E8B84B;
 /* Estos dos faltaban y por eso el boton del rol elegido no se marcaba y el
    boton grande de la cola salia transparente: el CSS los llamaba --rojo y
    --linea y en :root solo estaba --red. Se anaden como alias para no tener
    que tocar las quince reglas que ya los usan. */
 --rojo:#C8321F;--linea:#2A3B52}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0E1723;color:var(--bone);
 font:16px/1.4 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
 user-select:none;-webkit-user-select:none}

/* ---------------- quien soy ---------------- */
#quienSoy{margin:0 0 20px}
#miNombre{width:100%;padding:14px;font-size:17px;border-radius:12px;border:2px solid var(--linea);
  background:var(--navy);color:var(--bone);margin-bottom:10px}
#miNombre:focus{outline:none;border-color:var(--rojo)}
#nombresHoy{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0}
#nombresHoy button{background:transparent;border:1.5px solid var(--linea,rgba(237,231,219,.2));
 color:inherit;border-radius:999px;padding:7px 13px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
#nombresHoy button.yo{border-color:var(--rojo);background:rgba(200,50,31,.14)}
.modos{display:flex;gap:10px}
.modoBtn{flex:1;padding:14px 10px;border-radius:12px;border:2px solid var(--linea);
  background:var(--navy);color:var(--bone);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.modoBtn.on{background:var(--rojo);border-color:var(--rojo);color:#fff}
#quienSoy .sub{margin:10px 0 0;font-size:13px}
#tandas.bloqueado{opacity:.25;pointer-events:none}

/* ---------------- menú de tandas ---------------- */
#menu{position:absolute;inset:0;overflow:auto;padding:calc(24px + env(safe-area-inset-top)) 18px
 calc(24px + env(safe-area-inset-bottom));display:none;flex-direction:column}
#menu.on{display:flex}
#menu h1{font-size:24px;font-weight:900;letter-spacing:-.02em;margin-bottom:2px}
#menu .sub{font-size:13px;opacity:.5;margin-bottom:22px}
.tandaBtn{display:block;width:100%;text-align:left;background:var(--navy);border:0;color:var(--bone);
 border-radius:20px;padding:18px 20px;margin-bottom:12px;font:inherit;position:relative;overflow:hidden}
.tandaBtn .tt{font-size:19px;font-weight:800;margin-bottom:4px}
.tandaBtn .dd{font-size:13px;opacity:.6}
/* Qué hay de cada rack en esta tanda. Se lee antes de entrar, que es cuando
   sirve: dentro las tarjetas van un rack y luego el otro. */
.tandaBtn .racks{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tandaBtn .rk{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
 background:rgba(237,231,219,.10);border-radius:999px;padding:3px 9px;opacity:.85}
.tandaBtn .rk b{font-variant-numeric:tabular-nums}
.tandaBtn .pp{position:absolute;left:0;bottom:0;height:4px;background:var(--verde)}
.tandaBtn.lista{opacity:.5}
.tandaBtn .tick{position:absolute;right:18px;top:50%;transform:translateY(-50%);
 font-size:22px;color:var(--verde);font-weight:900}
#menu .pie{margin-top:auto;padding-top:20px;font-size:12px;opacity:.35;text-align:center}

/* ---------------- barra ---------------- */
#barra{position:fixed;top:0;left:0;right:0;z-index:30;
 padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
 display:none;align-items:center;gap:10px;background:#0E1723}
#barra.on{display:flex}
#barra button{background:rgba(237,231,219,.12);border:0;color:var(--bone);border-radius:9px;
 padding:8px 12px;font:inherit;font-size:13px;font-weight:700}
#barra button:disabled{opacity:.28}
#medio{flex:1;min-width:0}
#tanda{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
 color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#progreso{height:5px;background:rgba(237,231,219,.14);border-radius:99px;margin-top:5px;overflow:hidden}
#barraProg{height:100%;width:0;background:var(--red);transition:width .25s}
#cuenta{font-size:13px;font-variant-numeric:tabular-nums;opacity:.7;white-space:nowrap}

/* ---------------- tarjetas ---------------- */
#pila{position:absolute;left:14px;right:14px;display:none;
 top:calc(74px + env(safe-area-inset-top));bottom:calc(94px + env(safe-area-inset-bottom))}
#pila.on{display:block}
.tarjeta{position:absolute;inset:0;background:var(--navy);border-radius:26px;
 box-shadow:0 18px 46px rgba(0,0,0,.5);padding:22px 20px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center;will-change:transform;
 touch-action:pan-y;overflow:hidden}
.tarjeta.d1{transform:scale(.94) translateY(14px);filter:brightness(.72)}
.tarjeta.d2{transform:scale(.88) translateY(26px);filter:brightness(.52)}
.regalos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
.rg{font-size:13px;font-weight:900;letter-spacing:.04em;text-transform:uppercase;
 border-radius:999px;padding:7px 14px;background:#E8B84B;color:#2A1F05;
 box-shadow:0 0 0 3px rgba(232,184,75,.25)}
.rg-oro{background:#E8B84B;color:#2A1F05}
.rg-plata{background:#CBD3DA;color:#1B2A3D}
.rg-diamante{background:#8FE3F2;color:#06323C}
.nombre{font-size:clamp(26px,7.5vw,40px);font-weight:900;line-height:1.05;letter-spacing:-.02em;
 margin-bottom:2px;word-break:break-word}
.usuario{font-size:13px;opacity:.45;margin-bottom:14px}
.numeros{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;
 max-height:46vh;overflow:auto;margin-bottom:12px}
/* Dos cuentas emitiendo contra el mismo almacén: cada una numera sus fichas
   desde el 1, y los racks están separados por cuenta. El rótulo dice de qué
   rack es cada número. Solo sale si el comprador tiene prendas de esa cuenta:
   con una sola cuenta no se pinta nada y la tarjeta es la de siempre. */
.grupos{display:flex;flex-direction:column;gap:10px;align-items:stretch;
 max-height:46vh;overflow:auto;margin-bottom:12px;width:100%}
.grupo{display:flex;flex-direction:column;gap:6px}
.rack{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
 opacity:.55;text-align:center}
.grupo .numeros{max-height:none;overflow:visible;margin-bottom:0}
.n{background:var(--red);color:#fff;border-radius:14px;font-weight:900;
 font-variant-numeric:tabular-nums;padding:10px 14px;min-width:60px}
.n.solo{font-size:clamp(54px,17vw,90px);padding:14px 26px;border-radius:22px;line-height:1}
.n.pocos{font-size:clamp(26px,8vw,40px);padding:12px 18px}
.n.muchos{font-size:clamp(17px,4.6vw,22px)}
.cuantas{font-size:14px;font-weight:800;opacity:.75;letter-spacing:.04em}
.pedido{font-size:11px;opacity:.32;margin-top:10px;font-variant-numeric:tabular-nums;word-break:break-all}
.sello{position:absolute;top:22px;font-size:24px;font-weight:900;letter-spacing:.05em;
 border:4px solid;border-radius:12px;padding:5px 14px;opacity:0;transition:opacity .1s}
.sello.ok{right:20px;color:var(--verde);border-color:var(--verde);transform:rotate(12deg)}
.sello.no{left:20px;color:var(--ambar);border-color:var(--ambar);transform:rotate(-12deg)}

#pie{position:fixed;left:0;right:0;bottom:0;z-index:30;display:none;gap:12px;
 padding:20px 16px calc(16px + env(safe-area-inset-bottom));
 background:linear-gradient(transparent,#0E1723 40%)}
#pie.on{display:flex}
#pie button{flex:1;border:0;border-radius:18px;padding:17px 0;font:inherit;font-size:15px;font-weight:800}
#saltar{background:rgba(237,231,219,.12);color:var(--bone)}
#hecho{background:var(--verde);color:#fff}

#fin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
 justify-content:center;text-align:center;padding:28px;gap:12px;overflow:auto}
#fin.on{display:flex}
#fin h2{font-size:28px;font-weight:900}
#fin .inc{font-size:14px;opacity:.8;max-width:92%;line-height:1.6}
#fin button{background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px 24px;
 font:inherit;font-weight:800;margin-top:8px}
#fin button.otro{background:rgba(237,231,219,.12)}

/* --- la cola de empaquetado --- */
/* EN EL MÓVIL, EL BOTÓN DE CERRAR NO SE PUEDE IR DE LA PANTALLA.
   La lista de "lo que queda" puede tener sesenta líneas: con la página
   entera desplazándose, "Paquete cerrado" quedaba sesenta líneas más abajo y
   desaparecía en cuanto movías el dedo. Ahora la pantalla no se desplaza: se
   desplaza SOLO el centro, y la botonera vive pegada abajo. */
#cola{display:none;flex-direction:column;height:100dvh;overflow:hidden;padding:14px 16px 0}
#cola.on{display:flex}
#colaCentro{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;
 display:flex;flex-direction:column}
#cola h1{margin:0 0 4px}
#colaFicha{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 0}
#colaFicha .tarjeta{position:relative;width:100%;max-width:520px}
#colaVacia{text-align:center;opacity:.6;font-size:16px;line-height:1.6;padding:40px 10px}
.rescate{background:#241C0E;border:1.5px solid #D89B2E;border-radius:12px;
 padding:11px 13px;font-size:14px;line-height:1.5;margin-bottom:12px;width:100%;max-width:520px}
#colaCabecera{display:flex;align-items:baseline;gap:10px;margin:6px 0 2px}
#colaCabecera b{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
#colaCabecera span{font-size:18px;font-weight:700}
/* LO QUE QUEDA POR CERRAR. Una lista corta y sin adornos: número, nombre y
   por qué sigue ahí. Es la pantalla que no existía el 17 ago 2026, cuando
   quedaban veintiún paquetes parados y uno abierto y los móviles decían que no
   había nada. */
#colaQueda{width:100%;max-width:520px;margin:2px auto 0}
#colaQueda h3{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
 opacity:.55;margin:14px 0 8px}
.qLinea{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:11px;
 background:rgba(237,231,219,.05);border:1px solid rgba(237,231,219,.08);margin-bottom:6px}
.qLinea b{font-size:19px;font-variant-numeric:tabular-nums;min-width:38px}
.qLinea .qq{flex:1;min-width:0;font-size:14px;line-height:1.35}
.qLinea .qq small{display:block;opacity:.6;font-size:12px}
.qLinea button{border:0;border-radius:9px;padding:9px 12px;font:inherit;font-weight:800;
 font-size:13px;background:var(--red);color:#fff;cursor:pointer;white-space:nowrap}
/* "Cerrado" en verde, como el botón grande de cerrar: es el mismo gesto. */
.qLinea button.qCerrar{background:#2E9E6B;color:#fff}
.qLinea.parado{border-color:rgba(216,155,46,.45)}
.qLinea.parado button{background:#D89B2E;color:#1A1208}
.qLinea.retirado{opacity:.45}
.qLinea.retirado button{display:none}
/* Quién lo recogió y a qué hora, encima de la ficha del que empaqueta. */
.deQuien{width:100%;max-width:520px;font-size:13px;opacity:.75;margin-bottom:8px}
.deQuien b{opacity:1}

#colaBotones{display:flex;flex-direction:column;gap:10px;flex:none;
 padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:#0E1723;
 box-shadow:0 -14px 22px #0E1723}
#colaBotones button{border:0;border-radius:14px;padding:16px;font:inherit;font-weight:800;font-size:17px}
#pedir{background:var(--red);color:#fff}
#cerrarPaq{background:#2E9E6B;color:#fff}
#soltarPaq{background:rgba(237,231,219,.12);color:inherit;font-weight:600;font-size:15px;padding:12px}

/* --- quien lleva cada tanda --- */
.ocupada{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;
 padding:3px 9px;border-radius:999px;background:rgba(216,155,46,.18);color:#E7C078}
.tandaBtn.deOtro{opacity:.55}

/* --- aviso de version nueva --- */
#versionNueva{position:fixed;left:12px;right:12px;bottom:12px;z-index:99;display:none;
 background:#12241C;border:1.5px solid #2E9E6B;border-radius:14px;padding:12px 14px;
 align-items:center;gap:12px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#versionNueva.on{display:flex}
#versionNueva button{margin-left:auto;background:#2E9E6B;color:#fff;border:0;border-radius:10px;
 padding:10px 16px;font:inherit;font-weight:800;cursor:pointer}

/* --- un aviso que no para el trabajo --- */
#avisoSuave{position:fixed;left:12px;right:12px;bottom:12px;z-index:120;display:none;
 background:#241C0E;border:1.5px solid #D89B2E;border-radius:14px;padding:13px 15px;
 font-size:14px;line-height:1.5;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#avisoSuave.on{display:block}

/* --- cambiar rol --- */
.cambiarRol{background:transparent;border:1.5px solid var(--linea,rgba(237,231,219,.2));
 color:inherit;border-radius:10px;padding:8px 12px;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
</style>
</head>
<body>

<div id="menu" class="on">
  <h1 id="menuTitulo">Recogida</h1>
  <div class="sub" id="menuSub"></div>

  <!-- QUIEN ERES Y QUE HACES. Sin esto no hay forma de medir a nadie, y si se
       pide como un paso aparte no se rellena. Se pregunta una vez por movil y
       se recuerda. -->
  <div id="quienSoy">
    <input id="miNombre" type="text" placeholder="Tu nombre" autocomplete="off" autocapitalize="words">
    <!-- Los que ya andan por aquí hoy. Un toque en su nombre y no hay forma de
         escribirlo de otra manera, que es como acabaron "yasmin" y "Yasmine"
         siendo dos trabajadoras distintas el 17 ago 2026. -->
    <div id="nombresHoy"></div>
    <div class="modos">
      <button class="modoBtn" data-m="recoge">Cojo prendas</button>
      <button class="modoBtn" data-m="empaqueta">Cierro paquetes</button>
    </div>
    <div class="sub" id="ayudaModo"></div>
  </div>

  <div id="tandas"></div>
  <!-- No se salta solo a la cola desde el menu: si lo hiciera, "cambiar rol"
       te devolveria a la cola una y otra vez y no habria forma de salir. -->
  <button id="irCola" style="display:none;width:100%;padding:18px;border:0;border-radius:14px;
    background:var(--rojo);color:#fff;font:inherit;font-weight:800;font-size:17px;cursor:pointer">
    Ir a la cola de paquetes</button>
  <div class="pie" id="menuPie"></div>
</div>

<!-- LA COLA · lo que ve quien empaqueta.
     No elige paquete: lo pide. El servidor reparte y garantiza que a dos
     personas no les toque el mismo. -->
<div id="cola">
  <h1>Paquetes</h1>
  <div class="sub" id="colaSub"></div>
  <div id="colaCentro">
    <div id="colaCabecera" style="display:none"><b id="colaNum"></b><span id="colaQuien"></span></div>
    <div id="colaFicha"><div id="colaVacia">Pulsa <b>Dame el siguiente</b> cuando estés libre.</div></div>
    <div id="colaQueda"></div>
  </div>
  <div id="colaBotones">
    <button id="pedir">Dame el siguiente</button>
    <button id="cerrarPaq" style="display:none">Paquete cerrado</button>
    <button id="soltarPaq" style="display:none">No puedo con este · devolverlo</button>
    <!-- La salida a la lista de tandas. Sin esto, entrar en la cola era un
         callejón: para volver a la lista había que "cambiar rol" y volver a
         entrar, y por eso parecía que la lista ya no existía para ellos. -->
    <button id="colaLista" style="background:transparent;font-weight:600;font-size:14px;opacity:.75">Ir a la lista de tandas</button>
    <!-- El pestillo de admin. Discreto a propósito: no es un botón de trabajo,
         es el de "ya está todo" del final del turno. -->
    <button id="colaAdmin" style="background:transparent;font-weight:600;font-size:13px;opacity:.35">Admin</button>
    <button id="colaSalir" style="background:transparent;font-weight:600;font-size:14px;opacity:.6">Cambiar rol</button>
    <button id="colaOtro" style="background:transparent;font-weight:600;font-size:14px;opacity:.6">Cambiar trabajador</button>
  </div>
</div>

<!-- SE AVISA, NO SE RECARGA SOLO. Recargar a alguien a mitad de un paquete es
     justo lo que no se puede hacer: pierde de vista los numeros que tenia en la
     mano. Se le dice y decide el. -->
<div id="versionNueva">
  <span><b>Hay una versión nueva de la app.</b><br>Toca para ponerte al día.</span>
  <button id="actualizarYa">Actualizar</button>
</div>

<div id="barra">
  <button id="volver">Tandas</button>
  <div id="medio"><div id="tanda"></div><div id="progreso"><div id="barraProg"></div></div></div>
  <div id="cuenta"></div>
  <button id="atras" disabled>Atrás</button>
  <button id="rolBarra" class="cambiarRol">Rol</button>
  <button id="otroBarra" class="cambiarRol">Otro</button>
</div>

<div id="pila"></div>

<div id="fin">
  <h2 id="finTitulo">Tanda terminada</h2>
  <div class="inc" id="finTexto"></div>
  <button id="mandarFin" style="background:var(--rojo);color:#fff;border:0">Mandar mis tiempos</button>
  <button id="alMenu">Elegir otra tanda</button>
  <button id="reiniciar" class="otro">Repetir esta tanda</button>
</div>

<div id="pie">
  <button id="saltar">Incidencia</button>
  <button id="hecho">Listo</button>
</div>

<script>
/* Billy's — recogida en el móvil.
 *
 * Una tarjeta por COMPRADOR, no por prenda: el que recoge junta todas las
 * prendas de una persona y se las pasa al que empaqueta. Los números van en
 * orden ascendente para hacer una sola barrida del perchero por paquete.
 *
 * SE ELIGE TANDA AL EMPEZAR. Es lo que permite que dos personas trabajen a la
 * vez sin pisarse: cada una abre el mismo enlace en su móvil y coge una tanda
 * distinta. El avance se guarda POR TANDA y en el propio teléfono, así que
 * nadie ve ni toca el progreso del otro.
 *
 * Los datos pueden llegar por dos caminos:
 *   1. EMBEBIDOS en el archivo — lo que sirve el servidor local de la tienda.
 *   2. EN EL ENLACE, detrás de la almohadilla — lo que se manda por WhatsApp.
 *
 * Lo de la almohadilla no es un capricho: el navegador NUNCA manda al servidor
 * lo que va detrás del '#'. La página puede estar en internet y los nombres y
 * pedidos de los clientes no salen del móvil de quien abre el enlace.
 */
const EMBEBIDOS = /*DATOS*/{"titulo":"Sin datos","generado":"","tandas":[]}/*FIN*/;

const $ = (id) => document.getElementById(id);
/* Los nombres los escriben ellos a mano. Escapar es barato y evita que un
   apostrofe o un "<" deje la pantalla en blanco a mitad de turno. */
const esc = (x) => String(x == null ? '' : x).replace(/[&<>"]/g,
  (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
let DATOS = EMBEBIDOS;
let tandaActual = null;      // índice de la tanda elegida
let FICHAS = [];             // compradores de esa tanda
let i = 0, historial = [], incidencias = [];

/* EL MODO ES LO QUE DA SENTIDO AL RELOJ.
 *   recoge     -> su "Listo" es ABRIR el paquete: se lo pasa al de al lado.
 *   empaqueta  -> su "Listo" es CERRARLO.
 * Los dos recorren la MISMA lista en el MISMO orden, cada uno en su movil y a
 * su ritmo. Al final se cruzan por comprador, que es una clave estable, y de
 * ahi salen los minutos por paquete y el cuello de botella. */
let MODO = localStorage.getItem('billys_modo') || '';
let QUIEN = localStorage.getItem('billys_quien') || '';
let MARCAS = [];   // [{pedido, apodo, t, estado}] de este movil, este dia

// ------------------------------------------------------------------ datos
function deBase64url(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  const bin = atob(s), b = new Uint8Array(bin.length);
  for (let k=0;k<bin.length;k++) b[k] = bin.charCodeAt(k);
  return b;
}
async function desdeEnlace(){
  const h = (location.hash || '').slice(1);
  if (h.length < 8) return null;
  try {
    const bytes = deBase64url(h.slice(1));
    if (h[0] === 'z' && typeof DecompressionStream !== 'undefined') {
      const ds = new DecompressionStream('gzip');
      const w = ds.writable.getWriter(); w.write(bytes); w.close();
      return JSON.parse(new TextDecoder().decode(await new Response(ds.readable).arrayBuffer()));
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch(e){ console.warn('enlace ilegible', e); return null; }
}

/* DESDE EL SERVIDOR.
 *
 * El enlace con los datos dentro seguirá funcionando siempre —es el plan B si
 * un día no hay internet en el almacén, y así nadie se queda tirado—, pero lo
 * normal pasa a ser esto: la dirección se guarda una vez en la pantalla de
 * inicio y ya no cambia nunca.
 *
 *     /recogida?d=CODIGO
 *
 * Sin el código no se devuelve nada: es lo único que separa los nombres de los
 * compradores de cualquiera que teclee la dirección.
 */
const CODIGO = new URLSearchParams(location.search).get('d') || '';
let GENERADO = null;      // el sello de lo que estamos usando ahora mismo
let PENDIENTE = null;     // datos nuevos que aún no toca meter

async function desdeApi(){
  if (!CODIGO) return null;
  try {
    const r = await fetch('/api/tandas?d=' + encodeURIComponent(CODIGO), { cache: 'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    if (!j || !j.hay || !j.datos || !(j.datos.tandas || []).length) return null;
    j.datos.generado = j.datos.generado || j.generado;
    /* EL DÍA AL QUE PERTENECEN ESTAS TANDAS. Es lo que separa el avance de hoy
       del de ayer; sin esto, el móvil abría las tandas de hoy con las palomitas
       verdes del día anterior puestas. */
    j.datos.dia = j.dia || j.datos.dia || '';
    return j.datos;
  } catch(e){ console.warn('sin servidor', e); return null; }
}

/* NO SE LE CAMBIA LA PANTALLA A NADIE A MEDIO PAQUETE.
 *
 * Mientras alguien recoge, imprimimos otra tanda y el servidor cambia. Si la
 * app se recargara sola en ese momento, quien está a mitad de un paquete vería
 * cambiar los números en la mano. Así que lo nuevo espera guardado y entra
 * cuando esa persona vuelve al menú, que es el único momento en que no está
 * haciendo nada. */
async function mirarSiHayNuevo(){
  if (!CODIGO || document.hidden) return;
  const d = await desdeApi();
  if (!d || d.generado === GENERADO) return;
  PENDIENTE = d;
  if ($('menu').classList.contains('on')) verMenu();   // el menú se sirve solo
}

/* ===========================================================================
 * EL AVANCE SE GUARDA POR DÍA, NO POR TÍTULO
 * ===========================================================================
 * Cada móvil guarda por dónde va en su propia tanda. La clave llevaba el
 * TÍTULO del día, y el título se repite —"Recogida", el nombre del directo—,
 * así que el 15 ago 2026 el almacén abrió las tandas de hoy y le salieron
 * todas con el ✓ verde y la barra llena: era el avance de ayer.
 *
 * Ahora la clave lleva el DÍA. Y al arrancar se tira lo de los días
 * anteriores, que además no cabe eternamente en un móvil.
 * ========================================================================= */
const diaDatos = () => DATOS.dia || (DATOS.generado || '').slice(0, 10) || 'suelto';
const claveDe = (ti) => 'billys_rec_' + diaDatos() + '_t' + ti;
/* LAS MARCAS SON DE LA PERSONA, NO DEL MÓVIL.
   La clave llevaba solo día y rol, así que en una tablet compartida el que
   entraba después heredaba las marcas del anterior, y al pulsar "Mandar mis
   tiempos" se apuntaban todas a su nombre. Justo lo contrario de para lo que
   existe el botón de cambiar trabajador. */
const claveMarcas = () => 'billys_marcas_' + diaDatos() + '_' + MODO + '_' + (QUIEN || '').trim().toLowerCase();
const cargarMarcas = () => {
  try{ MARCAS = JSON.parse(localStorage.getItem(claveMarcas()) || '[]'); }catch(e){ MARCAS = []; }
};

function guardar(){
  if (tandaActual === null) return;
  try{ localStorage.setItem(claveDe(tandaActual), JSON.stringify({i,historial,incidencias})); }catch(e){}
  try{ localStorage.setItem(claveMarcas(), JSON.stringify(MARCAS)); }catch(e){}
}
function leer(ti){
  try{ return JSON.parse(localStorage.getItem(claveDe(ti)) || 'null'); }catch(e){ return null; }
}

/* Fuera lo de días que ya no son. Se hace una vez al arrancar y en silencio:
   si falla, no pasa nada, es basura que ocupa sitio. */
function tirarLoViejo(){
  const hoy = diaDatos();
  try {
    const fuera = [];
    for (let k = 0; k < localStorage.length; k++) {
      const clave = localStorage.key(k);
      if (!clave) continue;
      const esAvance = clave.startsWith('billys_rec_');
      const esMarcas = clave.startsWith('billys_marcas_');
      if (!esAvance && !esMarcas) continue;
      if (clave.indexOf('_' + hoy + '_') === -1 && !clave.startsWith('billys_rec_' + hoy + '_')
          && !clave.startsWith('billys_marcas_' + hoy + '_')) fuera.push(clave);
    }
    for (const k of fuera) localStorage.removeItem(k);
  } catch(e){}
}

// ------------------------------------------------------------------ menú
function verMenu(){
  /* Si llegaron tandas nuevas mientras alguien empaquetaba, entran aquí: al
   * volver al menú no está a medias de nada. */
  if (PENDIENTE) { DATOS = PENDIENTE; GENERADO = PENDIENTE.generado; PENDIENTE = null;
                   document.title = 'Recogida · ' + DATOS.titulo; }
  tandaActual = null;
  ['barra','pila','pie','fin'].forEach(x => $(x).classList.remove('on'));
  $('menu').classList.add('on');
  $('menuTitulo').textContent = DATOS.titulo || 'Recogida';
  const total = DATOS.tandas.reduce((s,t) => s + t.compradores.length, 0);
  $('menuSub').textContent = total + ' paquetes · elige tu tanda';
  /* La fecha se enseñaba en crudo, tipo 2026-08-15T16:15:59.924Z. Lo que hace
     falta saber es de cuándo son estas tandas, y eso se lee mejor en hora. */
  const cuandoSalio = (() => {
    if (!DATOS.generado) return '';
    const d = new Date(DATOS.generado);
    if (isNaN(d)) return 'Generado ' + DATOS.generado;
    const hoyEs = new Date().toDateString() === d.toDateString();
    const hora = d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' });
    return hoyEs ? 'Tandas de hoy, calculadas a las ' + hora
                 : 'Tandas del ' + d.toLocaleDateString('es-ES') + ', ' + hora;
  })();
  $('menuPie').innerHTML = cuandoSalio +
    (MARCAS.length ? '<br><button id="mandarTiempos" style="margin-top:14px;width:100%;padding:14px;' +
      'border-radius:12px;border:0;background:var(--rojo);color:#fff;font:inherit;font-weight:800;' +
      'font-size:15px;cursor:pointer">Mandar mis tiempos (' + MARCAS.length + ')</button>' : '') +
    /* EL SEGURO. Comprueba paquete a paquete que todo lo que has deslizado está
       de verdad en la cola, y mete lo que falte. Existe porque un paquete que no
       llegó no deja ni rastro en el móvil: sin esto, la única forma de
       enterarse era que alguien lo echara de menos al final del día. */
    (MARCAS.length && MODO
      ? '<button id="comprobarCola" style="margin-top:8px;width:100%;padding:12px;' +
        'border-radius:12px;border:1.5px solid var(--linea,rgba(237,231,219,.2));background:transparent;' +
        'color:inherit;font:inherit;font-weight:700;font-size:14px;cursor:pointer">' +
        (MODO === 'empaqueta'
          ? 'Comprobar que están apuntados todos mis cierres'
          : 'Comprobar que están todos en la cola') + '</button>' : '');
  const mt = $('mandarTiempos');
  if (mt) mt.addEventListener('click', mandarTiempos);
  const cc = $('comprobarCola');
  if (cc) cc.addEventListener('click', async () => {
    cc.disabled = true; cc.textContent = 'Comprobando…';
    await reenviarTodo(true);
    cc.disabled = false; cc.textContent = 'Comprobar que están todos en la cola';
  });
  pintarQuienSoy();

  pintarTandas();
  mirarTandas();
}

/* ===========================================================================
 * DOS RECOGEDORES SIN PISARSE
 *
 * Repartir de una en una, como con los que empaquetan, aqui haria lo contrario
 * de lo que hace falta: quien recoge necesita ver la tanda ENTERA para hacer
 * una sola barrida del perchero en orden de numero. Darle un paquete suelto
 * cada vez le obligaria a ir y volver por el mismo rack.
 *
 * Asi que el reparto es POR TANDAS. La primera persona que entra en una se la
 * queda, y a la otra le sale marcada con quien la lleva y por donde va. No es
 * un candado: se puede entrar igual, pero preguntando antes, porque a veces
 * alguien se va a mitad y hay que terminarsela.
 * ========================================================================= */
let TANDAS_TOMA = [];      // [{tanda, quien, hechos, total, fria}]

const tomaDe = (t) => TANDAS_TOMA.find((x) => x.tanda === t.etiqueta);

function pintarTandas(){
  $('tandas').innerHTML = DATOS.tandas.map((t, ti) => {
    const g = leer(ti);
    const hechos = g ? g.i : 0;
    const n = t.compradores.length;
    const lista = hechos >= n;
    const prendas = t.compradores.reduce((s,c) => s + c.numeros.length, 0);
    /* Solo se marca si la lleva OTRA persona y sigue viva. La tuya no se marca:
       ya sabes que es tuya y ensuciaria la pantalla. */
    const toma = tomaDe(t);
    const deOtro = toma && toma.quien && toma.quien !== QUIEN && !toma.fria;
    return `<button class="tandaBtn ${lista?'lista':''} ${deOtro?'deOtro':''}" data-t="${ti}">
      <div class="tt">${t.etiqueta}</div>
      <div class="dd">${n} ${n===1?'paquete':'paquetes'} · ${prendas} prendas${
        hechos ? ' · <b>' + hechos + ' hechos</b>' : ''}</div>
      ${racksDeTanda(t)}
      ${deOtro ? `<span class="ocupada">la lleva ${esc(toma.quien)}${
        toma.total ? ' · ' + toma.hechos + ' de ' + toma.total : ''}</span>` : ''}
      ${lista ? '<div class="tick">✓</div>' : ''}
      <div class="pp" style="width:${n?Math.round(hechos/n*100):0}%"></div>
    </button>`;
  }).join('');
}

let relojTandas = null;
async function mirarTandas(){
  clearInterval(relojTandas);
  if (!CODIGO || !$('menu').classList.contains('on')) return;
  relojTandas = setInterval(mirarTandas, 15000);
  try {
    const r = await fetch('/api/cola?d=' + encodeURIComponent(CODIGO), { cache:'no-store' });
    const j = await r.json();
    if (j && j.ok) {
      TANDAS_TOMA = j.tandas || [];
      apuntarNombres(j);
      pintarTandas();
      /* Los nombres llegan del servidor, así que las fichas de nombres hay que
         volver a pintarlas cuando llegan: si no, no aparecen hasta que algo
         más repinte la pantalla. */
      pintarQuienSoy();
    }
  } catch(e){ /* sin red: se ve como siempre y a trabajar */ }
}

/* Se avisa al servidor de por donde voy. Cada avance, sin miedo: es una fila
   que se sobreescribe, no un historico. */
async function apuntarTanda(etiqueta, hechos, total, forzar){
  if (!CODIGO || MODO !== 'recoge' || !QUIEN.trim()) return null;
  try {
    const r = await fetch('/api/cola?d=' + encodeURIComponent(CODIGO), {
      method:'POST', headers:{'Content-Type':'application/json'}, cache:'no-store',
      body: JSON.stringify({ accion:'tanda', quien: QUIEN, tanda: etiqueta,
                             hechos, total, forzar: !!forzar })
    });
    return await r.json();
  } catch(e){ return null; }
}

/* QUE HAY DE CADA RACK EN CADA TANDA.
 *
 * Dentro de una tanda las tarjetas van rack a rack: primero todas las de una
 * cuenta y luego las de la otra. Eso esta bien para recoger —una barrida de
 * cada rack— pero engaña al mirar: pasas cinco tarjetas, todas del mismo rack,
 * y das por hecho que del otro no hay ninguna. Pasó el 11 ago 2026 con
 * billystourvlc, que tenia 7 tarjetas al final de la tanda 1.
 *
 * Asi que la cuenta se dice ANTES de entrar, en el boton de la tanda, con
 * cuantas tarjetas hay de cada una. Con una sola cuenta no se pinta. */
function racksDeTanda(t){
  if (!DATOS.variasCuentas) return '';
  const m = new Map();
  for (const c of t.compradores) {
    for (const g of (c.porCuenta || [])) {
      if (!g.numeros || !g.numeros.length) continue;
      const k = g.cuenta || 'sin cuenta';
      if (!m.has(k)) m.set(k, { tarjetas: 0, prendas: 0 });
      const e = m.get(k);
      e.tarjetas++; e.prendas += g.numeros.length;
    }
  }
  if (m.size < 2) {
    // Una sola cuenta en esta tanda: se dice cual, que es justo el dato que
    // falta cuando alguien busca la otra y no la encuentra.
    const [k] = [...m.keys()];
    return k ? `<div class="racks"><span class="rk">${k}</span></div>` : '';
  }
  return `<div class="racks">${[...m.entries()]
    .map(([k, e]) => `<span class="rk">${k} · <b>${e.tarjetas}</b></span>`).join('')}</div>`;
}

/* ---------------------------------------------------- quien soy y que hago */
function pintarQuienSoy(){
  $('miNombre').value = QUIEN;
  /* Quién anda hoy por aquí: un toque en tu nombre en vez de escribirlo. */
  $('nombresHoy').innerHTML = NOMBRES_HOY.length
    ? NOMBRES_HOY.map((n) => '<button data-n="' + esc(n) + '"' +
        (sinAdornos(n) === sinAdornos(QUIEN) ? ' class="yo"' : '') + '>' + esc(n) + '</button>').join('')
    : '';
  for (const b of document.querySelectorAll('.modoBtn')) b.classList.toggle('on', b.dataset.m === MODO);
  const listo = !!(QUIEN.trim() && MODO);
  $('tandas').classList.toggle('bloqueado', !listo);
  /* LOS DOS CAMINOS, NO UNO.
   *
   * 18 ago 2026: al meter la cola le quité la lista al que empaqueta —"ya no
   * recorre tandas, pide paquetes"— y con eso le quité el gesto de toda la
   * vida: deslizar y dar a Listo. Se cerraron diecinueve paquetes de verdad,
   * encima de la mesa, y en el servidor no había ni uno: el recogedor no los
   * había empujado, así que desde la cola no había nada que cerrar. Sin
   * nombres, sin horas, sin forma de saber que esa gente había trabajado.
   *
   * Ahora tiene los dos: el botón de la cola —que sigue siendo la forma buena
   * de repartir cuando hay tres personas doblando— y la lista debajo, donde su
   * Listo CIERRA el paquete aunque nadie lo hubiera metido en la cola. La
   * lista no puede dejar a nadie sin poder decir "este ya está". */
  const conCola = listo && MODO === 'empaqueta' && !!CODIGO;
  $('tandas').style.display = '';
  $('irCola').style.display = conCola ? '' : 'none';
  /* El botón dice lo que hace. Para quien recoge, "Listo" es entregarlo; para
     quien empaqueta, es cerrarlo, y llamarlo igual es como se cierran paquetes
     creyendo que solo se están pasando. */
  $('hecho').textContent = MODO === 'empaqueta' ? 'Paquete cerrado' : 'Listo';
  $('ayudaModo').innerHTML = !listo
    ? 'Pon tu nombre y elige qué haces. Sin eso no puedo medir a nadie.'
    : (MODO === 'recoge'
        ? 'Tu <b>Listo</b> significa: <b>paquete entregado</b> al que empaqueta. Ahí arranca su reloj.'
        : 'Tu <b>Listo</b> significa: <b>paquete cerrado</b>, y queda a tu nombre. Puedes pedir ' +
          'de la <b>cola</b> o ir por la lista de tandas, como siempre.');
}

/* =========================================================================
   LA COLA DE EMPAQUETADO
   =========================================================================
   Antes los dos —el que recoge y el que empaqueta— recorrian la MISMA lista,
   cada uno en su movil, y se cruzaban al final. Eso vale para una pareja fija.
   No vale para un recogedor y tres personas doblando, que es como se trabaja:
   no hay forma de que los tres sepan cual coger sin gritarselo, y dos acaban
   haciendo el mismo paquete.

   Ahora el recogedor EMPUJA: cada vez que desliza, ese paquete entra en la
   cola del servidor. Los que empaquetan no eligen, piden. El reparto lo hace
   Postgres con FOR UPDATE SKIP LOCKED, que es lo unico que garantiza que dos
   moviles que pulsan a la vez se lleven paquetes distintos.
   ========================================================================= */
let PAQ = null;               // el paquete que tengo ahora mismo en la mesa
/* Lo que contestó el servidor la última vez que pedí y no había nada: cuántos
   están abiertos en otros móviles y cuántos parados por incidencia. Sin esto la
   pantalla dice "no hay paquetes esperando" con trabajo sin hacer delante. */
let NADA = null;

async function apiCola(cuerpo){
  const r = await fetch('/api/cola?d=' + encodeURIComponent(CODIGO), {
    method:'POST', headers:{'Content-Type':'application/json'}, cache:'no-store',
    body: JSON.stringify(cuerpo)
  });
  return r.json();
}

function verCola(){
  ['menu','barra','pila','pie','fin'].forEach(x => $(x).classList.remove('on'));
  $('cola').classList.add('on');
  pintarCola();
  refrescarContador();
  comprobarMio();
}

/* ===========================================================================
 * ¿EL PAQUETE QUE TENGO EN PANTALLA SIGUE SIENDO MÍO?
 * ===========================================================================
 * El móvil se guarda el paquete para que bloquear la pantalla no cueste
 * perderlo. Pero si estuvo doce minutos parado, el servidor se lo dio a otro
 * —eso es lo que hace el rescate de atascos— y este móvil seguía enseñándolo
 * como suyo. Dos personas haciendo el mismo paquete es exactamente lo que la
 * cola existe para evitar.
 *
 * Así que al entrar se pregunta. Y si ya no es suyo, se le dice quién lo
 * tiene: no se le quita de la pantalla en silencio.
 * ========================================================================= */
async function comprobarMio(){
  if (!PAQ || !PAQ.pedido || !CODIGO) return;
  try {
    const r = await fetch('/api/cola?d=' + encodeURIComponent(CODIGO), { cache:'no-store' });
    const j = await r.json();
    if (!j || !j.ok || !Array.isArray(j.paquetes)) return;
    const mio = j.paquetes.find((x) => x.pedido === PAQ.pedido);
    if (!mio) return;                                   // raro: mejor no tocar nada
    const sigueSiendoMio = mio.estado === 'haciendo' && mio.quien_cierra === QUIEN;
    if (sigueSiendoMio) return;
    const num = '#' + (mio.numero || PAQ.numero);
    PAQ = null;
    try{ localStorage.removeItem('billys_paq'); }catch(e){}
    pintarCola();
    alert(mio.estado === 'cerrado'
      ? 'El paquete ' + num + ' ya lo cerró ' + (mio.quien_cierra || 'otra persona') + '. Pide el siguiente.'
      : 'El paquete ' + num + ' ha pasado a ' + (mio.quien_cierra || 'la cola') +
        ': llevaba mucho rato abierto. Pide el siguiente.');
  } catch(e){ /* sin red: se queda como estaba, que es lo menos malo */ }
}

/* Cuantos quedan. Se mira al entrar y cada quince segundos: es lo que le dice
   a quien empaqueta si puede ir al bano o si tiene diez encima. */
let relojCola = null;
async function refrescarContador(){
  clearInterval(relojCola);
  relojCola = setInterval(refrescarContador, 15000);
  if (!$('cola').classList.contains('on')) { clearInterval(relojCola); return; }
  try {
    const r = await fetch('/api/cola?d=' + encodeURIComponent(CODIGO), { cache:'no-store' });
    const j = await r.json();
    if (!j || !j.ok) return;
    apuntarNombres(j);
    $('colaSub').innerHTML = j.espera + (j.espera === 1 ? ' paquete esperando · ' : ' paquetes esperando · ')
      + j.cerrado + ' hechos hoy'
      /* Un atascado es trabajo PARADO, no trabajo en marcha. Si no se dice,
         nadie lo mira y el paquete se queda ahi toda la tarde. */
      + (j.atascados ? ' · <b style="color:#E7C078">' + j.atascados +
          (j.atascados === 1 ? ' atascado' : ' atascados') + '</b>' : '')
      + (j.parado ? ' · <b style="color:#E7C078">' + j.parado +
          (j.parado === 1 ? ' parado' : ' parados') + '</b>' : '');
    pintarQueda(j.queda || []);
  } catch(e){ $('colaSub').textContent = 'Sin conexión con el servidor'; }
}

/* ===========================================================================
 * LO QUE QUEDA POR CERRAR
 * ===========================================================================
 * El 17 ago 2026 acabó el turno con 0 paquetes en espera, uno abierto desde
 * hacía media hora en un móvil que ya no estaba en el almacén y 21 paquetes
 * parados por incidencia. Y las pantallas decían "no hay paquetes esperando".
 * Nadie estaba escondiendo nada: simplemente no había ningún sitio donde
 * mirarlo.
 *
 * Esta lista es ese sitio. Todo lo que no está cerrado, con su número, en qué
 * estado está, quién lo tiene y desde cuándo. Y con el botón que hace falta en
 * cada caso: coger el que nadie cierra, o mandar a la cola la incidencia que ya
 * está resuelta. Nada de esto se hace solo: lo decide una persona que está
 * mirando el almacén.
 * ======================================================================== */
const hace = (t) => {
  if (!t) return '';
  const m = Math.round((Date.now() - new Date(t)) / 60000);
  return m < 1 ? 'ahora mismo' : (m < 60 ? 'hace ' + m + ' min' : 'hace ' + Math.floor(m / 60) + ' h ' + (m % 60) + ' min');
};
const laHora = (t) => {
  try { return new Intl.DateTimeFormat('es-ES', { hour:'2-digit', minute:'2-digit', timeZone:'Europe/Madrid' }).format(new Date(t)); }
  catch(e){ return ''; }
};

function pintarQueda(queda){
  const caja = $('colaQueda');
  /* El que tengo en la mesa no sale en la lista: ya lo estoy viendo arriba. */
  const otros = queda.filter((q) => !(PAQ && q.pedido === PAQ.pedido));
  if (!otros.length) { caja.innerHTML = ''; return; }
  const linea = (q) => {
    const quienTiene = q.estado === 'haciendo'
      ? 'lo tiene <b>' + esc(q.quien_cierra || '¿?') + '</b> ' + hace(q.tomado_en)
      : (q.estado === 'espera' ? 'esperando desde ' + laHora(q.abierto_en)
        : (q.estado === 'parado' ? (q.motivo ? esc(q.motivo) : 'incidencia sin resolver')
          : 'lo retiró ' + esc(q.quien_abrio || 'el recogedor')));
    /* DOS BOTONES, PORQUE HAY DOS SITUACIONES DISTINTAS.
     *
     * "Lo hago yo" es para ponerse a hacerlo. "Cerrado" es para el paquete que
     * YA está hecho y está en la mesa: el 18 ago 2026 se cerraron diecinueve
     * así, a mano, y no había ningún botón que dijera eso —había que cogerlo
     * primero y cerrarlo después, dos pasos para algo que ya estaba—, así que
     * no se apuntó ninguno. */
    const datos = ' data-p="' + esc(q.pedido) + '" data-n="' + q.numero + '"';
    const boton = q.estado === 'parado'
      ? '<button class="qResolver"' + datos + '>Ya está</button>'
      : (q.estado === 'retirado' ? ''
        : '<button class="qCerrar"' + datos + '>Cerrado</button>' +
          '<button class="qCoger"' + datos + '>Lo hago yo</button>');
    return '<div class="qLinea ' + q.estado + (q.atascado ? ' atascado' : '') + '">' +
      '<b>' + q.numero + '</b>' +
      '<span class="qq">' + esc(q.apodo || '') +
      '<small>' + quienTiene + ' · recogió ' + esc(q.quien_abrio || '¿?') + '</small></span>' +
      boton + '</div>';
  };
  const grupo = (titulo, lista) => lista.length
    ? '<h3>' + titulo + '</h3>' + lista.map(linea).join('') : '';
  caja.innerHTML =
    grupo('Sin cerrar', otros.filter((q) => q.estado === 'haciendo' || q.estado === 'espera')) +

function pintarCola(){
  const hay = !!PAQ;
  $('pedir').style.display      = hay ? 'none' : '';
  $('cerrarPaq').style.display  = hay ? '' : 'none';
  $('soltarPaq').style.display  = hay ? '' : 'none';
  $('colaCabecera').style.display = hay ? 'flex' : 'none';
  if (!hay){
    $('colaFicha').innerHTML = '<div id="colaVacia">' + (NADA
      ? (NADA.haciendo || NADA.parado
          ? 'Nadie tiene paquetes esperando, pero <b>todavía queda trabajo</b>:' +
            (NADA.haciendo ? '<br>' + NADA.haciendo +
              (NADA.haciendo === 1 ? ' abierto en otro móvil' : ' abiertos en otros móviles') : '') +
            (NADA.parado ? '<br>' + NADA.parado +
              (NADA.parado === 1 ? ' parado por incidencia' : ' parados por incidencia') : '') +
            '<br><br>Lo tienes aquí abajo.'
          : 'No hay paquetes esperando.<br>Vuelve a pulsar en un momento.')
      : 'Pulsa <b>Dame el siguiente</b> cuando estés libre.') + '</div>';
    return;
  }
  /* El numero de paquete es lo que se dicen en voz alta ("voy con el 12") y va
     en grande; el nombre debajo, para cantarlo al entregarlo. */
  $('colaNum').textContent = '#' + PAQ.numero;
  $('colaQuien').textContent = PAQ.apodo || '';
  /* Un rescatado puede estar a medio hacer sobre la mesa de otro. Decirlo es
     la diferencia entre rehacerlo y meter la mitad de las prendas. */
  /* QUIÉN TE LO HA MANDADO Y CUÁNDO. Lo pidió Aaron el 17 ago 2026 y tiene todo
     el sentido: si en el paquete falta algo, hay que saber a quién preguntarle
     sin tener que gritar "¿de quién es el 12?" por el almacén. Y la hora dice si
     ese paquete lleva ahí cinco minutos o lleva una hora. */
  const de = PAQ.quien_abrio
    ? `<div class="deQuien">Lo recogió <b>${esc(PAQ.quien_abrio)}</b>` +
      (PAQ.abierto_en ? ` · ${laHora(PAQ.abierto_en)} (${hace(PAQ.abierto_en)})` : '') +
      (PAQ.tanda ? ` · ${esc(PAQ.tanda)}` : '') + '</div>'
    : '';
  $('colaFicha').innerHTML = de + (PAQ.rescatado
    ? `<div class="rescate">Este paquete lo tenía <b>${esc(PAQ.rescatado.loTenia)}</b>
        desde hace ${PAQ.rescatado.minutos} min y no lo cerró.
        <b>Compruébalo antes de cerrarlo</b>: puede estar a medias.</div>` : '')
    + (PAQ.motivo
      ? `<div class="rescate">Venía con incidencia: <b>${esc(PAQ.motivo)}</b>.
          Si sigue sin arreglarse, devuélvelo.</div>` : '')
    + tarjetaHTML(PAQ.ficha);

  /* EL DESLICE, TAMBIÉN AQUÍ. Es el gesto de siempre y en el móvil es el único
     que se hace sin mirar: derecha, cerrado; izquierda, devolverlo a la cola.
     Los botones siguen debajo para quien prefiera pulsar. */
  const tarj = $('colaFicha').querySelector('.tarjeta');
  if (tarj) {
    const so = tarj.querySelector('.sello.ok'), sn = tarj.querySelector('.sello.no');
    if (so) so.textContent = 'CERRADO';
    if (sn) sn.textContent = 'DEVOLVER';
    arrastrable(tarj, () => $('cerrarPaq').click(), () => $('soltarPaq').click());
  }
}

/* ===========================================================================
 * UN NOMBRE POR PERSONA
 * ===========================================================================
 * El 17 ago 2026 la misma chica trabajó como "yasmin" (8 paquetes) y "Yasmine"
 * (26). Para el programa eran dos: "¿este paquete es mío?" decía que no, el
 * rescate de atascos se lo quitaba a ella misma y los recuentos del día salían
 * partidos en dos personas que no existen.
 *
 * Se arregla por los dos lados. El servidor compara sin mayúsculas. Y aquí, al
 * escribir el nombre, si ya hay alguien trabajando hoy que se llama igual
 * —da igual cómo lo escribiera—, se adopta SU forma de escribirlo. Sin
 * preguntar nada: quien está poniendo su nombre en una tablet a media mañana no
 * quiere un diálogo, quiere ponerse a trabajar.
 * ======================================================================== */
let NOMBRES_HOY = [];                    // los que ya han tocado algo hoy

/* ¿ESTO ES LA MISMA PERSONA ESCRITA DE OTRA MANERA?
 *
 * "yasmin" y "Yasmine" no son el mismo texto ni quitando mayúsculas: sobra una
 * letra. Así que se mira si uno empieza como el otro (yasmin / yasmine, ana /
 * anna no) o si se diferencian en una sola letra cambiada, y se PREGUNTA. No se
 * decide solo: "Ana" y "Anna" pueden ser dos personas de verdad, y fusionar a
 * dos trabajadoras por su cuenta sería peor que tener dos nombres.
 *
 * Se comparan sin acentos, porque "Belén" y "Belen" son la misma sin discusión.
 */
function sinAdornos(s){
  return String(s || '').trim().toLowerCase()
    .normalize('NFD').replace(/[̀-ͯ]/g, '');
}
function pareceElMismo(a, b){
  const x = sinAdornos(a), y = sinAdornos(b);
  if (!x || !y) return false;
  if (x === y) return true;
  if (x.length < 3 || y.length < 3) return false;
  /* Uno es el principio del otro y lo que sobra son una o dos letras: yasmin /
     yasmine, anny / annye. Con más de dos letras de diferencia ya no. */
  const largo = x.length > y.length ? x : y, corto = x.length > y.length ? y : x;
  if (largo.startsWith(corto) && largo.length - corto.length <= 2) return true;
  /* Una sola letra distinta en el mismo sitio: heikelin / heikelyn. */
  if (x.length === y.length) {
    let d = 0;
    for (let k = 0; k < x.length; k++) if (x[k] !== y[k]) d++;
    if (d === 1) return true;
  }
  return false;
}
/* Se rellena con cualquier respuesta de /api/cola, que ya se pide cada quince
   segundos en las dos pantallas. No hace falta preguntar nada aparte. */
function apuntarNombres(j){
  const vistos = new Map(NOMBRES_HOY.map((n) => [n.trim().toLowerCase(), n]));
  for (const n of [...(j.tandas || []).map((t) => t.quien),
                   ...(j.gente || []).map((g) => g.quien),
                   ...(j.paquetes || []).flatMap((p) => [p.quien_abrio, p.quien_cierra])]) {
    const k = String(n || '').trim().toLowerCase();
    if (k && !vistos.has(k)) vistos.set(k, String(n).trim());
  }
  NOMBRES_HOY = [...vistos.values()];
}
const comoSeEscribe = (n) => {
  const puesto = String(n || '').trim();
  if (!puesto) return '';
  /* Igual salvo mayúsculas o acentos: se adopta sin preguntar. */
  const clavado = NOMBRES_HOY.find((x) => sinAdornos(x) === sinAdornos(puesto));
  if (clavado) return clavado.trim();
  /* Parecido: se pregunta una vez. Un toque y se acabó el "yasmin" y
     "Yasmine" trabajando por separado el mismo día. */
  const parecido = NOMBRES_HOY.find((x) => pareceElMismo(x, puesto));
  if (parecido && confirm('Hoy ya está trabajando ' + parecido + '.\n\n¿Eres tú?\n\n' +
      'Si le das a Aceptar, tus paquetes van con los de ' + parecido + '. ' +
      'Si eres otra persona, dale a Cancelar y déjalo como "' + puesto + '".')) {
    return parecido.trim();
  }
  return puesto;
};
