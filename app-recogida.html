async function abrirTanda(ti){
  const t = DATOS.tandas[ti];

  /* ANTES DE ENTRAR, PREGUNTAR SI LA LLEVA OTRO. No se prohibe —a veces hay
     que terminar la de alguien que se fue— pero se dice, que es lo que hoy no
     pasaba: las dos entraban y recogian las mismas prendas. */
  if (CODIGO && MODO === 'recoge' && QUIEN.trim()) {
    const g0 = leer(ti);
    const r = await apuntarTanda(t.etiqueta, g0 ? g0.i : 0, t.compradores.length, false);
    if (r && r.ok && !r.mia) {
      const va = r.total ? ' (va por ' + r.hechos + ' de ' + r.total + ')' : '';
      if (!confirm('Esta tanda la está haciendo ' + r.quien + va +
                   '.\n\n¿Entras tú también? Recogeríais las mismas prendas.')) {
        mirarTandas();
        return;
      }
      await apuntarTanda(t.etiqueta, g0 ? g0.i : 0, t.compradores.length, true);
    }
  }

  clearInterval(relojTandas);
  tandaActual = ti;
  FICHAS = DATOS.tandas[ti].compradores.slice();
  const g = leer(ti);
  if (g && g.i > 0 && g.i < FICHAS.length &&
      confirm('Esta tanda está empezada por el paquete ' + (g.i+1) + ' de ' + FICHAS.length + '. ¿Sigues?')) {
    i = g.i; historial = g.historial || []; incidencias = g.incidencias || [];
  } else {
    i = 0; historial = []; incidencias = [];
  }
  $('menu').classList.remove('on');
  ['barra','pila','pie'].forEach(x => $(x).classList.add('on'));
  pintar();
}

// --------------------------------------------------------------- tarjetas
const claseNum = (n) => n===1 ? 'solo' : (n<=6 ? 'pocos' : 'muchos');

/* LOS NUMEROS DE LA TARJETA.
 *
 * Desde el 11 ago 2026 hay dos cuentas emitiendo contra el mismo almacen y
 * CADA UNA NUMERA SUS FICHAS DESDE EL 1: el 19 de una y el 19 de la otra son
 * dos prendas distintas, en racks distintos. Por eso los numeros van bajo el
 * nombre de su cuenta, que es el rack donde estan.
 *
 * EL ROTULO SE PONE SI ESE DIA HUBO DOS CUENTAS, no si esta tarjeta tiene
 * dos. Una tarjeta con una sola prenda de billystourvlc lo necesita igual: un
 * "90" suelto, con dos racks delante, no dice a cual ir, y adivinar es coger
 * la prenda de otra persona. Lo que no se pinta nunca es una cuenta vacia.
 *
 * Si ese dia solo emitio una cuenta, `variasCuentas` va en false y la tarjeta
 * es exactamente la de siempre: los numeros solos, sin rotulo que no
 * distingue nada y que ademas come altura, que es lo que mas escasea aqui.
 *
 * `porCuenta` puede no venir: un enlace generado con la version anterior solo
 * trae `numeros`. En ese caso se pinta la fila de siempre. */
function bloqueNumeros(f){
  const c = claseNum(f.numeros.length);
  const chips = (nums) => `<div class="numeros">${nums.map(n=>`<span class="n ${c}">${n}</span>`).join('')}</div>`;
  const g = (f.porCuenta || []).filter(x => x.numeros && x.numeros.length);
  if (!g.length || (!DATOS.variasCuentas && g.length < 2)) return chips(f.numeros);
  return `<div class="grupos">${g.map(x => `<div class="grupo">
      <div class="rack">${x.cuenta || 'sin cuenta'}</div>
      ${chips(x.numeros)}
    </div>`).join('')}</div>`;
}

/* EL DETALLE QUE HAY QUE METER EN LA BOLSA.
 *
 * Quien gana un regalo en el directo se anuncia en pantalla… y hasta ahora
 * ahí se acababa: en el almacén nadie se enteraba y el detalle no se metía.
 * Va arriba del todo y en grande a propósito: si va abajo, con doce números
 * por delante, no se ve. */
function regaloHTML(f){
  const r = f.regalos || [];
  if (!r.length) return '';
  return `<div class="regalos">${r.map(x => `<span class="rg rg-${(x.tier||'').toLowerCase()}">
    ★ ${x.tier || 'regalo'}${x.num != null ? ' · ganó con la #' + x.num : ''}</span>`).join('')}</div>`;
}

function tarjetaHTML(f, cl){
  return `<div class="tarjeta ${cl||''}">
    <div class="sello ok">LISTO</div><div class="sello no">INCIDENCIA</div>
    ${regaloHTML(f)}
    <div class="nombre">${f.apodo}</div>
    <div class="usuario">${f.usuario||''}</div>
    ${bloqueNumeros(f)}
    <div class="cuantas">${f.numeros.length} ${f.numeros.length===1?'PRENDA':'PRENDAS'}</div>
    <div class="pedido">${f.pedido}</div>
  </div>`;
}

function pintar(){
  $('atras').disabled = !historial.length;
  $('tanda').textContent = DATOS.tandas[tandaActual].etiqueta;
  if (i >= FICHAS.length) { terminar(); return; }
  $('fin').classList.remove('on');
  $('pila').classList.add('on'); $('pie').classList.add('on');
  $('cuenta').textContent = (i+1) + ' / ' + FICHAS.length;
  $('barraProg').style.width = (i/FICHAS.length*100) + '%';
  $('pila').innerHTML = (FICHAS[i+2]?tarjetaHTML(FICHAS[i+2],'d2'):'') +
                        (FICHAS[i+1]?tarjetaHTML(FICHAS[i+1],'d1'):'') + tarjetaHTML(FICHAS[i]);
  arrastrable($('pila').lastElementChild);
}

function terminar(){
  const mf = $('mandarFin'); if (mf && !mf.__on) { mf.__on = 1; mf.addEventListener('click', mandarTiempos); }
  $('pila').innerHTML=''; $('pila').classList.remove('on'); $('pie').classList.remove('on');
  $('fin').classList.add('on');
  $('cuenta').textContent = FICHAS.length + ' / ' + FICHAS.length;
  $('barraProg').style.width = '100%';
  $('finTitulo').textContent = DATOS.tandas[tandaActual].etiqueta + ' · terminada';
  $('finTexto').innerHTML = incidencias.length
    ? '<b>' + incidencias.length + ' con incidencia:</b><br>' +
      incidencias.map(f => {
        const g = (f.porCuenta || []).filter(x => x.numeros && x.numeros.length);
        return f.apodo + ' — ' + (g.length && DATOS.variasCuentas
          ? g.map(x => (x.cuenta || 'sin cuenta') + ': ' + x.numeros.join(', ')).join(' · ')
          : f.numeros.join(', ')) +
          /* El motivo, aquí también: es la lista que se lee en voz alta al
             acabar la tanda para repartirse lo que falta. */
          (f.motivo ? ' <b>· ' + esc(f.motivo) + '</b>' : '');
      }).join('<br>') +
      '<br><br>Están en la cola <b>parados</b>, con su número. Cuando se arreglen, ' +
      'desde la pantalla de paquetes se les da a <b>Ya está</b> y vuelven a la cola.'
    : 'Los ' + FICHAS.length + ' paquetes de esta tanda están hechos.';
  guardar();
}

/* ===========================================================================
 * EL RECOGEDOR EMPUJA A LA COLA
 *
 * Se guarda primero en el movil y se manda despues. Si no hay cobertura, el
 * paquete se queda en la lista de pendientes y sale con el siguiente deslice:
 * el recogedor no se para nunca por culpa del wifi, y no hay ningun gesto que
 * repetir a mano.
 *
 * Se manda la ficha ENTERA porque quien empaqueta entra por un enlace que no
 * sabe nada de tandas: pide un paquete y tiene que recibir todo lo que
 * necesita para hacerlo.
 * ======================================================================== */
/* EL DÍA DE UNA MARCA ES EL DÍA EN QUE SE HIZO, NO EL DÍA EN QUE SE MANDÓ.
 *
 * El servidor, si no se le dice nada, apunta las cosas en SU hoy. Y eso está
 * mal para lo que se manda tarde: un paquete deslizado a las 23:50 que sale del
 * móvil a las 00:10 —porque volvió la cobertura, o porque alguien reabrió la
 * app— se guardaba en el día siguiente, en una cola vacía que nadie mira, y por
 * tanto no se empaquetaba nunca. Se manda el día de cada marca, calculado con la
 * hora de Valencia igual que lo hace el servidor. */
const diaMadrid = (t) => {
  try { return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Madrid' }).format(new Date(t)); }
  catch(e){ return null; }
};

const LLAVE_COLA = 'billys_cola_pend';
let PENDCOLA = [];
try { PENDCOLA = JSON.parse(localStorage.getItem(LLAVE_COLA) || '[]'); } catch(e){ PENDCOLA = []; }
const guardarPend = () => { try{ localStorage.setItem(LLAVE_COLA, JSON.stringify(PENDCOLA)); }catch(e){} };

function aLaCola(f, cuando, incidencia, motivo){
  if (MODO !== 'recoge' && MODO !== 'empaqueta') return;
  PENDCOLA.push({
    /* QUÉ ES ESTE GESTO. El mismo deslice significa una cosa u otra según quién
       lo haga, y el móvil lo sella aquí para que no dependa de en qué modo esté
       la app cuando vuelva la cobertura:
         recoge    · el paquete ENTRA en la cola (o entra parado, si es incidencia)
         empaqueta · el paquete se CIERRA, esté o no en la cola
       La incidencia de quien empaqueta sí entra como incidencia, no como cierre:
       un paquete al que le falta una prenda no está hecho. */
    cierre: MODO === 'empaqueta' && !incidencia,
    pedido: f.pedido, apodo: f.apodo, prendas: f.numeros.length,
    tanda: (DATOS.tandas[tandaActual] || {}).etiqueta || '',
    /* QUIÉN LO DESLIZÓ, sellado aquí. Si el envío se queda esperando cobertura
       y mientras tanto se cambia de trabajador en la tablet, esos paquetes son
       del que los recogió, no del que estaba cuando volvió el wifi. */
    quien: QUIEN,
    /* UNA INCIDENCIA TAMBIÉN VA. Antes se quedaba en este móvil y en la
       pantalla de fin de tanda, y ahí se acababa: el 17 ago 2026 eso dejó 21
       paquetes recogidos que no existían para nadie más —ni cola, ni número, ni
       forma de saber que estaban ahí—. Ahora entra en la cola PARADA: no se le
       da a nadie para empaquetar, pero se ve y se puede resolver. */
    incidencia: !!incidencia,
    /* Qué le pasa, escrito por quien lo vio. Sin esto un paquete parado es un
       paquete parado sin motivo, y eso no lo resuelve nadie. */
    motivo: motivo || '',
    dia: diaMadrid(cuando),
    ficha: f, en: new Date(cuando).toISOString()
  });
  guardarPend();
  vaciarCola();
}

/* ===========================================================================
 * "ESTE YA LO HA RECOGIDO OTRO"
 * ===========================================================================
 * El 17 ago 2026 hubo 124 marcas de recogida sobre 73 paquetes: dos personas
 * recorrieron las mismas tandas sin saberlo. Para la segunda, deslizar no hacía
 * nada visible —el paquete ya estaba en la cola— así que desde su móvil parecía
 * que su deslice se perdía. Es la otra mitad de lo que se veía como "se saltan
 * pedidos", y además son dos personas haciendo el mismo trabajo.
 *
 * Se avisa UNA vez por paquete y sin bloquear nada: quien recoge no puede
 * pararse a leer diálogos, pero sí tiene que saber que esa tanda ya está hecha.
 * ======================================================================== */
const YA_AVISADO = new Set();
function avisarDeOtro(lista, delEnvio, cerrando){
  if (!Array.isArray(lista) || !lista.length) return;
  const nuevos = lista.filter((x) => delEnvio.has(x.pedido) && !YA_AVISADO.has(x.pedido));
  if (!nuevos.length) return;
  for (const x of nuevos) YA_AVISADO.add(x.pedido);
  const quien = nuevos[0].quien;
  /* Cerrando, el aviso es otro: el paquete lo tenía abierto otra persona en su
     móvil. Se cierra igual —está hecho, lo tienes delante— pero hay que decirlo
     para que no lo estén doblando dos. */
  if (cerrando) {
    decir(nuevos.length === 1
      ? 'El nº' + nuevos[0].numero + ' lo tenía abierto ' + quien +
        '. Lo he cerrado a tu nombre; dile que ya está.'
      : nuevos.length + ' de los que acabas de cerrar los tenía abiertos ' + quien +
        '. Los he cerrado a tu nombre; decídselo.');
    return;
  }
  const aviso = nuevos.length === 1
    ? 'El paquete de ' + (nuevos[0].apodo || 'ese comprador') + ' ya lo había recogido ' +
      quien + ' (nº' + nuevos[0].numero + ').'
    : nuevos.length + ' de los paquetes que acabas de pasar ya los había recogido ' + quien + '.';
  decir(aviso + ' Mira en el menú qué tandas lleva cada uno antes de seguir: estáis haciendo la misma.');
}

/* Un aviso que no para el trabajo. Se ve tres segundos y se va. */
function decir(texto){
  let caja = document.getElementById('avisoSuave');
  if (!caja) {
    caja = document.createElement('div');
    caja.id = 'avisoSuave';
    document.body.appendChild(caja);
  }
  caja.textContent = texto;
  caja.classList.add('on');
  clearTimeout(decir.reloj);
  decir.reloj = setTimeout(() => caja.classList.remove('on'), 6000);
}

let vaciando = false;
async function vaciarCola(){
  if (vaciando || !PENDCOLA.length || !CODIGO) return;
  vaciando = true;
  /* Se manda una tanda por persona Y POR DÍA: el servidor apunta un solo nombre
     y un solo día por envío, así que mezclarlos le colgaría a uno el trabajo del
     otro, o metería en el día de hoy un paquete de anoche. */
  const dueno = PENDCOLA[0].quien || QUIEN;
  const cuando = PENDCOLA[0].dia || null;
  /* Y por GESTO: meter y cerrar no se pueden mezclar en el mismo envío. */
  const cerrando = !!PENDCOLA[0].cierre;
  const mismo = (x) => (x.quien || QUIEN) === dueno && (x.dia || null) === cuando &&
                       !!x.cierre === cerrando;
  const iban = PENDCOLA.filter(mismo);
  try {
    const r = await fetch('/api/cola?d=' + encodeURIComponent(CODIGO), {
      method:'POST', headers:{'Content-Type':'application/json'}, cache:'no-store',
      body: JSON.stringify({ accion: cerrando ? 'cerrarLista' : 'meter',
                             quien: dueno, dia: cuando, paquetes: iban })
    });
    const j = await r.json();
    if (j && j.ok) {
      /* Solo se quitan los que iban en ESTE envio: mientras volaba puede
         haberse deslizado otro y no hay que tragarselo sin mandarlo. */
      const fuera = new Set(iban.map((x) => x.pedido));
      PENDCOLA = PENDCOLA.filter((x) => !(fuera.has(x.pedido) && !!x.cierre === cerrando));
      guardarPend();
      avisarDeOtro(j.deOtro, fuera, cerrando);
    }
  } catch(e){ /* sin red: se queda pendiente y sale con el siguiente */ }
  vaciando = false;
  if (PENDCOLA.length) setTimeout(vaciarCola, 4000);
}
/* Por si el ultimo deslice del dia se quedo sin mandar. */
setInterval(vaciarCola, 20000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) vaciarCola(); });

/* ===========================================================================
 * REENVIAR TODO LO DESLIZADO · el seguro de "sí o sí tiene que estar en la cola"
 * ===========================================================================
 * Los pendientes se van de este móvil en cuanto el servidor dice "recibido", y
 * eso deja un agujero: si un paquete se deslizó cuando el enlace no llevaba
 * código, o si alguien vació el navegador, o si la app se cerró antes de que
 * volviera la cobertura, ESE paquete no vuelve a intentarse nunca. Y nadie se
 * enteraba, porque el móvil ya no lo tenía apuntado como pendiente.
 *
 * Aquí se manda otra vez TODO lo deslizado del día, no solo lo pendiente.
 * `meter` es idempotente: repetir un paquete que ya está en la cola no lo toca
 * —a lo mejor lo está haciendo alguien—, así que esto se puede pulsar cien
 * veces. Lo que no estaba, entra. Lo que estaba, se queda como está.
 *
 * La ficha se reconstruye de los datos del día, que están en este móvil: sin
 * ella el que empaqueta recibiría un nombre sin números de prenda.
 * ======================================================================== */
function fichaDe(pedido){
  for (const t of (DATOS.tandas || [])) {
    for (const c of (t.compradores || [])) if (c.pedido === pedido) return { ficha: c, tanda: t.etiqueta || '' };
  }
  return null;
}

async function reenviarTodo(avisar){
  if (!CODIGO) { if (avisar) alert('Este enlace no lleva el código del equipo, así que no puedo hablar con el servidor.'); return null; }
  if (!QUIEN.trim()) { if (avisar) alert('Pon tu nombre antes: la cola apunta quién recogió cada paquete.'); return null; }
  /* De las marcas de este móvil, que es el registro de lo que ha hecho esta
     persona: cada "Listo" y cada "Incidencia", con su hora de verdad. */
  /* Se agrupa por día Y POR GESTO: quien recoge manda "meter" y quien empaqueta
     manda "cerrarLista". Una incidencia siempre es "meter", la marque quien la
     marque: un paquete al que le falta una prenda no está cerrado. */
  const porEnvio = new Map();
  for (const m of MARCAS) {
    const f = fichaDe(m.pedido);
    const dia = diaMadrid(m.t);
    const cierre = MODO === 'empaqueta' && m.estado !== 'inc';
    const llave = dia + '|' + (cierre ? 'cerrar' : 'meter');
    if (!porEnvio.has(llave)) porEnvio.set(llave, { dia, cierre, paquetes: [] });
    porEnvio.get(llave).paquetes.push({
      pedido: m.pedido, apodo: m.apodo, prendas: m.prendas,
      tanda: f ? f.tanda : '', incidencia: m.estado === 'inc', motivo: m.motivo || '',
      ficha: f ? f.ficha : {}, en: new Date(m.t).toISOString(), dia
    });
  }
  if (!porEnvio.size) { if (avisar) alert('Todavía no has deslizado nada en este móvil.'); return null; }

  let metidos = 0, revueltos = 0, mandados = 0, creados = 0, fallo = false;
  for (const [, envio] of porEnvio) {
    try {
      const r = await fetch('/api/cola?d=' + encodeURIComponent(CODIGO), {
        method:'POST', headers:{'Content-Type':'application/json'}, cache:'no-store',
        body: JSON.stringify({ accion: envio.cierre ? 'cerrarLista' : 'meter',
                               quien: QUIEN, dia: envio.dia, paquetes: envio.paquetes })
      });
      const j = await r.json();
      if (j && j.ok) {
        metidos += (j.metidos || 0); revueltos += (j.revueltos || 0);
        creados += (j.creados || 0); mandados += envio.paquetes.length;
      } else fallo = true;
    } catch(e){ fallo = true; }
  }
  if (avisar) {
    const esCierre = MODO === 'empaqueta';
    alert(fallo
      ? 'No he podido hablar con el servidor con todo. Vuelve a pulsar en un momento.'
      : (esCierre
          ? 'Comprobado: los ' + mandados + ' paquetes que has cerrado están apuntados a tu nombre' +
            (creados ? ' (' + creados + ' no los había metido nadie en la cola y los he creado ya cerrados).' : '.')
          : (metidos + revueltos === 0
              ? 'Comprobado: los ' + mandados + ' paquetes que has deslizado ya estaban en la cola.'
              : 'Faltaban ' + (metidos + revueltos) + ' en la cola y ya están dentro (de ' + mandados + ' deslizados).')));
  }
  return { metidos, revueltos, creados, mandados, fallo };
}
/* Sin que nadie lo pulse: al volver a la app y de vez en cuando. Un paquete que
   falta en la cola no puede depender de que alguien se acuerde de un botón. */
setInterval(() => { if (MODO && MARCAS.length) reenviarTodo(false); }, 120000);

/* ===========================================================================
 * UNA INCIDENCIA SE EXPLICA EN UNA LÍNEA
 * ===========================================================================
 * Antes bastaba con deslizar a la izquierda y ya. El paquete se iba a
 * "incidencia" y nadie —ni el que empaqueta, ni el del turno siguiente, ni tú
 * mirándolo mañana— podía saber qué le pasaba. Con veintiún paquetes así en un
 * día, "hay incidencias" no es información: es un montón en el suelo.
 *
 * Así que se escribe. Una línea, la que sea: "falta la 214", "manchada", "no
 * está en el rack". Va con el paquete a la cola y es lo que se lee en la lista
 * de parados y en la pantalla de fin de tanda. Si no se escribe nada, el
 * paquete NO se marca y la tarjeta se queda donde estaba: es más barato volver
 * a deslizar que un paquete parado sin motivo.
 * ======================================================================== */
function marcarIncidencia(){
  if (i >= FICHAS.length) return;
  const f = FICHAS[i];
  const motivo = (prompt('¿Qué le pasa al paquete de ' + (f.apodo || 'este comprador') + '?\n\n' +
                         'Una línea basta: falta la 214, manchada, no está en el rack…') || '').trim();
  if (!motivo) { pintar(); return; }        // sin motivo no hay incidencia
  avanzar('inc', motivo.slice(0, 140));
}

function avanzar(estado, motivo){
  if (i >= FICHAS.length) return;
  const f = FICHAS[i];
  if (estado === 'inc') incidencias.push({ ...f, motivo: motivo || '' });
  /* La hora se sella AQUI, en el momento del gesto, y no se recalcula nunca.
     Es el unico dato que no se puede reconstruir despues. */
  const ahora = Date.now();
  MARCAS.push({ pedido: f.pedido, apodo: f.apodo, prendas: f.numeros.length,
                t: ahora, estado, motivo: motivo || '' });
  /* AQUI EMPIEZA LA COLA. Deslizar "Listo" ya no es solo una marca de tiempo:
     el paquete pasa a estar disponible para quien empaquete.
     Y LA INCIDENCIA TAMBIÉN ENTRA, parada: antes se quedaba solo en este móvil
     y por eso el 17 ago 2026 hubo 21 paquetes recogidos que no existían para
     nadie más. Parado no es lo mismo que invisible. */
  aLaCola(f, ahora, estado === 'inc', motivo);
  historial.push({i, estado}); i++;
  guardar(); pintar();
  /* Para que el otro vea en el menu por donde voy y no se meta aqui. */
  const tv = DATOS.tandas[tandaActual];
  if (tv) apuntarTanda(tv.etiqueta, i, FICHAS.length, false);
  if (navigator.vibrate) navigator.vibrate(estado==='inc' ? [12,40,12] : 18);
}
async function atras(){
  const h = historial.pop(); if (!h) return;
  if (h.estado === 'inc') incidencias.pop();
  const marca = MARCAS.pop();
  i = h.i; guardar(); pintar();

  /* DESHACER TIENE QUE LLEGAR A LA COLA.
     Antes esto solo borraba en el móvil: el paquete ya estaba empujado y quien
     empaqueta lo recibía igual, aunque aquí pusiera que no. Ahora se retira.
     Si ya se lo llevó alguien no se le quita de las manos: se avisa. */
  /* Deshacer una incidencia también tiene que llegar a la cola: ahora una
     incidencia está ahí, parada y con número, así que si se deshace hay que
     retirarla igual que un "Listo". */
  if (!marca || !CODIGO || (MODO !== 'recoge' && MODO !== 'empaqueta')) return;
  const pedido = marca.pedido;
  /* El "Atrás" de quien empaqueta deshace un CIERRE, no un deslice: el paquete
     vuelve a la cola para que lo pueda coger cualquiera. Solo puede deshacer
     los suyos; si lo cerró otro, el servidor no lo toca y se dice. */
  const eraCierre = MODO === 'empaqueta' && marca.estado !== 'inc';
  /* Si aún no había salido del móvil, basta con sacarlo de la lista de espera. */
  const antes = PENDCOLA.length;
  PENDCOLA = PENDCOLA.filter((x) => !(x.pedido === pedido && !!x.cierre === eraCierre));
  if (PENDCOLA.length !== antes) { guardarPend(); return; }
  try {
    const r = await fetch('/api/cola?d=' + encodeURIComponent(CODIGO), {
      method:'POST', headers:{'Content-Type':'application/json'}, cache:'no-store',
      body: JSON.stringify({ accion: eraCierre ? 'reabrir' : 'retirar', quien: QUIEN, pedido })
    });
    const j = await r.json();
    if (eraCierre) {
      if (j && j.ok && !j.reabierto) {
        alert(j.estado === 'cerrado'
          ? 'Ese paquete lo cerró ' + (j.quien || 'otra persona') + '. Solo puede deshacerlo quien lo cerró.'
          : 'Ese paquete no está cerrado, así que no hay nada que deshacer.');
      }
    } else if (j && j.ok && !j.retirado && j.estado) {
      alert(j.estado === 'cerrado'
        ? 'Ese paquete ya lo ha cerrado ' + (j.quien || 'otra persona') + '. No se puede deshacer.'
        : 'Ese paquete ya lo tiene ' + (j.quien || 'otra persona') + ' en la mesa. No se lo quito.');
    }
  } catch(e){
    alert(eraCierre
      ? 'Sin conexión: el paquete sigue cerrado en el servidor. Prueba otra vez en un momento.'
      : 'Sin conexión: el paquete sigue en la cola. Avisa a quien empaqueta.');
  }
}

/* ---------------------------------------------------------- mandar tiempos
 * Mismo truco que todo lo demas: los datos van DENTRO del enlace, detras de la
 * almohadilla, asi que no viajan a ningun servidor. En el PC se abren los dos
 * enlaces —el del que recoge y el del que empaqueta— y se cruzan por comprador.
 * Se manda tambien el desfase del reloj de este movil para poder detectar si
 * uno de los dos va desajustado: sin eso saldrian minutos negativos y nadie
 * sabria por que. */
/* ------------------------------------------------------------ mis tiempos
 * Las horas ya viajan solas: cada deslice mete el paquete en la cola con su
 * hora y cada cierre manda la suya. Este botón es solo el "por si acaso":
 * reenvía TODAS las marcas de este móvil de una vez.
 *
 * Se puede pulsar veinte veces sin miedo: la clave es (día, quien, pedido,
 * estado), así que repetir un envío no inventa paquetes.
 *
 * AQUÍ HABÍA UNA SALIDA POR WHATSAPP. Si el servidor no contestaba, esto abría
 * WhatsApp con un enlace y los datos dentro, en silencio. Era de cuando no
 * había servidor, y hacía algo peor que fallar: disimulaba el fallo. Un envío
 * que no llega tiene que verse. Quitado el 15 ago 2026.
 */
async function mandarTiempos(){
  if (!MARCAS.length) { alert('Todavía no has marcado nada.'); return; }
  if (!CODIGO || !QUIEN) { alert('Falta tu nombre o el enlace del equipo.'); return; }
  /* Cada marca a SU día. Antes iban todas al día del envío, así que quien
     mandaba sus tiempos a la mañana siguiente los apuntaba en el día siguiente
     y en la página de ayer no salía nada de lo que había hecho. */
  const porDia = new Map();
  for (const m of MARCAS) {
    const d = diaMadrid(m.t);
    if (!porDia.has(d)) porDia.set(d, []);
    porDia.get(d).push(m);
  }
  let total = 0, fallo = false;
  for (const [dia, marcas] of porDia) {
    try {
      const r = await fetch('/api/tiempos?d=' + encodeURIComponent(CODIGO), {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dia, quien: QUIEN, modo: MODO, marcas })
      });
      const j = await r.json();
      if (r.ok && j && j.ok) total += marcas.length; else fallo = true;
    } catch(e){ fallo = true; }
  }
  if (fallo) {
    alert('No he podido mandarlo todo.\n\nTus marcas siguen guardadas en este móvil:\nvuelve a pulsar cuando haya cobertura.');
    return;
  }
  /* Y de paso se comprueba la cola: es el momento en que alguien está mirando la
     pantalla, así que es el mejor momento para decirle si falta algo. */
  const c = MODO ? await reenviarTodo(false) : null;
  alert('Mandado. ' + total + ' ' + (total === 1 ? 'marca guardada' : 'marcas guardadas') +
        ' a tu nombre.' +
        (c && (c.metidos + c.revueltos) ? '\n\nAdemás faltaban ' + (c.metidos + c.revueltos) +
          ' en la cola de empaquetado y ya están dentro.' : '') +
        '\n\nSe ven en /tiempos junto a las de todos.');
}

/* El deslice. Por defecto es el de la lista de tandas —derecha: listo,
   izquierda: incidencia— pero acepta otros dos gestos para poder usar EL MISMO
   en la cola, donde derecha es cerrar el paquete e izquierda devolverlo. Tenía
   que ser el mismo código: es el gesto que la gente ya tiene en el dedo. */
function arrastrable(el, alaDerecha, alaIzquierda){
  if (!el) return;
  const haciaDerecha = alaDerecha || (() => avanzar('ok'));
  const haciaIzquierda = alaIzquierda || marcarIncidencia;
  let x0=0, y0=0, dx=0, on=false;
  const ok = el.querySelector('.sello.ok'), no = el.querySelector('.sello.no');
  const dentro = (t) => t && t.closest && t.closest('.numeros');
  const emp = (x,y,t) => { if (dentro(t)) return; x0=x; y0=y; dx=0; on=true; el.style.transition='none'; };
  const mov = (x,y) => {
    if (!on) return;
    dx = x-x0; const dy = y-y0;
    if (Math.abs(dy) > Math.abs(dx)*1.6 && Math.abs(dy) > 26) { sol(true); return; }
    el.style.transform = `translateX(${dx}px) rotate(${dx/24}deg)`;
    ok.style.opacity = dx>0 ? Math.min(1, dx/90) : 0;
    no.style.opacity = dx<0 ? Math.min(1,-dx/90) : 0;
  };
  const sol = (cancel) => {
    if (!on) return; on = false;
    el.style.transition = 'transform .22s ease-out, opacity .22s';
    if (!cancel && Math.abs(dx) > Math.min(120, window.innerWidth*.28)) {
      const s = dx>0 ? 1 : -1;
      el.style.transform = `translateX(${s*window.innerWidth*1.3}px) rotate(${s*22}deg)`;
      el.style.opacity = 0;
      setTimeout(() => { if (s > 0) haciaDerecha(); else haciaIzquierda(); }, 150);
    } else { el.style.transform=''; ok.style.opacity=0; no.style.opacity=0; }
  };
  el.addEventListener('touchstart', e=>emp(e.touches[0].clientX,e.touches[0].clientY,e.target), {passive:true});
  el.addEventListener('touchmove',  e=>mov(e.touches[0].clientX,e.touches[0].clientY), {passive:true});
  el.addEventListener('touchend',   ()=>sol(false));
  el.addEventListener('mousedown',  e=>{ emp(e.clientX,e.clientY,e.target);
    const mm=v=>mov(v.clientX,v.clientY);
    const mu=()=>{ sol(false); document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); };
    document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu); });
}

$('hecho').addEventListener('click', ()=>avanzar('ok'));
$('saltar').addEventListener('click', marcarIncidencia);
$('atras').addEventListener('click', atras);
$('volver').addEventListener('click', verMenu);
$('alMenu').addEventListener('click', verMenu);
$('reiniciar').addEventListener('click', ()=>{ i=0; historial=[]; incidencias=[]; guardar(); pintar(); });
document.addEventListener('keydown', e=>{
  if (tandaActual === null) return;
  if (e.key==='ArrowRight') avanzar('ok');
  if (e.key==='ArrowLeft')  marcarIncidencia();
  if (e.key==='Backspace')  atras();
});

// ------------------------------------------------------------- arranque

/* OJO CON ESTO, que costó un rato encontrarlo.
 *
 * Si la página YA está abierta y luego llega otro enlace con datos distintos,
 * el navegador NO recarga: solo cambia lo de detrás de la almohadilla y lanza
 * un evento 'hashchange'. El script ya se ejecutó, así que sin escuchar ese
 * evento la app se queda con los datos viejos —o sin datos— y parece rota.
 *
 * Pasa todo el rato en la práctica: se abre el enlace de ayer, luego llega el
 * de hoy por WhatsApp y se toca desde el mismo navegador. */
let ultimoHash = null;

async function arrancar(){
  const hash = location.hash || '';
  if (hash === ultimoHash) return;
  ultimoHash = hash;

  /* El orden importa: si alguien abre un enlace con datos dentro, gana el
   * enlace. Es lo que hace que se pueda mandar una tanda suelta por WhatsApp
   * aunque el servidor esté caído. Lo normal, sin embargo, es no traer nada
   * en la almohadilla y que los datos vengan del servidor. */
  const delEnlace = await desdeEnlace();
  if (delEnlace && delEnlace.tandas && delEnlace.tandas.length) DATOS = delEnlace;
  else DATOS = (await desdeApi()) || EMBEBIDOS;
  GENERADO = DATOS.generado || null;
  PENDIENTE = null;

  if (!DATOS.tandas || !DATOS.tandas.length) {
    $('menu').classList.remove('on');
    ['barra','pila','pie'].forEach(x => $(x).classList.remove('on'));
    $('fin').classList.add('on');
    $('finTitulo').textContent = 'No hay nada que recoger';
    $('finTexto').textContent = CODIGO
      ? 'Todavía no hay tandas de hoy. Deja esto abierto: en cuanto se imprima la primera, aparece sola.'
      : 'A este enlace le falta el código del equipo. Pídeselo a quien te lo pasó: tiene que acabar en ?d= y el código.';
    $('alMenu').style.display = 'none'; $('reiniciar').style.display = 'none';
    return;
  }
  $('alMenu').style.display = ''; $('reiniciar').style.display = '';
  /* Ya se sabe de qué día son las tandas: fuera el avance de los días
     anteriores, que es lo que pintaba las tandas de hoy como hechas. */
  tirarLoViejo();
  document.title = 'Recogida · ' + DATOS.titulo;
  verMenu();

  /* AL ABRIR —y solo al abrir— quien empaqueta va derecho a su cola. Recargar
   * la pagina no puede costarle un toque de mas para volver a donde estaba.
   *
   * Ojo: esto NO puede vivir dentro de pintarQuienSoy. Estuvo ahi un rato y
   * hacia que "cambiar rol" te devolviera a la cola una y otra vez, sin forma
   * de salir. El salto automatico es cosa del arranque, no del menu. */
  if (MODO === 'empaqueta' && CODIGO && QUIEN.trim()) verCola();
}

window.addEventListener('hashchange', arrancar);
arrancar();

/* Mirar si hay tandas nuevas. Medio minuto es de sobra —entre que se imprime
 * una tanda y llega el carro pasa bastante más— y no gasta batería del móvil
 * de nadie. Cuando la pantalla está apagada no se pregunta; al volver, sí,
 * porque es justo cuando alguien acaba de coger el móvil para seguir. */
if (CODIGO) {
  setInterval(mirarSiHayNuevo, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) mirarSiHayNuevo(); });
}
