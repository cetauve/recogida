<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0E1723">
<title>Billy's — Recogida</title>
<style>
:root{--bone:#EDE7DB;--navy:#1B2A3D;--red:#C8321F;--verde:#2E9E6B;--ambar:#E8B84B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#0E1723;color:var(--bone);
 font:16px/1.4 'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
 user-select:none;-webkit-user-select:none}

#barra{position:fixed;top:0;left:0;right:0;z-index:30;
 padding:calc(8px + env(safe-area-inset-top)) 14px 8px;
 display:flex;align-items:center;gap:10px;background:#0E1723}
#atras{background:rgba(237,231,219,.12);border:0;color:var(--bone);border-radius:9px;
 padding:8px 12px;font:inherit;font-size:13px;font-weight:700}
#atras:disabled{opacity:.28}
#medio{flex:1;min-width:0}
#tanda{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
 color:var(--red);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#progreso{height:5px;background:rgba(237,231,219,.14);border-radius:99px;margin-top:5px;overflow:hidden}
#barraProg{height:100%;width:0;background:var(--red);transition:width .25s}
#cuenta{font-size:13px;font-variant-numeric:tabular-nums;opacity:.7;white-space:nowrap}

#pila{position:absolute;left:14px;right:14px;
 top:calc(74px + env(safe-area-inset-top));bottom:calc(94px + env(safe-area-inset-bottom))}
.tarjeta{position:absolute;inset:0;background:var(--navy);border-radius:26px;
 box-shadow:0 18px 46px rgba(0,0,0,.5);padding:22px 20px;display:flex;flex-direction:column;
 align-items:center;justify-content:center;text-align:center;will-change:transform;touch-action:pan-y;overflow:hidden}
.tarjeta.d1{transform:scale(.94) translateY(14px);filter:brightness(.72)}
.tarjeta.d2{transform:scale(.88) translateY(26px);filter:brightness(.52)}

.et{font-size:11px;text-transform:uppercase;letter-spacing:.14em;opacity:.5;font-weight:800}
.nombre{font-size:clamp(26px,7.5vw,40px);font-weight:900;line-height:1.05;letter-spacing:-.02em;
 margin:4px 0 2px;word-break:break-word}
.usuario{font-size:13px;opacity:.45;margin-bottom:14px}
.numeros{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-content:center;
 max-height:46vh;overflow:auto;margin-bottom:12px}
.n{background:var(--red);color:#fff;border-radius:14px;font-weight:900;
 font-variant-numeric:tabular-nums;padding:10px 14px;min-width:60px}
.n.solo{font-size:clamp(54px,17vw,90px);padding:14px 26px;border-radius:22px;line-height:1}
.n.pocos{font-size:clamp(26px,8vw,40px);padding:12px 18px}
.n.muchos{font-size:clamp(17px,4.6vw,22px)}
.cuantas{font-size:14px;font-weight:800;opacity:.75;letter-spacing:.04em}
.pedido{font-size:11px;opacity:.32;margin-top:10px;font-variant-numeric:tabular-nums;word-break:break-all}
.sello{position:absolute;top:22px;font-size:24px;font-weight:900;letter-spacing:.05em;
 border:4px solid;border-radius:12px;padding:5px 14px;opacity:0;transition:opacity .1s}
.sello.ok{right:20px;color:var(--verde);border-color:var(--verde);transform:rotate(12deg)}
.sello.no{left:20px;color:var(--ambar);border-color:var(--ambar);transform:rotate(-12deg)}

#pie{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:12px;
 padding:20px 16px calc(16px + env(safe-area-inset-bottom));
 background:linear-gradient(transparent,#0E1723 40%)}
#pie button{flex:1;border:0;border-radius:18px;padding:17px 0;font:inherit;font-size:15px;font-weight:800}
#saltar{background:rgba(237,231,219,.12);color:var(--bone)}
#hecho{background:var(--verde);color:#fff}

#fin{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
 justify-content:center;text-align:center;padding:28px;gap:12px;overflow:auto}
#fin.on{display:flex}
#fin h2{font-size:28px;font-weight:900}
#fin .inc{font-size:14px;opacity:.8;max-width:90%;line-height:1.6}
#fin button{background:var(--red);color:#fff;border:0;border-radius:14px;padding:14px 24px;
 font:inherit;font-weight:800;margin-top:8px}
</style>
</head>
<body>

<div id="barra">
  <button id="atras" disabled>Atrás</button>
  <div id="medio"><div id="tanda"></div><div id="progreso"><div id="barraProg"></div></div></div>
  <div id="cuenta"></div>
</div>

<div id="pila"></div>

<div id="fin">
  <h2 id="finTitulo">Terminado</h2>
  <div class="inc" id="finTexto"></div>
  <button id="reiniciar">Empezar de nuevo</button>
</div>

<div id="pie">
  <button id="saltar">Incidencia</button>
  <button id="hecho">Listo</button>
</div>

<script>
/* Billy's — recogida en el móvil.
 *
 * Una tarjeta por COMPRADOR, no por prenda: el que recoge junta todas las
 * prendas de una persona y se las pasa al que empaqueta. Los números van en
 * orden ascendente para hacer una sola barrida del perchero por paquete.
 *
 * Las tarjetas van agrupadas por tanda, en el mismo orden en que se imprimieron
 * las etiquetas: de menos prendas a más.
 *
 * Todo va embebido en este archivo: funciona sin internet y sin servidor.
 * Se manda por WhatsApp y se abre. */
/* Los datos pueden llegar por dos caminos:
 *
 *  1. EMBEBIDOS en el archivo. Es lo que sirve el servidor local de la tienda.
 *  2. EN EL ENLACE, despues de la almohadilla. Es lo que se manda por WhatsApp.
 *
 * Lo de la almohadilla importa: el navegador NUNCA manda al servidor lo que va
 * despues del '#'. Asi que la pagina puede estar en internet y los nombres y
 * pedidos de los clientes no salen del movil. */
const EMBEBIDOS = /*DATOS*/{"titulo":"Sin datos","generado":"","tandas":[]}/*FIN*/;

function deBase64url(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  const bin = atob(s);
  const b = new Uint8Array(bin.length);
  for (let i=0;i<bin.length;i++) b[i] = bin.charCodeAt(i);
  return b;
}

async function desdeEnlace(){
  const h = (location.hash || '').slice(1);
  if (h.length < 8) return null;
  try {
    const bytes = deBase64url(h.slice(1));
    if (h[0] === 'z' && typeof DecompressionStream !== 'undefined') {
      const ds = new DecompressionStream('gzip');
      const w = ds.writable.getWriter(); w.write(bytes); w.close();
      const buf = await new Response(ds.readable).arrayBuffer();
      return JSON.parse(new TextDecoder().decode(buf));
    }
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch(e){ console.warn('enlace ilegible', e); return null; }
}

let DATOS = EMBEBIDOS;
let FICHAS = [];
function montarFichas(){
  FICHAS = [];
  DATOS.tandas.forEach((t,ti)=> t.compradores.forEach(c=> FICHAS.push({...c, tanda:t.etiqueta, ti})));
}

const pila=document.getElementById('pila'), fin=document.getElementById('fin');
let i=0; const historial=[], incidencias=[];
let clave='billys_recogida_'+EMBEBIDOS.titulo;

function guardar(){ try{localStorage.setItem(clave,JSON.stringify({i,historial,incidencias}));}catch(e){} }
function cargar(){
  try{ const d=JSON.parse(localStorage.getItem(clave)||'null');
    if(d&&d.i>0&&d.i<FICHAS.length&&confirm('Tienes esto empezado por el paquete '+(d.i+1)+' de '+FICHAS.length+'. ¿Sigues donde lo dejaste?')){
      i=d.i; historial.push(...d.historial); incidencias.push(...d.incidencias);
    } else localStorage.removeItem(clave);
  }catch(e){}
}

function claseNum(n){ return n===1?'solo':(n<=6?'pocos':'muchos'); }

function tarjetaHTML(f,cl){
  const c=claseNum(f.numeros.length);
  return `<div class="tarjeta ${cl||''}">
    <div class="sello ok">LISTO</div><div class="sello no">INCIDENCIA</div>
    <div class="et">${f.tanda}</div>
    <div class="nombre">${f.apodo}</div>
    <div class="usuario">${f.usuario}</div>
    <div class="numeros">${f.numeros.map(n=>`<span class="n ${c}">${n}</span>`).join('')}</div>
    <div class="cuantas">${f.numeros.length} ${f.numeros.length===1?'PRENDA':'PRENDAS'}</div>
    <div class="pedido">${f.pedido}</div>
  </div>`;
}

function pintar(){
  document.getElementById('atras').disabled=!historial.length;
  if(i>=FICHAS.length){ terminar(); return; }
  fin.classList.remove('on');
  const f=FICHAS[i];
  document.getElementById('tanda').textContent=f.tanda;
  document.getElementById('cuenta').textContent=(i+1)+' / '+FICHAS.length;
  document.getElementById('barraProg').style.width=(i/FICHAS.length*100)+'%';
  pila.innerHTML=(FICHAS[i+2]?tarjetaHTML(FICHAS[i+2],'d2'):'')+
                 (FICHAS[i+1]?tarjetaHTML(FICHAS[i+1],'d1'):'')+tarjetaHTML(f);
  arrastrable(pila.lastElementChild);
}

function terminar(){
  pila.innerHTML=''; fin.classList.add('on');
  document.getElementById('cuenta').textContent=FICHAS.length+' / '+FICHAS.length;
  document.getElementById('barraProg').style.width='100%';
  document.getElementById('finTexto').innerHTML= incidencias.length
    ? '<b>'+incidencias.length+' con incidencia:</b><br>'+incidencias.map(f=>f.apodo+' — '+f.numeros.join(', ')).join('<br>')
    : 'Los '+FICHAS.length+' paquetes están hechos.';
  try{localStorage.removeItem(clave);}catch(e){}
}

function avanzar(estado){
  if(i>=FICHAS.length) return;
  if(estado==='inc') incidencias.push(FICHAS[i]);
  historial.push({i,estado}); i++;
  guardar(); pintar();
  if(navigator.vibrate) navigator.vibrate(estado==='inc'?[12,40,12]:18);
}
function atras(){ const h=historial.pop(); if(!h) return;
  if(h.estado==='inc') incidencias.pop(); i=h.i; guardar(); pintar(); }

function arrastrable(el){
  if(!el) return;
  let x0=0,y0=0,dx=0,on=false;
  const ok=el.querySelector('.sello.ok'), no=el.querySelector('.sello.no');
  const dentro=(t)=>t&&t.closest&&t.closest('.numeros');
  const emp=(x,y,t)=>{ if(dentro(t)) return; x0=x;y0=y;dx=0;on=true; el.style.transition='none'; };
  const mov=(x,y)=>{ if(!on) return; dx=x-x0; const dy=y-y0;
    if(Math.abs(dy)>Math.abs(dx)*1.6&&Math.abs(dy)>26){ sol(true); return; }
    el.style.transform=`translateX(${dx}px) rotate(${dx/24}deg)`;
    ok.style.opacity=dx>0?Math.min(1,dx/90):0; no.style.opacity=dx<0?Math.min(1,-dx/90):0; };
  const sol=(cancel)=>{ if(!on) return; on=false;
    el.style.transition='transform .22s ease-out, opacity .22s';
    const umbral=Math.min(120,window.innerWidth*.28);
    if(!cancel&&Math.abs(dx)>umbral){ const s=dx>0?1:-1;
      el.style.transform=`translateX(${s*window.innerWidth*1.3}px) rotate(${s*22}deg)`;
      el.style.opacity=0; setTimeout(()=>avanzar(s>0?'ok':'inc'),150);
    } else { el.style.transform=''; ok.style.opacity=0; no.style.opacity=0; } };
  el.addEventListener('touchstart',e=>emp(e.touches[0].clientX,e.touches[0].clientY,e.target),{passive:true});
  el.addEventListener('touchmove', e=>mov(e.touches[0].clientX,e.touches[0].clientY),{passive:true});
  el.addEventListener('touchend',  ()=>sol(false));
  el.addEventListener('mousedown', e=>{ emp(e.clientX,e.clientY,e.target);
    const mm=v=>mov(v.clientX,v.clientY);
    const mu=()=>{sol(false);document.removeEventListener('mousemove',mm);document.removeEventListener('mouseup',mu);};
    document.addEventListener('mousemove',mm); document.addEventListener('mouseup',mu); });
}

document.getElementById('hecho').addEventListener('click',()=>avanzar('ok'));
document.getElementById('saltar').addEventListener('click',()=>avanzar('inc'));
document.getElementById('atras').addEventListener('click',atras);
document.getElementById('reiniciar').addEventListener('click',()=>{
  i=0; historial.length=0; incidencias.length=0; guardar(); pintar(); });
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')avanzar('ok'); if(e.key==='ArrowLeft')avanzar('inc'); if(e.key==='Backspace')atras(); });

(async () => {
  const delEnlace = await desdeEnlace();
  if (delEnlace && delEnlace.tandas && delEnlace.tandas.length) DATOS = delEnlace;
  montarFichas();
  clave = 'billys_recogida_' + DATOS.titulo;
  if(!FICHAS.length){
    document.getElementById('finTitulo').textContent='No hay nada que recoger';
    document.getElementById('finTexto').textContent=
      'Este enlace no trae datos. Vuelve a generarlo desde el panel.';
    fin.classList.add('on');
    return;
  }
  document.title = 'Recogida · ' + DATOS.titulo;
  cargar(); pintar();
})();
</script>
</body>
</html>
