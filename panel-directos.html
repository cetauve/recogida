<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Billy's · Panel de directos</title>
<style>
  /* Mismo mundo que la pantalla del directo: claro, porque esto se mira en un
   * almacen con luz, en el movil y ahora tambien en las tablets. */
  :root{
    color-scheme: light;
    --fondo:#eef1f4; --caja:#ffffff; --borde:#ccd4db;
    --texto:#141a1f; --suave:#5f6b76;
    --ok:#2e9e4f; --malo:#c0392b; --cian:#0e8c80;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--fondo);color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .hoja{max-width:1100px;margin:0 auto;padding:18px 16px 60px}

  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:21px;margin:0;letter-spacing:-.01em}
  .reloj{font-size:13px;color:var(--suave);margin-left:auto;font-variant-numeric:tabular-nums}
  .intro{font-size:14px;color:var(--suave);margin:0 0 20px;line-height:1.5;max-width:66ch}

  .fila{background:var(--caja);border:1px solid var(--borde);border-radius:14px;
    padding:14px 16px;margin-bottom:12px;border-left:5px solid var(--borde)}
  .fila.vivo{border-left-color:var(--ok)}
  .fila.muerto{border-left-color:var(--malo)}
  .fila.dormido{border-left-color:var(--borde)}

  .alto{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .canal{font-size:20px;font-weight:750;letter-spacing:-.01em}
  .canal.sinnombre{color:var(--suave);font-weight:600;font-size:16px}
  .cuenta{font-size:14px;color:var(--suave)}
  .sem{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .luz{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--suave);white-space:nowrap}
  .luz i{width:10px;height:10px;border-radius:50%;background:var(--borde);display:block;flex:none}
  .luz.si i{background:var(--ok)} .luz.no i{background:var(--malo)}

  .datos{display:flex;gap:26px;flex-wrap:wrap;margin-top:12px;align-items:flex-end}
  .dato .et{font-size:11px;text-transform:uppercase;letter-spacing:.11em;color:var(--suave);font-weight:700}
  .dato .v{font-size:26px;font-weight:750;line-height:1.1;font-variant-numeric:tabular-nums}
  .dato .v.chico{font-size:15px;font-weight:600}
  .ultima{flex:1;min-width:190px}

  .orden{margin-top:12px;font-size:14px;padding:9px 12px;border-radius:9px;background:#f4f7f9;color:var(--suave)}
  .orden.pendiente{background:#e7f4f2;color:#0a6b62}
  .orden.error{background:#fdecea;color:#8c1f14;font-weight:600}

  .pie{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* EL BOTON GRANDE ES EL DE ABRIR LA TABLET.
   * Todas las tablets guardan el MISMO enlace, el de este panel, y cada una
   * elige aqui su puesto. Asi no hay que repartir enlaces cada dia. Por eso
   * este boton es lo mas grande de la fila: lo va a pulsar alguien de pie, con
   * una prenda en la otra mano. */
  .abrir{display:inline-flex;align-items:center;gap:9px;font:inherit;font-size:16px;font-weight:700;
    padding:14px 22px;border-radius:11px;border:none;background:var(--cian);color:#fff;
    cursor:pointer;text-decoration:none;min-height:50px}
  .abrir:active{background:#0b7b70}
  .abrir:focus-visible{outline:3px solid var(--texto);outline-offset:2px}
  .abrir .fl{font-size:19px;line-height:1}
  button.copiar{appearance:none;font:inherit;cursor:pointer;background:var(--caja);
    border:1.5px solid var(--borde);border-radius:9px;padding:10px 16px;
    font-size:13px;font-weight:600;color:var(--suave);min-height:44px}
  button.copiar:active{background:#e8edf1}

  .vacio{font-size:14px;color:var(--suave);margin-top:12px;font-style:normal}
  .fallo{background:#fdecea;border:1px solid #f0b8b0;color:#8c1f14;
    border-radius:12px;padding:14px 16px;font-size:14px;margin-bottom:14px}
  .apagado{opacity:.62}
</style>
</head>
<body>
<div class="hoja">
  <header>
    <h1>Directos</h1>
    <span class="reloj" id="reloj">conectando</span>
  </header>
  <p class="intro">Cada tablet guarda este mismo enlace y aqui elige su puesto. El semaforo mira si el
     ordenador y la tablet han dado senales hace poco, no si el directo esta emitiendo.</p>
  <div id="fallo"></div>
  <div id="lista"></div>
</div>

<script>
/* Billy's · panel de directos.
 *
 * DOS COSAS A LA VEZ, Y A PROPOSITO. Es la pantalla desde la que se vigila que
 * todo esta conectado, y es tambien la puerta de entrada de las tablets: todas
 * guardan ESTE enlace y cada una entra a su puesto desde aqui. Antes habia que
 * mandarle a cada una el suyo, y un enlace mal mandado es una tablet lanzando
 * subastas en la cuenta de otra.
 *
 * LOS PUESTOS SALEN SIEMPRE, haya directo o no. Si solo se pintaran los
 * directos vivos, una tablet no podria entrar ANTES de que empiece la emision,
 * que es justo cuando se prepara. La pantalla del directo ya sabe decir "aun no
 * hay anuncios" y esperar.
 *
 * Y SIEMPRE EN EL MISMO ORDEN. Nada de ordenar por actividad: la fila de BV
 * tiene que estar donde estaba ayer, porque quien la pulsa lo hace sin leer.
 *
 * SOLO MIRA, NO LANZA. Aqui no hay ningun boton que empiece ni pare una
 * subasta. Lo peor que puede pasar si esta pantalla falla es que no se vea.
 *
 * NO SE ENSENA NADA DE NADIE: ni usuarios, ni compradores, ni pedidos. El
 * servidor los quita antes de mandarlos.
 */
var P = new URLSearchParams(location.search);
var CODIGO = P.get('d') || '';
var API = '/api/tandas';
var RITMO = 5000, espera = RITMO;

/* Los puestos que existen. Si manana hay uno nuevo se anade aqui y ya sale,
 * tenga directo o no. */
var PUESTOS = [
  { canal: 'bv',  nombre: 'BV',  cuenta: 'Billys VLC' },
  { canal: 'bto', nombre: 'BTo', cuenta: 'Billys Tour' },
  { canal: 'bta', nombre: 'BTa', cuenta: 'Billys Tacos' },
  { canal: 'de',  nombre: 'DE',  cuenta: 'Alemania' },
  { canal: 'nl',  nombre: 'NL',  cuenta: 'Holanda' }
];

var $ = function (id) { return document.getElementById(id); };
var esc = function (s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
};

function hace(iso) {
  if (!iso) return null;
  var s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (!isFinite(s) || s < 0) return null;
  if (s < 60) return Math.round(s) + ' s';
  if (s < 3600) return Math.round(s / 60) + ' min';
  return Math.round(s / 36) / 100 + ' h';
}

function luz(nombre, iso, limite) {
  var s = iso ? (Date.now() - new Date(iso).getTime()) / 1000 : 1e9;
  var bien = s < limite;
  var cuanto = hace(iso);
  return '<span class="luz ' + (bien ? 'si' : 'no') + '"><i></i>' + nombre +
    (bien ? '' : (cuanto ? ' · hace ' + cuanto : ' · nunca')) + '</span>';
}

function enlaceTablet(canal, sesion) {
  return 'app-directo.html?d=' + encodeURIComponent(CODIGO) +
    (canal ? '&canal=' + encodeURIComponent(canal) : '&directo=' + encodeURIComponent(sesion));
}

function filaHTML(p, d) {
  /* Mismo listón que la tablet: noventa segundos. Una pestaña que Chrome ha
   * frenado habla una vez por minuto y sigue estando perfectamente viva. */
  var pcSeg = (d && d.listados_cuando) ? (Date.now() - new Date(d.listados_cuando).getTime()) / 1000 : 1e9;
  var clase = !d ? 'dormido' : (pcSeg < 90 ? 'vivo' : (pcSeg < 3600 ? 'muerto' : 'dormido'));
  var canal = p ? p.canal : (d.canal || '');
  var nombre = p ? p.nombre : (d.canal ? d.canal.toUpperCase() : '');
  var cuenta = (d && d.cuenta) || (p && p.cuenta) || '';

  var titulo = nombre
    ? '<span class="canal">' + esc(nombre) + '</span>'
    : '<span class="canal sinnombre">sin nombre de canal</span>';

  var cuerpo, orden = '';
  if (!d) {
    cuerpo = '<div class="vacio">Sin directo todavia. Se puede abrir la tablet igual y esperar aqui.</div>';
  } else {
    var u = d.ultima;
    var ultima = u
      ? '<div class="et">Ultima vendida</div><div class="v chico">ficha ' + esc(u.ficha) +
        ' · ' + esc(u.nombre || '') + (u.precio ? ' · ' + esc(u.precio) : '') + '</div>'
      : '<div class="et">Ultima vendida</div><div class="v chico" style="color:var(--suave)">todavia nada</div>';
    cuerpo = '<div class="datos">' +
      '<div class="dato"><div class="et">Ficha</div><div class="v">' + esc((d.ficha || 0) + 1) + '</div></div>' +
      '<div class="dato"><div class="et">Vendidas</div><div class="v">' + esc(d.ventas || 0) + '</div></div>' +
      '<div class="dato"><div class="et">Anuncios</div><div class="v">' + esc(d.listados || 0) + '</div></div>' +
      '<div class="dato ultima">' + ultima + '</div></div>';
    if (d.orden && d.orden.estado === 'pendiente') {
      orden = '<div class="orden pendiente">Lanzando ' + esc(d.orden.nombre || '') + '…</div>';
    } else if (d.orden && d.orden.estado === 'error') {
      orden = '<div class="orden error">No salio: ' + esc(d.orden.error || 'sin motivo') + '</div>';
    }
  }

  var semaforo = d
    ? '<span class="sem">' + luz('ordenador', d.listados_cuando, 90) + luz('tablet', d.tablet, 120) + '</span>'
    : '';

  var pie = '';
  if (canal || (d && d.sesion)) {
    var url = enlaceTablet(canal, d && d.sesion);
    pie = '<div class="pie">' +
      '<a class="abrir" href="' + esc(url) + '"><span class="fl">▸</span>Abrir la tablet' +
        (nombre ? ' de ' + esc(nombre) : '') + '</a>' +
      '<button class="copiar" data-copiar="' + esc(location.origin + '/' + url) + '">Copiar enlace</button>' +
    '</div>';
  }

  return '<div class="fila ' + clase + (d ? '' : ' apagado') + '">' +
    '<div class="alto">' + titulo +
      (cuenta ? '<span class="cuenta">' + esc(cuenta) + '</span>' : '') + semaforo +
    '</div>' + cuerpo + orden + pie +
  '</div>';
}

function pintar(j) {
  var vivos = (j && j.directos) || [];
  var porCanal = {};
  for (var i = 0; i < vivos.length; i++) {
    var c = vivos[i].canal;
    /* De un mismo canal se queda el mas reciente: el de antes de reanudar ya no
     * interesa a nadie. La lista viene ordenada de nuevo a viejo. */
    if (c && !porCanal[c]) porCanal[c] = vivos[i];
  }

  var html = PUESTOS.map(function (p) { return filaHTML(p, porCanal[p.canal] || null); });

  /* Y al final, lo que no encaja en ningun puesto: directos sin nombre, o con
   * un nombre que no esta en la lista. Se ven para que no pasen desapercibidos. */
  var conocidos = {};
  PUESTOS.forEach(function (p) { conocidos[p.canal] = 1; });
  /* Y al final, lo que no encaja en ningun puesto. Solo si ha dado senales hace
   * poco: cada vez que se para y se reanuda un directo, TikTok le da un numero
   * nuevo, asi que el de antes se queda ahi de recuerdo. Enseñar esos fantasmas
   * doce horas solo sirve para asustar. */
  var FRESCO = 10 * 60 * 1000;
  vivos.forEach(function (d) {
    if (d.canal && conocidos[d.canal]) return;
    if (d.canal && porCanal[d.canal] !== d) return;
    var visto = d.listados_cuando ? Date.now() - new Date(d.listados_cuando).getTime() : 1e12;
    if (visto > FRESCO) return;
    html.push(filaHTML(null, d));
  });

  $('lista').innerHTML = html.join('');
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-copiar]');
  if (!b) return;
  var txt = b.dataset.copiar;
  try {
    navigator.clipboard.writeText(txt).then(function () {
      b.textContent = 'Copiado';
      setTimeout(function () { b.textContent = 'Copiar enlace'; }, 1500);
    }, function () { window.prompt('Copia el enlace:', txt); });
  } catch (_) { window.prompt('Copia el enlace:', txt); }
});

async function vuelta() {
  if (!CODIGO) {
    $('fallo').innerHTML = '<div class="fallo">Falta el codigo en la direccion. ' +
      'Abre este panel desde el enlace de siempre, el que lleva <b>?d=</b>.</div>';
    return;
  }
  var corte = new AbortController();
  /* QUINCE SEGUNDOS Y NO OCHO. La primera llamada despues de un rato sin usar
   * el servidor tarda unos segundos en arrancar, y cortarla a los ocho hacia
   * que el panel dijera "sin respuesta" con el servidor perfectamente bien.
   * Peor aun: la llamada cortada aqui sigue corriendo alla, gastando conexion. */
  var reloj = setTimeout(function () { corte.abort(); }, 15000);
  try {
    var r = await fetch(API + '?d=' + encodeURIComponent(CODIGO) + '&panel=1&_=' + Date.now(),
                        { signal: corte.signal, cache: 'no-store' });
    var j = await r.json();
    if (!j.ok) throw new Error(j.error || 'el servidor dice que no');
    pintar(j);
    $('fallo').innerHTML = '';
    $('reloj').textContent = 'al dia · ' + new Date().toLocaleTimeString('es-ES');
    espera = RITMO;
  } catch (e) {
    /* Freno progresivo. Con cinco tablets y varios moviles mirando esto a la
     * vez, una pantalla que insiste cada cinco segundos contra un servidor que
     * va mal es lo que lo acaba de tirar. */
    /* Se espacia poco a poco, no de golpe: con un fallo suelto no tiene sentido
     * dejar el panel un minuto a ciegas. */
    espera = Math.min(Math.round(espera * 1.6), 30000);
    $('reloj').textContent = 'sin respuesta · reintentando en ' + Math.round(espera / 1000) + ' s';
    $('fallo').innerHTML = '<div class="fallo">No se puede hablar con el servidor. ' +
      esc(String((e && e.message) || e)) + '</div>';
    /* Aunque no haya servidor, los puestos se pintan igual: la tablet tiene que
     * poder entrar a su directo aunque el panel no sepa contar nada todavia. */
    if (!$('lista').innerHTML) pintar(null);
  } finally {
    clearTimeout(reloj);
    setTimeout(vuelta, espera);
  }
}

pintar(null);
vuelta();
</script>
</body>
</html>
