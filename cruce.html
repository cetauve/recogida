<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- La extension inyecta el puente en las paginas que llevan esta etiqueta.
     Sin ella no llega ningun dato. No la quites. -->
<meta name="billys-datos" content="1">
<title>Cruce de prendas y lotes</title>

<!--
  ===========================================================================
  CRUCE  ·  prenda vendida  x  lote del directo
  ===========================================================================

  DE DONDE SALE CADA COSA
    · Los toques de las vendedoras: del enlace que manda la app del movil
      (van dentro del #, asi que no viajan al servidor: GitHub no ve nada).
    · Los lotes, precios y horas: de la extension, que los lleva capturando
      todo el directo. Se los pasa el puente pantalla-web.js.

  COMO SE CRUZA
    La vendedora pulsa DESPUES de que la prenda se haya vendido, asi que cada
    toque se lleva el ULTIMO lote cerrado antes de ese toque, y cada lote solo
    se puede usar una vez.

    LIMITE HONESTO: la hora de venta de un lote se lee del panel de TikTok como
    "hace 1 minuto", asi que tiene precision de minuto, no de segundo. Con un
    lote por minuto, un toque puede caer en el lote de al lado. Por eso abajo
    sale siempre cuantos han cruzado y cuantos no: si la cifra de dudosos sube,
    hay que mirarlo, no darlo por bueno.

  EL DINERO
    costePieza = (euroKilo / piezasKilo + transporte) * (1 + IVA)
    El precio de venta de TikTok YA lleva IVA, asi que el margen se calcula con
    IVA en los dos lados (decision de Aaron, 7 ago 2026). Se guardan tambien
    las columnas sin IVA en el CSV, que es el margen real del negocio, para no
    tener que rehacer nada si se cambia de criterio.
  ===========================================================================
-->

<style>

         border-radius:14px;padding:14px}

  .cifra span{font-size:12px;color:var(--tenue);display:block;margin-top:6px}

  th,td{padding:8px 10px;border-bottom:1px solid var(--borde);text-align:left;white-space:nowrap}
  th{color:var(--tenue);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  tr.dudoso td{color:var(--ambar)}
  .envoltorio{overflow:auto;max-height:520px;border:1.5px solid var(--borde);border-radius:14px}
  button{font-family:inherit;font-size:15px;font-weight:700;padding:12px 18px;border-radius:12px;
         border:0;background:var(--acento);color:#fff;cursor:pointer}

           border:1.5px solid var(--borde);border-radius:10px;padding:10px;font-family:ui-monospace,monospace;font-size:12px}
  .fila{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
</style>

<body>
<div class="caja">
  <h1>Cruce de prendas y lotes</h1>
  <p class="sub" id="cabecera">Abre aqui el enlace que manda la app de las vendedoras.</p>
  <div id="estado"></div>
  <div id="cajaCsv"></div>
  <div id="salida"></div>
</div>

<script>
(() => {
'use strict';

const CONFIG = {
  transportePorPieza: 0.05,
  iva: 0.21,
  // Coste base de una hora de presentadora. SIN IVA: un salario no lo lleva.
  horaPresentadora: 9,
  categorias: [
    { id:'camisetas_a', nombre:'Camisetas A',    euroKilo:7,   piezasKilo:6   },
    { id:'camisetas_b', nombre:'Camisetas B',    euroKilo:3,   piezasKilo:6   },
    { id:'sudaderas_a', nombre:'Sudaderas A',    euroKilo:5,   piezasKilo:2   },
    { id:'sudaderas_b', nombre:'Sudaderas B',    euroKilo:3.5, piezasKilo:2   },
    { id:'polos_a',     nombre:'Polos A',        euroKilo:9,   piezasKilo:3   },
    { id:'polos_b',     nombre:'Polos B',        euroKilo:4,   piezasKilo:3   },
    { id:'shorts',      nombre:'Shorts deporte', euroKilo:7,   piezasKilo:6   },
    { id:'trackjacket', nombre:'Track jacket',   euroKilo:9,   piezasKilo:2.5 },
    { id:'trackpants',  nombre:'Trackpants',     euroKilo:8,   piezasKilo:2.5 },
    { id:'chaquetas',   nombre:'Chaquetas',      euroKilo:7.5, piezasKilo:1.5 }
  ],
  // Cuanto se mira hacia atras buscando el lote del toque.
  ventanaAtrasMs: 10 * 60000,
  // Margen hacia delante, para absorber que la hora del lote va al minuto.
  margenDelanteMs: 90000,
  /* Y el margen hacia delante CUANDO LA HORA ES BUENA (directoLotes).
   *
   * Aquí tiene que ser casi cero, y la prueba lo demostró: con los 90 s de
   * arriba, un toque se llevaba una prenda que todavía NO se había vendido —
   * cogía el lote de dos ventas más adelante. Los 90 s existen para tapar que
   * la hora aproximada va al minuto; con la hora real no hay nada que tapar.
   *
   * Los 5 segundos que quedan son para el desfase de reloj entre la tablet y el
   * servidor de TikTok. Por eso los móviles y las tablets del almacén tienen
   * que tener la HORA AUTOMÁTICA puesta: si un reloj va cinco minutos adelantado,
   * este cruce se rompe y no hay código que lo arregle. */
  margenDelanteFiableMs: 5000,
  /* Lo que se tarda razonablemente en coger el movil y pulsar. Si el lote que
     toca se cerro hace menos que esto, ES el suyo y no se busca mas alla. Sin
     este freno, con lotes muy seguidos el cruce se adelantaba al lote de
     despues. */
  reaccionMaxMs: 45000
};

const $ = (id) => document.getElementById(id);
const cat = (id) => CONFIG.categorias.find((c) => c.id === id) || { id, nombre: id, euroKilo: 0, piezasKilo: 1 };

function costes(c) {
  const sinIva = c.euroKilo / c.piezasKilo + CONFIG.transportePorPieza;
  return { sinIva, conIva: sinIva * (1 + CONFIG.iva) };
}
const eur = (n) => (n == null || !isFinite(n)) ? '' : n.toFixed(2).replace('.', ',') + ' €';
const hhmm = (ts) => { const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); };
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* ---------------------------------------------------- entrada: los toques */
async function desempaquetar(carga) {
  const modo = carga.slice(0, 2);
  const cuerpo = carga.slice(2);
  const bin = atob(cuerpo.replace(/-/g,'+').replace(/_/g,'/'));
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  if (modo === 'g.') {
    const ds = new DecompressionStream('gzip');
    const w = ds.writable.getWriter(); w.write(u8); w.close();
    return JSON.parse(await new Response(ds.readable).text());
  }
  return JSON.parse(new TextDecoder().decode(u8));
}

/* ------------------------------------------- entrada: los lotes del directo */
let lotes = null;      // [{num, price, at, pagado, skuId}]
let horaFiable = false;  // ¿las horas vienen de directoLotes (reales) o de billysItems (aproximadas)?
let sesiones = null;

const DESTINO = (location.origin && location.origin !== 'null') ? location.origin : '*';
window.addEventListener('message', (e) => {
  if (e.source !== window) return;
  const m = e.data;
  if (!m || m.fuente !== 'billys-pantalla') return;
  /* DE DONDE SALEN LOS LOTES, Y POR QUE IMPORTA TANTO.
   *
   * Hay dos fuentes y NO valen lo mismo:
   *
   *   directoLotes — lo levanta directo-main.js leyendo las props de React de
   *     cada fila vendida. Trae `creado`, que es orderCreatedTime: la hora REAL
   *     del cierre de la venta, al segundo. Es la buena.
   *
   *   billysItems — lo levanta content.js para las pantallas. Su hora es
   *     `ahora - seenAgo`, sacada de leer "hace 1 minuto" del panel. Precisión
   *     de minuto, y al arrancar el lector se traga cientos de filas de golpe y
   *     todas acaban con la misma hora. Cruzar por ahí fue lo que dejó 24 de 65
   *     prendas sin lote el 10 ago 2026.
   *
   * Se prefiere siempre directoLotes. billysItems se queda de reserva, y cuando
   * se usa el panel lo dice, porque el resultado no merece la misma confianza.
   *
   * La hora llega a veces en segundos y a veces en milisegundos según la
   * superficie. Se normaliza sin suponer cuál es. */
  const hora = (v) => {
    const n = Number(v);
    if (!Number.isFinite(n) || n <= 0) return null;
    const ms = n < 1e12 ? n * 1000 : n;
    return (ms > 1e11 && ms < 1e14) ? ms : null;
  };

  const dl = m.datos && m.datos.directoLotes;
  if (dl) {
    const fuentes = [dl, ...Object.values(dl.historico || {})];
    const porNum = new Map();
    for (const f of fuentes) {
      for (const l of Object.values((f && f.lotes) || {})) {
        if (!Number.isFinite(l.num)) continue;
        const t = hora(l.creado);
        const previo = porNum.get(l.num);
        // Gana el que tenga hora; entre dos con hora, el más reciente.
        if (!previo || (t && (!previo.at || t > previo.at))) {
          porNum.set(l.num, { num: l.num, price: Number(l.precio), at: t || 0,
                              pagado: l.pagado, skuId: l.skuId });
        }
      }
    }
    if (porNum.size) {
      lotes = [...porNum.values()].sort((a, b) => a.at - b.at || a.num - b.num);
      horaFiable = lotes.filter((l) => l.at).length >= lotes.length * 0.8;
      pintar();
      return;
    }
  }

  const it = m.datos && m.datos.billysItems;
  if (!it || !it.items) return;
  if (lotes && horaFiable) return;      // ya tenemos algo mejor
  lotes = Object.values(it.items)
    .filter((x) => Number.isFinite(x.num))
    .map((x) => ({ num: x.num, price: Number(x.price), at: x.at || 0, pagado: x.paid }))
    .sort((a, b) => a.at - b.at);
  horaFiable = false;
  pintar();
});
window.postMessage({ fuente: 'billys-pantalla-pide' }, DESTINO);

/* --------------------------------------------------------------- el cruce */
/* EL CRUCE
 *
 * HISTORIA, PORQUE EXPLICA EL DISENO. La primera version ataba cada toque a un
 * lote comparando HORAS. El 10 de agosto de 2026 eso dejo 24 de 65 prendas sin
 * lote. El motivo no era la ventana de tolerancia: era que la hora de venta de
 * un lote NO ES DE FIAR. content.js la sella asi:
 *
 *     patch.at = v.seenAgo != null ? ahora - v.seenAgo : ahora;
 *
 * seenAgo sale de leer "1m" o "2h" del panel (resolucion de MINUTO, y solo si
 * ese texto aparece). Si no aparece, la hora es la de cuando el lector se fijo
 * en la prenda, no la de la venta. Y al arrancar, el lector se traga cientos de
 * filas de golpe, asi que muchos lotes acaban con la MISMA hora. Con el eje de
 * tiempos aplastado, cruzar por cercania es tirar una moneda.
 *
 * LO QUE SI ES DE FIAR:
 *   1. El NUMERO de lote. Es el orden real de la subasta y no depende de nada.
 *   2. El ORDEN de los toques. La vendedora marca una prenda cada vez.
 *
 * Asi que si sabemos por que numero iba el directo cuando entro y por cual
 * cuando salio, su turno es un tramo de lotes conocido y sus toques se alinean
 * ahi EN ORDEN. Sin horas. Por eso la app le pregunta esos dos numeros.
 *
 * Si faltan los anclajes (turnos viejos, o no supo el numero), se cae al metodo
 * de horas de siempre, que sigue aqui abajo. Y se dice cual se ha usado.
 */
/* LEER EL CSV DE LOTES QUE SACA EL PANEL.
 *
 * Columnas: numero, cuenta, vendida_en (ISO), precio, sku, parado.
 * Es un CSV nuestro, no de un tercero, así que el separador y las comillas son
 * conocidos. Aun así se parte respetando comillas, porque un nombre de cuenta
 * con una coma tiraría abajo el archivo entero y sería un fallo silencioso. */
function partirCsv(linea) {
  const out = []; let act = '', dentro = false;
  for (let i = 0; i < linea.length; i++) {
    const c = linea[i];
    if (dentro) {
      if (c === '"' && linea[i + 1] === '"') { act += '"'; i++; }
      else if (c === '"') dentro = false;
      else act += c;
    } else if (c === '"') dentro = true;
    else if (c === ',') { out.push(act); act = ''; }
    else act += c;
  }
  out.push(act);
  return out;
}

/* La hora del export de TikTok viene en formato de Estados Unidos y en hora
 * LOCAL: "08/12/2026 10:44:15 AM". Date.parse() la lee mal en algunos
 * navegadores, así que se parte a mano. Mes primero, día después: el 08/12 de
 * ese archivo es el 12 de AGOSTO, no el 8 de diciembre. */
function horaTikTok(v) {
  const m = String(v || '').replace(/\t/g, '').trim()
    .match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})[ ,]+(\d{1,2}):(\d{2}):(\d{2})\s*(AM|PM)?$/i);
  if (!m) { const d = Date.parse(v); return Number.isFinite(d) ? d : 0; }
  let h = parseInt(m[4], 10);
  const ampm = (m[7] || '').toUpperCase();
  if (ampm === 'PM' && h < 12) h += 12;
  if (ampm === 'AM' && h === 12) h = 0;
  return new Date(+m[3], +m[1] - 1, +m[2], h, +m[5], +m[6]).getTime();
}

const numeroSuelto = (v) => {
  const t = String(v || '').replace(/[^\d.,-]/g, '');
  if (!t) return null;
  const x = t.includes(',') && !t.includes('.') ? t.replace(',', '.') : t.replace(/,/g, '');
  const f = parseFloat(x);
  return Number.isFinite(f) ? f : null;
};

function cargarCsvLotes(texto) {
  const lineas = texto.replace(/^\ufeff/, '').split(/\r?\n/).filter((l) => l.trim());
  if (lineas.length < 2) throw new Error('el archivo está vacío');
  const crudo = partirCsv(lineas[0]).map((x) => x.replace(/\t/g, '').trim());
  const cab = crudo.map((x) => x.toLowerCase());

  /* DOS FORMATOS. El del panel de almacén, y el export propio de TikTok
   * ("Exportar" en el Centro de vendedores). El de TikTok es preferible: no
   * depende de que el panel haya capturado nada. Se reconoce por sus columnas. */
  const iTikNum = cab.indexOf('seller sku');
  const iTikAt = cab.indexOf('created time');
  if (iTikNum >= 0 && iTikAt >= 0) {
    const iPreT = cab.indexOf('sku subtotal after discount');
    const iSkuT = cab.indexOf('sku id');
    const iSubT = cab.indexOf('order substatus');
    const salidaT = [];
    for (let i = 1; i < lineas.length; i++) {
      const c = partirCsv(lineas[i]).map((x) => String(x).replace(/\t/g, '').trim());
      const num = parseInt(c[iTikNum], 10);
      if (!Number.isFinite(num)) continue;
      const at = horaTikTok(c[iTikAt]);
      salidaT.push({
        num,
        price: iPreT >= 0 ? numeroSuelto(c[iPreT]) : null,
        at: at || 0,
        skuId: iSkuT >= 0 ? c[iSkuT] : '',
        pagado: iSubT >= 0 ? !/cancel/i.test(c[iSubT]) : null
      });
    }
    if (!salidaT.length) throw new Error('no hay ninguna fila con "Seller SKU"');
    lotes = salidaT.sort((a, b) => a.at - b.at || a.num - b.num);
    horaFiable = lotes.filter((l) => l.at > 0).length >= lotes.length * 0.8;
    if (!horaFiable) throw new Error('no he podido leer las horas de "Created Time"');
    return lotes.length;
  }

  const iNum = cab.indexOf('numero'), iAt = cab.indexOf('vendida_en'), iPre = cab.indexOf('precio');
  if (iNum < 0 || iAt < 0) {
    throw new Error('no reconozco las columnas. Vale el CSV del panel (numero, vendida_en) ' +
      'o el export de TikTok (Seller SKU, Created Time)');
  }
  const iSku = cab.indexOf('sku'), iPar = cab.indexOf('parado');

  const salida = [];
  for (let i = 1; i < lineas.length; i++) {
    const c = partirCsv(lineas[i]);
    const num = parseInt(c[iNum], 10);
    if (!Number.isFinite(num)) continue;
    const at = c[iAt] ? Date.parse(c[iAt]) : NaN;
    salida.push({
      num,
      price: iPre >= 0 ? Number(String(c[iPre]).replace(',', '.')) : null,
      at: Number.isFinite(at) ? at : 0,
      skuId: iSku >= 0 ? c[iSku] : '',
      pagado: iPar >= 0 ? (c[iPar] !== 'si') : null
    });
  }
  if (!salida.length) throw new Error('no hay ninguna fila con número');
  lotes = salida.sort((a, b) => a.at - b.at || a.num - b.num);
  horaFiable = lotes.filter((l) => l.at > 0).length >= lotes.length * 0.8;
  if (!horaFiable) throw new Error('el CSV no trae horas: sin ellas no puedo cruzar por tiempo');
  return lotes.length;
}

/* CRUCE POR TIEMPO — el que aguanta que se olviden de marcar.
 *
 * ESTE ES EL METODO PRINCIPAL cuando las horas vienen de directoLotes.
 *
 * POR QUE NO POR ORDEN. Alinear por orden es exacto mientras no falte ningun
 * toque, y catastrofico en cuanto falta uno: se olvida una prenda y TODO lo que
 * viene detras se corre una posicion. Un olvido no cuesta una prenda, cuesta el
 * turno entero, y encima sin avisar: los numeros siguen saliendo, solo que
 * equivocados. Es el peor fallo posible, porque parece que ha ido bien.
 *
 * LA REGLA. Cada toque se lleva EL LOTE MAS RECIENTE cerrado antes de el que
 * todavia no tenga dueno, y solo si no hace mas de `ventanaAtrasMs`.
 *
 * "El mas reciente" es exactamente la pieza que aguanta los olvidos. Si se le
 * pasa una prenda, ese lote se queda atras sin dueno y el toque siguiente coge
 * EL SUYO, no el olvidado. El error se queda en una prenda y no se propaga. La
 * version anterior iba con un puntero hacia delante, y por eso un olvido lo
 * corria todo.
 *
 * Lo que no se cruza no se reparte a ojo: se dice. Un lote sin toque sale en
 * "lotes sin marcar" y un toque sin lote sale como "sin cruce". Prefiero una
 * cifra con un hueco visible que una cuadrada y falsa.
 */
function cruzarPorTiempo(toques, lista) {
  /* Con valores por defecto A PROPOSITO. Si mañana alguien toca CONFIG y se
     deja uno fuera, esto sigue funcionando; sin ellos, `q.t + undefined` es NaN,
     ninguna comparación se cumple y el cruce asigna la última prenda del
     directo a todos los toques sin quejarse. Lo cazó el banco de pruebas. */
  const margenDelante = Number.isFinite(CONFIG.margenDelanteFiableMs) ? CONFIG.margenDelanteFiableMs : 5000;
  const ventanaAtras  = Number.isFinite(CONFIG.ventanaAtrasMs) ? CONFIG.ventanaAtrasMs : 600000;
  const conHora = lista.filter((l) => Number.isFinite(l.at) && l.at > 0)
                       .sort((a, b) => a.at - b.at);
  const usado = new Set();
  const salida = [];

  for (const q of [...toques].sort((a, b) => a.t - b.t)) {
    let elegido = null;
    // De atras hacia delante: el mas reciente que ya se hubiera vendido.
    for (let i = conHora.length - 1; i >= 0; i--) {
      const l = conHora[i];
      if (l.at > q.t + margenDelante) continue;   // todavia no se habia vendido
      if (q.t - l.at > ventanaAtras) break;        // ya es demasiado viejo para ser suyo
      if (usado.has(l.num)) continue;                      // ya tiene dueno
      elegido = l; break;
    }
    if (elegido) usado.add(elegido.num);
    salida.push({ toque: q, lote: elegido });
  }
  return salida;
}

function cruzarPorOrden(sesion, lista) {
  const a = sesion.loteInicio, b = sesion.loteFin;
  if (!Number.isFinite(a) || !Number.isFinite(b) || b <= a) return null;

  /* Los lotes de su tramo. El primero que puede ser suyo es el a+1: cuando
     entro, el a ya estaba cerrado o cerrandose. */
  const tramo = lista.filter((l) => l.num > a && l.num <= b).sort((x, y) => x.num - y.num);
  const toques = [...sesion.toques].sort((x, y) => x.t - y.t);

  /* Si marco menos prendas que lotes hubo, es que se le pasaron algunas. NO se
     puede saber CUALES, asi que no se reparten a ojo: se alinean desde el
     principio y se dice cuantas faltan. Peor seria colocarlas mal y que el COGS
     saliera limpio siendo mentira. */
  return toques.map((q, i) => ({ toque: q, lote: tramo[i] || null }));
}

function cruzar() {
  const lista = lotes || [];
  const filas = [];
  let porOrden = 0, porHora = 0, sellados = 0;
  const huecos = [];

  /* --- 0. LOS TOQUES QUE YA TRAEN SU LOTE
   *
   * Desde el 12 ago 2026 la app de las vendedoras sella el número de lote en el
   * momento del toque, leyéndolo del panel que está abierto en la misma tablet.
   * Cuando un toque trae ese número NO SE CRUZA NADA: ya está cruzado, y por el
   * único que lo sabía de verdad, que es el panel en ese instante.
   *
   * Esto es lo que arregla los dos directos a la vez. Cada tablet mira su
   * propio panel, así que el toque viene con su sessionId y el 3 de un directo
   * no se confunde con el 3 del otro. Adivinando por hora era imposible.
   *
   * Los toques sin sellar (móvil sin extensión, o panel cerrado) siguen por los
   * métodos de siempre, que están debajo intactos. */
  const sinSellar = [];
  for (const s of sesiones) {
    const conLote = (s.toques || []).filter((q) => Number.isFinite(q.lote));
    const resto   = (s.toques || []).filter((q) => !Number.isFinite(q.lote));
    for (const q of conLote) {
      const l = lista.find((x) => x.num === q.lote) || { num: q.lote, price: null, at: q.t };
      filas.push(fila({ vendedora: s.vendedora, c: q.c, t: q.t }, l, 'sellado'));
      sellados++;
    }
    if (resto.length) sinSellar.push({ ...s, toques: resto });
  }

  /* --- 1. CON HORAS BUENAS, POR TIEMPO Y PARA TODOS.
   *
   * Si los lotes vienen de directoLotes, la hora es real y el cruce por tiempo
   * es mejor que el de orden para lo que de verdad pasa en el almacén: que
   * alguna prenda se quede sin marcar. Por orden, un olvido descuadra el resto
   * del turno; por tiempo, cuesta esa prenda y nada más.
   *
   * El anclaje no se tira: se usa para CONTROLAR. Si en su tramo pasaron 40
   * lotes y marcó 34, eso sale en pantalla aunque las 34 hayan cruzado bien. */
  if (horaFiable && sinSellar.length) {
    for (const s of sinSellar) {
      const r = cruzarPorTiempo(s.toques, lista);
      for (const { toque, lote } of r) {
        filas.push(fila({ vendedora: s.vendedora, c: toque.c, t: toque.t }, lote, 'tiempo'));
        porHora++;
      }
      if (Number.isFinite(s.loteInicio) && Number.isFinite(s.loteFin) && s.loteFin > s.loteInicio) {
        const enTramo = lista.filter((l) => l.num > s.loteInicio && l.num <= s.loteFin).length;
        if (enTramo > s.toques.length) {
          huecos.push({ vendedora: s.vendedora, lotes: enTramo, toques: s.toques.length });
        }
      }
    }
    sinSellar.length = 0;
  }

  // --- 2. sin horas buenas: el anclaje y el orden, como hasta ahora
  const sinAnclaje = [];
  for (const s of sinSellar) {
    const r = cruzarPorOrden(s, lista);
    if (!r) { sinAnclaje.push(s); continue; }
    const lotesDelTramo = lista.filter((l) => l.num > s.loteInicio && l.num <= s.loteFin).length;
    if (lotesDelTramo > s.toques.length) {
      huecos.push({ vendedora: s.vendedora, lotes: lotesDelTramo, toques: s.toques.length });
    }
    for (const { toque, lote } of r) {
      filas.push(fila({ vendedora: s.vendedora, c: toque.c, t: toque.t }, lote, 'orden'));
      porOrden++;
    }
  }

  // --- 3. lo que no trae anclaje ni horas buenas: el metodo viejo
  const toques = [];
  for (const s of sinAnclaje) {
    for (const t of s.toques) toques.push({ vendedora: s.vendedora, c: t.c, t: t.t });
  }
  toques.sort((x, y) => x.t - y.t);

  const usados = new Set(filas.map((f) => f.lote).filter((n) => n != null));
  let idx = 0;
  for (const q of toques) {
    while (idx < lista.length && lista[idx].at < q.t - CONFIG.ventanaAtrasMs) idx++;
    while (idx + 1 < lista.length) {
      const actual = lista[idx], siguiente = lista[idx + 1];
      if (Math.abs(q.t - actual.at) <= CONFIG.reaccionMaxMs) break;
      if (siguiente.at > q.t + CONFIG.margenDelanteMs) break;
      if (Math.abs(q.t - siguiente.at) < Math.abs(q.t - actual.at)) idx++;
      else break;
    }
    let elegido = null;
    if (idx < lista.length && lista[idx].at <= q.t + CONFIG.margenDelanteMs &&
        !usados.has(lista[idx].num)) { elegido = lista[idx]; idx++; }
    if (elegido) usados.add(elegido.num);
    filas.push(fila(q, elegido, 'hora'));
    porHora++;
  }

  filas.sort((x, y) => x.t - y.t);
  const sinCruce = filas.filter((f) => f.lote == null);
  const loteSinToque = lista.filter((l) => !filas.some((f) => f.lote === l.num));
  return { filas, sinCruce, loteSinToque, porOrden, porHora, sellados, huecos };
}

/* Una fila del detalle, con su dinero ya calculado. El precio de venta de
   TikTok YA lleva IVA, asi que el margen va con IVA en los dos lados. */
function fila(q, lote, metodo) {
  const c = cat(q.c);
  const k = costes(c);
  const ventaConIva = lote ? Number(lote.price) : null;
  const ventaSinIva = ventaConIva != null ? ventaConIva / (1 + CONFIG.iva) : null;
  return {
    ...q, metodo,
    categoria: c.nombre,
    lote: lote ? lote.num : null,
    horaLote: lote ? lote.at : null,
    desfase: lote ? Math.round((q.t - lote.at) / 1000) : null,
    ventaConIva, ventaSinIva,
    costeConIva: k.conIva, costeSinIva: k.sinIva,
    margenConIva: ventaConIva != null ? ventaConIva - k.conIva : null,
    margenSinIva: ventaSinIva != null ? ventaSinIva - k.sinIva : null
  };
}

/* -------------------------------------------------------------- pintar */
let ultimo = null;

function pintar() {
  if (!sesiones) return;

  if (!lotes) {
    $('estado').innerHTML = `<div class="panel aviso">
      <b>Faltan los datos del directo.</b><br>
      Esta pagina tiene los toques de las vendedoras, pero los lotes y los precios
      los pone la extension. Abre esta misma pagina <b>en el navegador donde esta
      instalada la extension de Billy's</b>, con el panel del directo abierto.
      Sin eso solo puedo contar prendas, no cruzarlas con lo que se vendio.</div>`;
  } else {
    $('estado').innerHTML = '';
  }

  /* SUBIR LOS LOTES A MANO. El camino de la extensión falla cuando el registro
   * del directo no se levantó, y entonces falla ENTERO — el 12 ago 2026 fueron
   * 168 toques sin cruzar. Con el CSV de pedidos que saca el panel, el cruce no
   * depende de nada de eso: los pedidos ya traen la hora real y el precio. */
  const cajaCsv = document.getElementById('cajaCsv');
  if (cajaCsv) {
    cajaCsv.innerHTML = `<div class="panel">
      <b>¿Sin lotes, o los lotes no cuadran?</b> Sube el CSV.<br>
      <span class="sub">En el panel de almacén, pestaña <b>Recogida</b>, botón
      <b>"Descargar lotes para el cruce (CSV)"</b>.<br>
      <b>También vale el export de TikTok</b>: en el Centro de vendedores, botón <b>Exportar</b>.
      Los dos traen la hora real de venta y el precio, que es lo que hace falta aquí.</span>
      <div style="margin-top:10px"><input type="file" id="csvLotes" accept=".csv,text/csv"></div>
      <div id="csvAviso" class="sub" style="margin-top:6px">${lotes
        ? (horaFiable ? 'Ahora mismo hay ' + lotes.length + ' lotes con hora real.'
                      : 'Ahora mismo hay ' + lotes.length + ' lotes con hora aproximada.')
        : 'Ahora mismo no hay ningún lote.'}</div></div>`;
    const inp = document.getElementById('csvLotes');
    if (inp) inp.addEventListener('change', async (ev) => {
      const f = ev.target.files && ev.target.files[0];
      if (!f) return;
      try {
        const n = cargarCsvLotes(await f.text());
        document.getElementById('csvAviso').innerHTML =
          '<b style="color:#2E9E6B">' + n + ' lotes cargados del CSV.</b> Cruzando con su hora real.';
        pintar();
      } catch (err) {
        document.getElementById('csvAviso').innerHTML =
          '<b style="color:#C8321F">No he podido leerlo: ' + esc(err.message) + '</b>';
      }
    });
  }

  const r = ultimo = cruzar();
  const cruzadas = r.filas.length - r.sinCruce.length;
  const totalMargen = r.filas.reduce((a, f) => a + (f.margenConIva || 0), 0);
  const totalVenta = r.filas.reduce((a, f) => a + (f.ventaConIva || 0), 0);
  const totalCoste = r.filas.filter((f) => f.lote != null).reduce((a, f) => a + f.costeConIva, 0);

  /* --- por vendedora
   * Las horas salen de la DURACION DEL TURNO (de "Empezar" a "Terminar"), no
   * del hueco entre el primer y el ultimo toque. Es lo que se le paga: si pasa
   * veinte minutos sin vender, esos minutos cuentan igual. Usar el hueco entre
   * toques inflaba el €/hora justo de quien menos vende. */
  const porV = new Map();
  const dameV = (n) => {
    if (!porV.has(n)) porV.set(n, { piezas: 0, venta: 0, margen: 0, ms: 0 });
    return porV.get(n);
  };
  for (const s of sesiones) dameV(s.vendedora).ms += Math.max((s.fin || Date.now()) - s.inicio, 0);
  for (const f of r.filas) {
    const p = dameV(f.vendedora);
    p.piezas++; p.venta += f.ventaConIva || 0; p.margen += f.margenConIva || 0;
  }

  // --- por categoria
  const porC = new Map();
  for (const f of r.filas) {
    const p = porC.get(f.categoria) || { piezas: 0, venta: 0, coste: 0, margen: 0 };
    p.piezas++; p.venta += f.ventaConIva || 0;
    if (f.lote != null) p.coste += f.costeConIva;
    p.margen += f.margenConIva || 0;
    porC.set(f.categoria, p);
  }

  $('salida').innerHTML = `
    <div class="cifras">
      <div class="cifra"><b>${r.filas.length}</b><span>prendas marcadas</span></div>
      <div class="cifra"><b>${r.porOrden}</b><span>por orden de lote</span></div>
      <div class="cifra ${r.porHora ? 'ojo' : ''}"><b>${r.porHora}</b><span>por hora (peor)</span></div>
      <div class="cifra ${r.sinCruce.length ? 'ojo' : ''}"><b>${r.sinCruce.length}</b><span>sin cruce</span></div>
      <div class="cifra"><b>${eur(totalVenta)}</b><span>vendido (con IVA)</span></div>
      <div class="cifra"><b>${eur(totalCoste)}</b><span>coste de compra</span></div>
      <div class="cifra"><b>${eur(totalMargen)}</b><span>margen</span></div>
    </div>

    ${r.sellados ? `<div class="panel" style="border-color:#2E9E6B">
      <b>${r.sellados} toques traían su lote sellado desde la tablet.</b> Esos no se han cruzado
      por nada: el número lo puso el propio panel del directo en el momento del toque, así que no
      hay margen de error ni depende de la hora. Es lo que hace que dos directos a la vez no se
      mezclen.</div>` : ''}
    ${r.porHora && horaFiable ? `<div class="panel" style="border-color:#2E9E6B">
      <b>${r.porHora} toques cruzados por la hora real de venta.</b>
      La hora sale de <code>orderCreatedTime</code>, del propio panel del directo, al segundo.
      Cada toque se lleva la última prenda vendida antes de él que no tuviera dueño, así que
      <b>si a alguien se le pasa marcar una, se pierde esa y solo esa</b>: lo de detrás no se
      corre. Las prendas que nadie marcó salen abajo, en lotes sin marcar.
      ${r.huecos.length ? '' : ''}</div>` : ''}
    ${!horaFiable && lotes ? `<div class="panel aviso">
      <b>Las horas de los lotes son aproximadas</b>, vienen de leer "hace 1 minuto" del panel y
      tienen precisión de minuto. Con eso el cruce por tiempo no es de fiar, así que se ha ido
      por anclaje y orden. Para tener la hora buena hace falta que la pestaña del panel del
      directo esté abierta con la extensión al día: es la que levanta el registro con la hora
      real de cada venta.</div>` : ''}
    ${r.porHora && !horaFiable ? `<div class="panel aviso"><b>${r.porHora} toques se han cruzado por hora,
      que es el metodo malo.</b> Ese turno no traia el numero de lote de entrada y salida.
      La app ya los pide: al empezar y al terminar el turno. Con ellos el cruce va por orden
      y no falla.</div>` : ''}
    ${r.huecos.length ? `<div class="panel aviso"><b>Prendas sin marcar.</b>
      ${r.huecos.map((h) => `${esc(h.vendedora)}: durante su turno pasaron <b>${h.lotes}</b> lotes
        pero marco <b>${h.toques}</b> prendas. Faltan <b>${h.lotes - h.toques}</b>.`).join('<br>')}
      <br><br>No puedo saber CUALES se le pasaron, asi que no las reparto a ojo: alineo desde el
      principio y te lo digo. Preferible a que el COGS salga limpio siendo mentira.</div>` : ''}

    <h2>Por vendedora</h2>
    <div class="envoltorio"><table>
      <thead><tr><th>Vendedora</th><th class="n">Prendas</th><th class="n">Horas</th>
      <th class="n">Prendas/hora</th><th class="n">Vendido</th><th class="n">€/hora</th><th class="n">Margen</th></tr></thead>
      <tbody>${[...porV.entries()].sort((a,b) => b[1].piezas - a[1].piezas).map(([v, p]) => {
        const h = p.ms / 3600000;
        /* Con turnos de menos de 6 minutos el ritmo por hora es ruido, no dato.
           Mejor una raya que un numero que nadie deberia usar. */
        const fiable = h >= 0.1;
        return `<tr><td>${esc(v)}</td><td class="n">${p.piezas}</td>
          <td class="n">${h.toFixed(1).replace('.',',')}</td>
          <td class="n">${fiable ? (p.piezas / h).toFixed(1).replace('.',',') : '—'}</td>
          <td class="n">${eur(p.venta)}</td>
          <td class="n">${fiable ? eur(p.venta / h) : '—'}</td>
          <td class="n">${eur(p.margen)}</td></tr>`;
      }).join('')}</tbody>
    </table></div>

    <h2>Por categoria</h2>
    <div class="envoltorio"><table>
      <thead><tr><th>Categoria</th><th class="n">Prendas</th><th class="n">Coste/pieza</th>
      <th class="n">Vendido</th><th class="n">Coste</th><th class="n">Margen</th><th class="n">Margen/pieza</th></tr></thead>
      <tbody>${[...porC.entries()].sort((a,b) => b[1].margen - a[1].margen).map(([n, p]) => {
        const c = CONFIG.categorias.find((x) => x.nombre === n);
        return `<tr><td>${esc(n)}</td><td class="n">${p.piezas}</td>
          <td class="n">${c ? eur(costes(c).conIva) : ''}</td>
          <td class="n">${eur(p.venta)}</td><td class="n">${eur(p.coste)}</td>
          <td class="n">${eur(p.margen)}</td>
          <td class="n">${eur(p.margen / p.piezas)}</td></tr>`;
      }).join('')}</tbody>
    </table></div>

    <h2>Detalle · ${r.filas.length} toques</h2>
    <div class="envoltorio"><table>
      <thead><tr><th>Hora</th><th>Vendedora</th><th>Categoria</th><th class="n">Lote</th>
      <th>Cruce</th><th class="n">Venta</th>
      <th class="n">Coste</th><th class="n">Margen</th></tr></thead>
      <tbody>${r.filas.map((f) => `
        <tr class="${f.lote == null ? 'dudoso' : ''}">
          <td>${hhmm(f.t)}</td><td>${esc(f.vendedora)}</td><td>${esc(f.categoria)}</td>
          <td class="n">${f.lote != null ? '#' + f.lote : 'sin cruce'}</td>
          <td>${f.metodo === 'orden' ? 'por orden' : 'por hora'}</td>
          <td class="n">${eur(f.ventaConIva)}</td><td class="n">${eur(f.costeConIva)}</td>
          <td class="n">${eur(f.margenConIva)}</td>
        </tr>`).join('')}</tbody>
    </table></div>

    ${r.loteSinToque.length ? `<h2>Lotes vendidos que nadie marco · ${r.loteSinToque.length}</h2>
      <div class="panel">Estos se vendieron pero ninguna vendedora los registro, asi que no
      cuentan para el COGS por categoria ni para los incentivos.
      <br><br>${r.loteSinToque.slice(0, 60).map((l) => '#' + l.num).join(' · ')}
      ${r.loteSinToque.length > 60 ? ' …' : ''}</div>` : ''}

    <div class="fila">
      <button id="csv">Descargar CSV para el registro</button>
      <button id="verPegar" class="sec">Pegar otro enlace</button>
    </div>
    <div id="pegar" style="display:none;margin-top:12px">
      <textarea id="txt" placeholder="Pega aqui el enlace que llego por WhatsApp"></textarea>
      <div class="fila"><button id="cargarTxt" class="sec">Cargar</button></div>
    </div>`;

  $('csv').onclick = descargarCsv;
  $('verPegar').onclick = () => { const p = $('pegar'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; };
  $('cargarTxt').onclick = () => {
    const v = ($('txt').value || '').trim();
    const i = v.indexOf('#');
    if (i < 0) { alert('Ese enlace no lleva datos dentro.'); return; }
    location.hash = v.slice(i + 1);
    location.reload();
  };
}

function descargarCsv() {
  const cols = ['fecha','hora_toque','vendedora','categoria','lote','metodo_cruce',
                'venta_con_iva','coste_con_iva','margen_con_iva',
                'venta_sin_iva','coste_sin_iva','margen_sin_iva'];
  const dec = (n) => n == null || !isFinite(n) ? '' : n.toFixed(4).replace('.', ',');
  const lineas = [cols.join(';')];
  for (const f of ultimo.filas) {
    const d = new Date(f.t);
    lineas.push([
      `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,
      new Date(f.t).toLocaleTimeString('es-ES', { hour12: false }),
      f.vendedora, f.categoria,
      f.lote != null ? f.lote : '',
      f.metodo,
      dec(f.ventaConIva), dec(f.costeConIva), dec(f.margenConIva),
      dec(f.ventaSinIva), dec(f.costeSinIva), dec(f.margenSinIva)
    ].join(';'));
  }
  // BOM para que Excel en espanol lo abra sin romper acentos
  const blob = new Blob(['﻿' + lineas.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const d = new Date(ultimo.filas.length ? ultimo.filas[0].t : Date.now());
  a.download = `registro-prendas-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.csv`;
  a.click();
}

/* ------------------------------------------------------------- arranque */
async function arrancar() {
  const carga = location.hash.slice(1);
  if (!carga) {
    $('estado').innerHTML = `<div class="panel">
      <b>No hay ningun turno cargado.</b><br>
      Abre el enlace que manda la app de las vendedoras al pulsar "Terminar",
      o pega el enlace aqui abajo.
      <div style="margin-top:12px"><textarea id="txt0" placeholder="Pega aqui el enlace"></textarea>
      <div class="fila"><button id="cargar0">Cargar</button></div></div></div>`;
    $('cargar0').onclick = () => {
      const v = ($('txt0').value || '').trim();
      const i = v.indexOf('#');
      if (i < 0) { alert('Ese enlace no lleva datos dentro.'); return; }
      location.hash = v.slice(i + 1); location.reload();
    };
    return;
  }
  try {
    const d = await desempaquetar(carga);
    sesiones = d.sesiones || [];
    const n = sesiones.reduce((a, s) => a + s.toques.length, 0);
    $('cabecera').textContent =
      `${sesiones.length} ${sesiones.length === 1 ? 'turno' : 'turnos'} · ${n} prendas marcadas · `
      + sesiones.map((s) => s.vendedora).join(', ');
    pintar();
  } catch (err) {
    $('estado').innerHTML = `<div class="panel aviso"><b>No he podido leer el enlace.</b><br>${esc(err.message)}
      <br><br>Suele ser que se corto al copiarlo. Que lo vuelvan a mandar desde el movil.</div>`;
  }
}

window.addEventListener('hashchange', () => location.reload());
arrancar();
})();
