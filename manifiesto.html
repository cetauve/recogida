<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manifiesto de envío</title>

<!--
  ===========================================================================
  EL MANIFIESTO  ·  /manifiesto?d=CODIGO
  ===========================================================================

  La hoja que se le entrega al repartidor y que firma al llevarse los bultos.

  QUÉ CAMBIA RESPECTO A COMO SE HACÍA
  Antes había que leer otra vez el Centro de vendedores para saber cuántos
  bultos había. Ya no: en cuanto se calculan las tandas se sabe exactamente
  cuántos paquetes hay y cuál es el Order ID de cada uno, porque es lo mismo
  que se ha impreso en las tarjetas. Esta hoja sale de ahí, sin leer nada.

  UNA LÍNEA POR BULTO, NO POR PEDIDO
  TikTok junta en un solo paquete hasta 20 artículos del mismo comprador, y en
  la etiqueta imprime SOLO el Order ID más antiguo. Así que un comprador es un
  bulto y la línea lleva ese Order ID: es el que el repartidor ve en la
  etiqueta y el único con el que puede cuadrar.

  EL TRACKING NO EXISTE TODAVÍA
  El Tracking ID no lo asigna TikTok hasta que se crea la etiqueta, que pasa
  después del directo. Por eso la columna sale vacía y se rellena cuando la
  extensión lea la pestaña "A la espera de recogida". La hoja se puede
  imprimir igual: con el Order ID y el número de bultos el repartidor ya puede
  contar y firmar.

  LO QUE HAYA DE MÁS EN ESA PESTAÑA NO ES NUESTRO
  En "A la espera de recogida" pueden aparecer paquetes de otros días que
  siguen sin recoger. Esta hoja solo cuenta lo que está en las tarjetas de hoy;
  lo demás se ignora a propósito.
  ===========================================================================
-->

<style>
  :root{ --tinta:#111; --tenue:#666; --linea:#ccc; }
  *{box-sizing:border-box}
  body{margin:0;background:#0E1723;color:#EDE7DB;
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    padding:22px 18px 60px}
  .mando{max-width:900px;margin:0 auto 18px}
  h1{font-size:24px;margin:0 0 2px}
  .sub{color:#8A99AB;font-size:14px;margin:0 0 16px}
  .fila{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  input[type=date]{font:inherit;color:inherit;background:#16212F;
    border:1.5px solid #243244;border-radius:11px;padding:10px 13px}
  button{font:inherit;background:#C8321F;color:#fff;border:0;border-radius:11px;
    padding:11px 18px;font-weight:700;cursor:pointer}
  button.sec{background:transparent;border:1.5px solid #243244;color:#EDE7DB;font-weight:600}
  .aviso{max-width:900px;margin:0 auto 16px;border-radius:13px;padding:13px 16px;font-size:15px;line-height:1.55}
  .aviso.rojo{background:#2A1512;border:1.5px solid #C8321F}
  .aviso.ambar{background:#241C0E;border:1.5px solid #D89B2E}
  .aviso.verde{background:#0F2118;border:1.5px solid #2E9E6B}

  /* LA HOJA. Va en blanco y negro y con tipografía de papel: esto se imprime,
     se firma y se queda en un archivador, no se mira en una pantalla. */
  .hoja{background:#fff;color:var(--tinta);max-width:900px;margin:0 auto;
    padding:26px 30px;border-radius:6px;font-family:"Helvetica Neue",Arial,sans-serif}
  .hoja h2{margin:0 0 14px;font-size:21px;letter-spacing:.06em}
  table.meta{border-collapse:collapse;font-size:14px;margin-bottom:16px}
  table.meta td{padding:2px 0}
  table.meta td.k{color:var(--tenue);padding-right:14px;white-space:nowrap}
  table.meta td b{font-size:17px}
  table.lista{width:100%;border-collapse:collapse;font-size:13px}
  table.lista th{text-align:left;border-bottom:1.5px solid var(--tinta);
    padding:5px 8px 5px 0;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
  table.lista td{padding:5px 8px 5px 0;border-bottom:1px solid var(--linea)}
  td.nums{font-family:"SF Mono",Menlo,Consolas,monospace;font-size:12.5px;white-space:nowrap}
  td.vacio{color:#aaa}
  .firmas{display:flex;gap:40px;margin-top:34px}
  .firma{flex:1;font-size:13px}
  .firma .linea{border-bottom:1px solid var(--tinta);height:44px;margin-top:4px}
  .firma .pie{color:var(--tenue);font-size:11px;margin-top:4px}
  .pagina{margin-top:20px;color:var(--tenue);font-size:11px}

  @media print{
    body{background:#fff;padding:0}
    .mando,.aviso{display:none}
    .hoja{max-width:none;border-radius:0;padding:0}
    table.lista{font-size:12px}
  }
</style>
</head>
<body>

<div class="mando">
  <h1>Manifiesto de envío</h1>
  <p class="sub" id="sub">La hoja que firma el repartidor al llevarse los bultos.</p>
  <div class="fila">
    <input type="date" id="dia">
    <button id="ver">Ver</button>
    <button id="imprimir" class="sec">Imprimir o guardar en PDF</button>
    <button id="csv" class="sec">Descargar CSV</button>
    <!-- EL RESPALDO. Si la extensión no está a mano —otro ordenador, otro día,
         o simplemente no se hizo el paso 4— el PDF de las etiquetas también
         dice qué se ha impreso: cada etiqueta lleva su Order ID. -->
    <button id="botonPdf" class="sec">Subir el PDF de las etiquetas</button>
    <input type="file" id="pdf" accept="application/pdf" hidden>
  </div>
</div>

<div id="salida"></div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

const CODIGO = new URLSearchParams(location.search).get('d') || '';

/* Si la extensión no manda los datos de la tienda, se usan estos. Están aquí
   para que la hoja salga hoy sin esperar a nada; en cuanto la extensión los
   mande, mandan los suyos, que salen de config.json. */
const POR_DEFECTO = { nombre: "BILLY'S", almacen: 'TIENDA VALENCIA',
                      titulo: 'SHIPMENT MANIFEST', firmaEntrega: 'Entrega', firmaRecoge: 'Recoge' };

let ULTIMO = null;

/* UN BULTO POR COMPRADOR.
 *
 * TikTok mete hasta 20 artículos del mismo comprador en un paquete y en la
 * etiqueta imprime solo el Order ID más antiguo. Las tandas ya vienen
 * agrupadas por comprador —una tarjeta, un paquete— así que la lista de bultos
 * es la lista de tarjetas, en el mismo orden en que se recogen. */
/* EL MANIFIESTO NO ES LA LISTA DE LO QUE SE QUERÍA ENVIAR, ES LA DE LO QUE SE
   ENVÍA. La diferencia la pone el paso 4 de la extensión: relee la lista de
   TikTok después de imprimir y devuelve, por número de pedido, si el paquete
   está ya "a la espera de recogida" y con qué número de seguimiento.

   Mientras no se haya hecho el paso 4 (`envios` vacío), esto se comporta como
   siempre y saca todos los paquetes: es mejor un manifiesto sin comprobar que
   ningún manifiesto. En cuanto hay comprobación, lo que no tiene etiqueta sale
   de la hoja y se enseña aparte, para poder ir a buscarlo al montón. */
function bultosDe(datos) {
  const envios = datos.envios || null;
  const dentro = [], fuera = [];
  for (const t of (datos.tandas || [])) {
    for (const c of (t.compradores || [])) {
      const ids = (c.pedidos && c.pedidos.length ? c.pedidos : [c.pedido]).filter(Boolean).map(String);
      /* Con varios pedidos del mismo comprador, TikTok los junta en un envío:
         el que tenga seguimiento manda, y si ninguno lo tiene, el primero. */
      let e = null, idBueno = ids[0] || '';
      if (envios) {
        for (const id of ids) {
          const x = envios[id];
          if (!x) continue;
          if (!e || (!e.tracking && x.tracking)) { e = x; idBueno = id; }
        }
      }
      const b = {
        pedido: idBueno || c.pedido || '',
        pedidos: ids,
        apodo: c.apodo || '',
        usuario: c.usuario || '',
        prendas: (c.numeros || []).length,
        tanda: t.etiqueta || '',
        tracking: (e && e.tracking) || c.tracking || '',
        transportista: (e && e.transportista) || '',
        subestado: (e && e.subestado) || ''
      };
      if (!envios || e) dentro.push(b); else fuera.push(b);
    }
  }
  dentro.fuera = fuera;      // se cuelga aquí para no cambiar quién llama
  return dentro;
}

async function cargar() {
  const dia = $('dia').value;
  if (!CODIGO) {
    $('salida').innerHTML = `<div class="aviso rojo"><b>Falta el código en la dirección.</b><br>
      Esta página se abre con <code>?d=</code> y el código detrás.</div>`;
    return;
  }
  $('salida').innerHTML = '<div class="aviso ambar">Cargando…</div>';
  try {
    const r = await fetch('/api/tandas?d=' + encodeURIComponent(CODIGO) +
      (dia ? '&dia=' + dia : ''), { cache: 'no-store' });
    const j = await r.json();
    if (!j || !j.ok) throw new Error((j && j.detalle) || 'el servidor no ha contestado');
    if (!j.hay || !j.datos) {
      $('salida').innerHTML = `<div class="aviso ambar">
        <b>Todavía no hay tandas de este día.</b><br>
        El manifiesto sale de las mismas tarjetas que se imprimen para recoger, así que
        aparece en cuanto se calculan las tandas en el paso 2 de la extensión.</div>`;
      return;
    }
    ULTIMO = j;
    pintar(j);
  } catch (e) {
    $('salida').innerHTML = `<div class="aviso rojo"><b>No he podido preguntarle al servidor.</b><br>
      ${esc(e.message)}</div>`;
  }
}

function pintar(j) {
  const d = j.datos || {};
  const T = Object.assign({}, POR_DEFECTO, d.tienda || {});
  const bultos = bultosDe(d);
  const conTracking = bultos.filter((b) => b.tracking).length;
  const prendas = bultos.reduce((s, b) => s + b.prendas, 0);
  const fecha = new Date(j.generado || Date.now()).toLocaleDateString('es-ES');

  /* EL AVISO DE "SIN TRACKING" SALIA SIEMPRE, porque todavía no hay nada que
     rellene esa columna. Un aviso que sale todos los días deja de leerse, y
     entonces no sirve el día que diga algo. Ahora, mientras no haya ninguno,
     no se avisa: se explica en pequeño debajo de la tabla, que es donde se
     mira si a alguien le extraña la columna vacía. */
  let aviso = '';
  if (conTracking && conTracking < bultos.length) {
    aviso = `<div class="aviso ambar"><b>${conTracking} de ${bultos.length} bultos con tracking.</b>
      A los que faltan aún no se les ha creado la etiqueta.</div>`;
  }
  /* LO QUE SE HA QUEDADO FUERA. Es la parte que hay que ir a buscar al montón
     antes de que llegue el transportista: paquetes que se recogieron pero cuya
     etiqueta no llegó a crearse. */
  const fuera = bultos.fuera || [];
  if (fuera.length) {
    aviso += `<div class="aviso rojo"><b>${fuera.length} paquetes NO van en este manifiesto</b>
      porque no tienen etiqueta creada. Sácalos del montón:
      <div style="margin-top:6px;font-size:12px">${fuera.slice(0, 60).map((f) =>
        esc(f.apodo || f.usuario || f.pedido)).join(' · ')}${fuera.length > 60
          ? ' …y ' + (fuera.length - 60) + ' más' : ''}</div></div>`;
  }
  /* SI ESTÁ COMPROBADO O NO VA EN LETRA PEQUEÑA, NO EN UN AVISO.
     Un cartel que sale todos los días deja de leerse, y entonces no sirve el
     día que diga algo. Los avisos de arriba se guardan para lo que hay que
     hacer ahora: paquetes que faltan. */
  const sello = d.envios
    ? (d.comprobado && d.comprobado.cuando
        ? 'Comprobado contra el Centro de vendedores el ' +
          new Date(d.comprobado.cuando).toLocaleString('es-ES') + '.'
        : 'Comprobado contra el Centro de vendedores.')
    : 'Sin comprobar: esto es lo que se quería enviar. El paso 4 de la extensión confirma cuáles ' +
      'tienen ya la etiqueta y trae los números de seguimiento; también puedes subir aquí el PDF.';

  $('sub').textContent = j.dia + ' · ' + bultos.length +
    (bultos.length === 1 ? ' bulto · ' : ' bultos · ') + prendas + ' prendas';

  $('salida').innerHTML = aviso + `<div class="hoja">
    <!-- La errata "SHIPEMENT" venia en config.json de la extension y llego a
         imprimirse en papeles que firma un transportista. Se corrige aqui
         tambien, para que un PC con la config vieja no la vuelva a sacar. -->
    <h2>${esc(String(T.titulo || '').replace(/SHIPEMENT/i, 'SHIPMENT'))}</h2>
    <table class="meta">
      <tr><td class="k">Seller:</td><td>${esc(T.nombre)}</td></tr>
      <tr><td class="k">Warehouse:</td><td>${esc(T.almacen)}</td></tr>
      <tr><td class="k">Date:</td><td>${esc(fecha)}</td></tr>
      <tr><td class="k">Courier:</td><td>${esc(T.transportista || '')}</td></tr>
      <tr><td class="k">Paquetes:</td><td><b>${bultos.length}</b></td></tr>
      <!-- El total de prendas salía solo en el subtítulo de la pantalla, y el
           subtítulo no se imprime: el repartidor firmaba un papel que no decía
           cuántas prendas se llevaba. -->
      <tr><td class="k">Prendas:</td><td><b>${prendas}</b></td></tr>
    </table>
    <table class="lista">
      <tr><th>#</th><th>Order ID</th><th>Tracking ID</th><th>Comprador</th><th>Prendas</th></tr>
      ${bultos.map((b, i) => `<tr>
        <td class="nums">${i + 1}</td>
        <td class="nums">${esc(b.pedido)}</td>
        <td class="nums ${b.tracking ? '' : 'vacio'}">${b.tracking ? esc(b.tracking) : '—'}</td>
        <td>${esc(b.apodo)}</td>
        <td class="nums">${b.prendas}</td>
      </tr>`).join('')}
    </table>
    ${conTracking ? '' : `<p style="font-size:11px;color:#666;margin:8px 0 0">
      Tracking ID sin asignar: TikTok lo da al crear las etiquetas. La entrega se
      cuadra por Order ID, que es lo que sale impreso en cada etiqueta.</p>`}
    <p style="font-size:11px;color:#666;margin:6px 0 0">${esc(sello)}</p>
    <div class="firmas">
      <div class="firma"><div>${esc(T.firmaEntrega)} (${esc(T.nombre)})</div>
        <div class="linea"></div><div class="pie">Nombre y hora</div></div>
      <div class="firma"><div>${esc(T.firmaRecoge)} (${esc(T.transportista || 'transportista')})</div>
        <div class="linea"></div><div class="pie">Nombre y hora</div></div>
    </div>
    <div class="pagina">${esc(d.titulo || '')} · ${bultos.length} bultos · generado ${new Date().toLocaleString('es-ES')}</div>
  </div>`;
}

/* ===========================================================================
 * EL PDF DE LAS ETIQUETAS, COMO SEGUNDA FUENTE
 * ===========================================================================
 * El paso 4 de la extensión es la vía buena: pregunta a TikTok. Pero necesita
 * la extensión abierta en el ordenador donde se imprimió. Esto es el respaldo:
 * el PDF que sale de "Crear etiquetas" lleva impreso el Order ID de cada
 * paquete, así que leyéndolo se sabe QUÉ SE IMPRIMIÓ de verdad, sin depender de
 * nada más.
 *
 * Se lee aquí, en el navegador: el PDF no se sube a ningún sitio.
 *
 * NO decide solo: marca en la hoja los que aparecen en el PDF y avisa de los
 * que están en el manifiesto y NO salen en él, que son justo los que hay que ir
 * a buscar. Quien decide sigue siendo quien está delante.
 * ========================================================================= */
let PDFJS = null;
async function cargarPdfJs() {
  if (PDFJS) return PDFJS;
  await new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = ok; s.onerror = () => mal(new Error('no he podido cargar el lector de PDF'));
    document.head.appendChild(s);
  });
  PDFJS = window.pdfjsLib;
  PDFJS.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  return PDFJS;
}

async function textoDelPdf(archivo) {
  const lib = await cargarPdfJs();
  const doc = await lib.getDocument({ data: await archivo.arrayBuffer() }).promise;
  let texto = '';
  for (let n = 1; n <= doc.numPages; n++) {
    const pag = await doc.getPage(n);
    const t = await pag.getTextContent();
    texto += ' ' + t.items.map((i) => i.str).join(' ');
  }
  return { texto, paginas: doc.numPages };
}

$('botonPdf').onclick = () => $('pdf').click();
$('pdf').onchange = async (ev) => {
  const f = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!f || !ULTIMO) return;
  const antes = $('sub').textContent;
  $('sub').textContent = 'Leyendo el PDF…';
  try {
    const { texto, paginas } = await textoDelPdf(f);
    /* Los identificadores de pedido de TikTok son números largos: 18 cifras o
       más. Se cogen todos y se cruzan; no hace falta saber dónde los pinta. */
    const enPdf = new Set((texto.match(/\d{15,25}/g) || []));
    const bultos = bultosDe(ULTIMO.datos || {});
    const fuera = bultos.fuera || [];
    const impresos = [], sinImprimir = [];
    for (const b of bultos) {
      const suyo = (b.pedidos || [b.pedido]).some((id) => enPdf.has(String(id)));
      (suyo ? impresos : sinImprimir).push(b);
    }
    /* Y al revés: etiquetas del PDF que no están en el manifiesto. Suelen ser
       de otro día o de un paquete que se recogió sin pasar por aquí. */
    const nuestros = new Set(bultos.flatMap((b) => (b.pedidos || [b.pedido]).map(String))
      .concat(fuera.flatMap((b) => (b.pedidos || [b.pedido]).map(String))));
    const sobran = [...enPdf].filter((id) => !nuestros.has(id));
    const recuperados = fuera.filter((b) => (b.pedidos || [b.pedido]).some((id) => enPdf.has(String(id))));

    $('sub').textContent = antes;
    $('salida').insertAdjacentHTML('afterbegin', `<div class="aviso ${sinImprimir.length ? 'ambar' : 'verde'}">
      <b>PDF leído:</b> ${paginas} páginas, ${enPdf.size} etiquetas.
      <br><b>${impresos.length}</b> de los ${bultos.length} bultos del manifiesto salen en el PDF.
      ${sinImprimir.length ? `<br><b>${sinImprimir.length} NO salen</b> (no se han impreso):
        <span style="font-size:12px">${sinImprimir.slice(0, 40).map((b) =>
          esc(b.apodo || b.pedido)).join(' · ')}</span>` : ''}
      ${recuperados.length ? `<br><b>${recuperados.length} de los excluidos SÍ tienen etiqueta impresa</b>
        según el PDF: ${recuperados.slice(0, 40).map((b) => esc(b.apodo || b.pedido)).join(' · ')}.
        Vuelve a hacer el paso 4: puede que TikTok todavía no lo hubiera actualizado.` : ''}
      ${sobran.length ? `<br>${sobran.length} etiquetas del PDF no están en este manifiesto.` : ''}
    </div>`);
  } catch (e) {
    $('sub').textContent = antes;
    alert('No he podido leer el PDF: ' + e.message);
  }
};

$('imprimir').onclick = () => window.print();

$('csv').onclick = () => {
  if (!ULTIMO) return;
  const bultos = bultosDe(ULTIMO.datos || {});
  const filas = [['bulto', 'order_id', 'tracking_id', 'comprador', 'prendas', 'tanda'].join(';')]
    .concat(bultos.map((b, i) => [i + 1, b.pedido, b.tracking, b.apodo, b.prendas, b.tanda]
      .map((x) => '"' + String(x == null ? '' : x).replace(/"/g, '""') + '"').join(';')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + filas.join('\n')], { type: 'text/csv' }));
  a.download = 'manifiesto-' + ULTIMO.dia + '.csv';
  a.click();
};

$('ver').onclick = cargar;
$('dia').addEventListener('change', cargar);
$('dia').value = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Madrid' }).format(new Date());
cargar();
})();
</script>
</body>
</html>
